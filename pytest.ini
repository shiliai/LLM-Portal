# pytest 统一入口（issue #10）：仓库根直接 `pytest` 即发现全部服务单测。
# - testpaths 限定服务与部署目录，避免误扫工具、venv 与 node_modules
# - norecursedirs 在默认集合基础上显式再排除一遍本仓库会出现的目录
[pytest]
testpaths =
    compat
    console
    onboardd
    mcp-hub
    vps
norecursedirs =
    .*
    .venv
    venv
    node_modules
    build
    dist
    tools
    e2e
addopts = -q
