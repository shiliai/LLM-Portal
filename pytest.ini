# pytest 统一入口（issue #10）：仓库根直接 `pytest` 即发现全部服务单测。
# - testpaths 限定四个服务目录，避免误扫 planning/（外部代码）与 venv/node_modules
# - norecursedirs 在默认集合基础上显式再排除一遍本仓库会出现的目录
[pytest]
testpaths =
    execution/proto-remote-access/compat
    execution/proto-remote-access/console
    execution/proto-remote-access/onboardd
    execution/proto-remote-access/mcp-hub
    execution/proto-remote-access/vps
norecursedirs =
    .*
    .venv
    venv
    node_modules
    build
    dist
    planning
    e2e
addopts = -q
