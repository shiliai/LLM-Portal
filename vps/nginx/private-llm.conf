# {{DOMAIN}} — LLM-Portal 网关单入口（由 deploy.sh 渲染；external 模式并入既有 nginx）
# 占位符：{{LITELLM_UPSTREAM}}（共享网络内 litellm 容器）、{{COMPAT_UPSTREAM}}（协议兼容层容器）。
# #7 容器化后全部上游均为共享网络内容器名（private-llm-console / private-llm-onboardd /
# private-llm-mcp-hub / private-llm-compat），不再回宿主机
# 设计等价物：Caddy 路径分发 + flush_interval -1 → 此处 proxy_buffering off + 长读超时
#
# r6 公网暴露面（allowlist，US-P14）：
#   /                       网关主页（mcp-hub 托管静态页）
#   /v1/*                   双协议 API（LiteLLM）
#   = /key/info             用户自查 API（US-P10）
#   = /health/liveliness    主页状态灯
#   /mcp*                   MCP 端点（mcp-hub）
#   /onboard/install|register|confirm   站点接入（onboardd；/onboard/admin/* 公网 404）
#   /console                自写管理控制台（consoled:8300）
#   其余一律 404（LiteLLM /ui、/login、/sso、openapi/文档、全部管理 API 均不对公网）

# 此文件由 edge-nginx 的 conf.d 在 http context 引入；log_format 不能置于 server 中。
log_format private_llm_rid '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent rt=$request_time rid=$request_id';

# HTTP：ACME webroot + 跳转 HTTPS
server {
    listen 80;
    server_name {{DOMAIN}};
    add_header X-Request-Id $request_id always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS：allowlist 路径分发
server {
    listen 443 ssl;
    http2 on;
    server_name {{DOMAIN}};

    ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # /mcp/upload 图片上限 10MB + 协议开销
    client_max_body_size 15m;

    # issue #62：edge 侧 request_id（nginx 内建 $request_id）贯穿到日志与上游（经 X-Request-Id 头）。
    # 该 id 在 nginx -> compat -> LiteLLM 全链路一致，供跨层按 rid 对账；不写入指标标签（低基数）。
    access_log /var/log/nginx/private-llm.access.log private_llm_rid;
    error_log /var/log/nginx/private-llm.error.log warn;
    # nginx owns the canonical public correlation ID; avoid a duplicate compat echo.
    proxy_hide_header X-Request-Id;
    add_header X-Request-Id $request_id always;

    # ---- 精确匹配（优先级最高） ----

    # 网关主页（隐藏 LiteLLM Swagger 脸面；由 mcp-hub 托管静态页）
    location = / {
        proxy_pass http://private-llm-mcp-hub:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # 用户自查 API（US-P10；不带/错 Key 由 LiteLLM 401）
    location = /key/info {
        proxy_pass http://{{LITELLM_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 主页在线状态灯
    location = /health/liveliness {
        proxy_pass http://{{LITELLM_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # ---- 前缀匹配（最长优先） ----

    # 协议兼容层（issue #9）：三条路径经 compat-proxy（US-13 内联 system 规范化、强制工具
    # 选择兼容、OpenAI 流式 finish_reason 修正），其余 /v1/* 仍直达 LiteLLM。
    # 精确匹配优先于下方 /v1/ 前缀；query string（如 ?beta=true）不影响匹配。
    # SSE 语义与 /v1/ 前缀块一致：不缓冲 + 长读超时；鉴权头由 compat 原样透传给 LiteLLM。
    location = /v1/messages {
        proxy_pass http://{{COMPAT_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /v1/messages/count_tokens {
        proxy_pass http://{{COMPAT_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location = /v1/chat/completions {
        proxy_pass http://{{COMPAT_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # LiteLLM 双协议 API（/v1/models 等，三条 compat 路径已被上方精确匹配接管）——SSE 流式必需不缓冲
    location /v1/ {
        proxy_pass http://{{LITELLM_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # mcp-hub（Streamable HTTP + 上传 + 临时文件 + 用量）——SSE 不缓冲
    location /mcp {
        proxy_pass http://private-llm-mcp-hub:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # onboardd 管理端点不对公网开放（^~ 最长前缀拦截；site-tools 走本机 8100 不受影响）
    location ^~ /onboard/admin/ {
        return 404;
    }

    # onboardd 站点接入三端点（install 由站点机器 curl、register/confirm 由 install.sh 回调）
    location /onboard/ {
        proxy_pass http://private-llm-onboardd:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 自写管理控制台（consoled；会话鉴权在其内部完成）
    location /console {
        proxy_pass http://private-llm-console:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 收敛：其余一律 404（LiteLLM /ui、/login、/sso、/openapi.json、/redoc、/health、
    # /key/generate|block|update|delete、/model/*、/global/*、/spend/* 等管理面均在此拦截；
    # 本机仍可直查 127.0.0.1:4000，应急走 ssh -L 4000:127.0.0.1:4000）
    location / {
        return 404;
    }
}
