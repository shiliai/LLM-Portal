# private-llm 网关全容器栈（#7 容器化：一个 compose file 管 7 服务，docker 组用户可部署；issue #9 增 compat）
# 上游引用一律用容器名（compose 项目共享 external 网络时，裸服务名会与其他项目同名服务冲突，
# 实测被解析到 sub2api 的 postgres——沿用 litellm DATABASE_URL 的结论）。
# 对外入口三种模式（deploy.sh 按 .env 的 EDGE_MODE 选择）：
#   standalone（默认）：--profile edge --profile tls 起 edge-nginx + edge-certbot，
#                      80/443 由本栈发布，不依赖任何既有容器/目录布局；
#   external：反代到既有 nginx 容器（共享网络 + 注入 server 块，见 deploy.sh external 分支）；
#   offload：TLS 由上游设备（防火墙反代等）终结，仅起 edge-nginx（HTTP-only，
#            nginx/private-llm-offload.conf），certbot 不启用——外部 URL 形如
#            https://<域名>:<高位端口>/，须在 .env 设 PUBLIC_BASE 同步该地址。
# 127.0.0.1 端口发布仅供本机 CLI / 冒烟 / 调试，不暴露公网。
#
# 安全边界：console/onboardd 挂 docker.sock（经 docker exec 管理 wg sidecar / 重启 mcp-hub），
# 挂 sock 的容器 ≈ 宿主机 root——只给这两个管理面容器，有意取舍（见 runbook §7）；
# compat 无状态不落盘，以非 root（10001）运行。
name: private-llm

services:
  litellm:
    # 固定版本 tag（issue #10）：与开发/验证基线 LiteLLM 1.96.2 一致，避免 main-stable 滚动漂移
    image: ghcr.io/berriai/litellm:v1.96.2
    container_name: litellm
    restart: unless-stopped
    # BBR：litellm→站点 vLLM 的内层 TCP 走 wg 隧道（跨境 ~25% 晚高峰丢包），
    # CUBIC 会把随机丢包当拥塞退避成 ~4KB/s；BBR 对随机丢包鲁棒（sysctl 为 per-netns，须在容器上设）
    sysctls:
      net.ipv4.tcp_congestion_control: bbr
      net.ipv4.tcp_rmem: 4096 87380 16000000
      net.ipv4.tcp_wmem: 4096 65536 16000000
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm:/app/proxy:ro
    command: ["--config", "/app/proxy/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@private-llm-postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
    networks:
      - default
      - shared
    depends_on:
      - postgres

  # 协议兼容层（issue #9 / US-13 us13-v1）：nginx 三条 API 路径经此转 LiteLLM。
  # 无状态、不落盘、不挂 sock、不持密钥（鉴权头原样透传，鉴权/路由/记账仍归 litellm）
  compat:
    build: ../compat
    container_name: private-llm-compat
    restart: unless-stopped
    # 无状态服务以非 root 运行（issue #10 最小权限收敛）
    user: "10001:10001"
    environment:
      LITELLM_BASE: http://litellm:4000
    ports:
      - "127.0.0.1:8400:8400"   # 本机冒烟/调试
    networks:
      - default
      - shared
    depends_on:
      - litellm

  postgres:
    image: postgres:18.6-alpine
    container_name: private-llm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      # postgres 18+ 规范挂载点（镜像默认 PGDATA=/var/lib/postgresql/18/docker，须落在卷内；
      # 挂 …/data 会被 entrypoint 拒启）。注意：从旧布局（…/data）迁来需一次性 pg_dump 恢复
      - pgdata:/var/lib/postgresql

  mcp-hub:
    build: ../mcp-hub
    container_name: private-llm-mcp-hub
    restart: unless-stopped
    environment:
      LITELLM_BASE: http://litellm:4000
      # offload 模式外部 URL 带高位端口（https://域名:8080），与 DOMAIN 裸域名不同，允许显式覆盖
      PUBLIC_BASE: ${PUBLIC_BASE:-https://${DOMAIN}}
      # 仅作升级兼容；管理员保存后以 /etc/private-llm/vision/config.json 为准
      MCP_VISION_MODEL: ${MCP_VISION_MODEL:-}
      MCP_VISION_CONF: /etc/private-llm/vision/config.json
    volumes:
      # 状态（usage.db + uploads）落宿主机，容器重建不丢
      - /var/lib/private-llm/mcp-hub:/var/lib/private-llm/mcp-hub
      # consoled 写、mcp-hub 读（单文件 bind：write_text 截断写不换 inode，重启不失效）
      - /etc/private-llm/external-mcp.json:/etc/private-llm/external-mcp.json
      # 目录 bind 允许 consoled 原子替换 config.json 后运行态立即读取新 inode
      - /etc/private-llm/vision:/etc/private-llm/vision:ro
    ports:
      - "127.0.0.1:8200:8200"
    networks:
      - default
      - shared

  onboardd:
    build: ../onboardd
    container_name: private-llm-onboardd
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      # offload 模式:install/register 回调与站点 wg Endpoint 的地址语义（见 onboardd.py 头注）
      PUBLIC_BASE: ${PUBLIC_BASE:-https://${DOMAIN}}
      WG_ENDPOINT_HOST: ${WG_ENDPOINT_HOST:-${DOMAIN}}
      LITELLM_BASE: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ONBOARD_ADMIN_TOKEN: ${ONBOARD_ADMIN_TOKEN}
      WG_PORT: ${WG_PORT:-51820}
      WG_VPS_IP: ${WG_VPS_IP:-10.77.0.1}
      WG_SUBNET_PREFIX: ${WG_SUBNET_PREFIX:-10.77.0}
      # wg0 在宿主机 netns（wireguard sidecar 托管），经 docker.sock exec 操作
      WG_EXEC: docker exec private-llm-wireguard wg
    volumes:
      - /var/lib/private-llm/onboardd:/var/lib/private-llm/onboardd
      - /var/lib/private-llm/wireguard-public.key:/var/lib/private-llm/wireguard-public.key:ro
      # peer 持久化回写（与 wireguard sidecar 共享同一宿主机文件）
      - /etc/wireguard/wg0.conf:/etc/wireguard/wg0.conf
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8100:8100"   # site-add 等 CLI 走本机回环
    networks:
      - default
      - shared

  console:
    build: ../console
    container_name: private-llm-console
    restart: unless-stopped
    environment:
      LITELLM_BASE: http://litellm:4000
      ONBOARDD_URL: http://private-llm-onboardd:8100
      MCP_HUB_URL: http://private-llm-mcp-hub:8200
      MCP_HUB_READY_TIMEOUT: ${MCP_HUB_READY_TIMEOUT:-45}
      MCP_HUB_READY_POLL_INTERVAL: ${MCP_HUB_READY_POLL_INTERVAL:-0.5}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ONBOARD_ADMIN_TOKEN: ${ONBOARD_ADMIN_TOKEN}
      MCP_VISION_MODEL: ${MCP_VISION_MODEL:-}
      MCP_VISION_CONF: /etc/private-llm/vision/config.json
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      # 站点握手状态查询 / mcp-hub 重启（宿主机语义默认值见 console.py）
      WG_EXEC: docker exec private-llm-wireguard wg
      MCP_RESTART_CMD: docker restart private-llm-mcp-hub
    volumes:
      - /var/lib/private-llm/console:/var/lib/private-llm/console
      # 只读用量账本（mcp-hub 写、consoled 聚合读）
      - /var/lib/private-llm/mcp-hub:/var/lib/private-llm/mcp-hub:ro
      # 外部 MCP 注册表（consoled 写）
      - /etc/private-llm:/etc/private-llm
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8300:8300"
    networks:
      - default
      - shared

  wireguard:
    build: ./wireguard
    container_name: private-llm-wireguard
    restart: unless-stopped
    # host 网络：wg0 创建在宿主机网络命名空间——litellm 容器到站点（10.77.0.0/24）
    # 的路由经宿主机默认网关进 wg0，模型不变；NET_ADMIN 供 wg-quick/ip 操作接口
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /etc/wireguard/wg0.conf:/etc/wireguard/wg0.conf

  # ---- standalone 边缘（EDGE_MODE=standalone；--profile edge 启用）----
  # edge-nginx：80/443 单入口（渲染后的 nginx/private-llm.conf 挂 conf.d）。
  # 每 6h reload 一次以拾取 certbot 续期的新证书（无 docker.sock 的标准做法）。
  edge-nginx:
    image: nginx:1.28.3-alpine3.23
    container_name: private-llm-edge-nginx
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/lib/private-llm/edge/nginx/conf.d:/etc/nginx/conf.d:ro
      - /var/lib/private-llm/edge/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/private-llm/edge/www:/var/www/certbot:ro
    entrypoint: ["sh", "-c", "nginx -g 'daemon off;' & NGINX_PID=$$!; while :; do sleep 6h; nginx -s reload; done & wait $$NGINX_PID"]
    networks:
      - shared

  # edge-certbot：12h 续期循环（webroot 复用 edge-nginx 的 80 端口 ACME 路径）。
  # profile 独立于 edge-nginx（"tls"）：offload 模式只起 edge-nginx 不续证书
  edge-certbot:
    image: certbot/certbot:v5.7.0
    container_name: private-llm-edge-certbot
    profiles: ["tls"]
    restart: unless-stopped
    volumes:
      - /var/lib/private-llm/edge/letsencrypt:/etc/letsencrypt
      - /var/lib/private-llm/edge/www:/var/www/certbot
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"]

volumes:
  pgdata:

networks:
  # 对外入口网络：standalone 模式 deploy.sh 自动创建（默认 private-llm-edge）；
  # external 模式为既有 nginx 容器所在的 compose 网络（docker inspect 查）
  shared:
    external: true
    name: ${NGINX_SHARED_NETWORK:-private-llm-edge}
