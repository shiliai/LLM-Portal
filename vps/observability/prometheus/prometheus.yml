# private-llm 全链路分段可观测性（issue #62）——Prometheus 拉取配置
# 说明：本实例（VPS/NAS）自建；prometheus 用 host 网络，从回环拉取已发布的端点。
# 低基数：标签仅 instance/container/model/group/site/deployment/protocol/stream/status，
#         绝不带 request_id/调用方/正文/完整 IP。（D7）

global:
  scrape_interval: 15s      # 常规指标
  evaluation_interval: 30s  # 规则求值
  external_labels:
    portal_instance: "${HOSTNAME:-unknown}"   # VPS/NAS 标识（部署时注入实例名）

# 告警规则（记录 + 告警；通知通道见 README D1 后续 / RUNBOOK）
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # LiteLLM 原生 /metrics（请求量/延迟/token/活跃/错误 直方图，per model）
  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:4000"]

  # 自定义回调指标（TTFT/生成/错误/token + request_id 结构化日志）:48400
  - job_name: litellm-observability
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:48400"]

  # compat 协议层（parse / upstream_header / active / errors）
  - job_name: compat
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8400"]

  # Postgres 连接数（postgres-exporter，仅回环发布）
  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9187"]
    metric_relabel_configs:
      # 低基数：只保留数据库连接数/后台相关，避免表级高基数
      - source_labels: [__name__]
        regex: '(pg_stat_database_numbackends|pg_up|pg_stat_activity_connection_count|pg_settings_max_connections)'
        action: keep

  # 实例 OS（node-exporter host 网络）
  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # 容器层（cadvisor；按容器名聚合，标签有界）
  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8080"]
    relabel_configs:
      - source_labels: [__name__]
        regex: '(container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_memory_rss|container_start_time_seconds|container_oom_events_total|container_restart_count|container_network_receive_bytes_total|container_network_transmit_bytes_total)'
        action: keep
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '__.*'
        action: drop

  # WireGuard 站点链路：blackbox HTTP 探针（60s 低频，不扰动模型服务）（D5）
  - job_name: blackbox-sites
    metrics_path: /probe
    scrape_interval: 60s
    params:
      module: [http_2xx]
      target: ["${SITE_TARGETS:-http://10.77.0.11:8890/health}"]
    static_configs:
      - targets:
          - 127.0.0.1:9115
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
        replacement: "${SITE_TARGETS:-http://10.77.0.11:8890/health}"
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Prometheus 自身
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9090"]
