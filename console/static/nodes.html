<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>节点性能 · 远程模型网关</title><link rel="stylesheet" href="assets/portal.css"><link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml"></head>
<body data-page="nodes"><template id="page">
  <div class="pf-toolbar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
    <select class="pf-select" id="node-filter"><option value="">全部节点</option></select>
    <select class="pf-select" id="node-interval"><option value="10" selected>每 10 秒</option><option value="15">每 15 秒</option><option value="30">每 30 秒</option><option value="60">每 1 分钟</option></select>
    <label class="pf-switch" title="按所选间隔自动更新"><input type="checkbox" id="node-auto" checked><span></span></label><span class="pf-desc">自动更新</span>
    <span class="pf-desc" id="node-updated" style="margin-left:auto">等待数据…</span>
  </div>
  <div class="pf-grid cols-4">
    <div class="pf-stat"><div class="pf-stat-label">输出速度</div><div class="pf-stat-value" id="node-output">—</div><div class="pf-stat-sub">可用节点合计</div></div>
    <div class="pf-stat"><div class="pf-stat-label">活动请求</div><div class="pf-stat-value" id="node-active">—</div><div class="pf-stat-sub" id="node-queue">排队 —</div></div>
    <div class="pf-stat"><div class="pf-stat-label">节点健康</div><div class="pf-stat-value" id="node-health">—</div><div class="pf-stat-sub">VictoriaMetrics up</div></div>
    <div class="pf-stat"><div class="pf-stat-label">指标覆盖</div><div class="pf-stat-value" id="node-coverage">—</div><div class="pf-stat-sub">缺失指标显示 —</div></div>
  </div>
  <div class="pf-card flush" style="margin-top:14px"><div class="pf-card-head"><div class="pf-card-title">节点吞吐趋势</div><div class="pf-card-extra">图表容器固定 · 数据自动更新</div></div><div id="node-trend" style="height:180px;padding:8px 14px"></div></div>
  <div class="pf-card flush" style="margin-top:14px"><div class="pf-card-head"><div class="pf-card-title">节点资源矩阵</div><div class="pf-card-extra">实时采集</div></div><table class="pf-table"><thead><tr><th>节点</th><th>运行时</th><th>输出速度</th><th>活动 / 排队</th><th>KV Cache</th><th>GPU 活跃度</th><th>状态</th></tr></thead><tbody id="node-rows"></tbody></table></div>
</template><script src="assets/portal.js"></script><script>
(function(){'use strict';function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function fmt(n){return n==null?'—':Number(n).toFixed(1)}
function trend(rows){var W=900,H=150,p=24,n=rows.length||1,max=Math.max.apply(null,rows.map(function(x){return x.v||0}).concat([1])),pts=rows.map(function(x,i){var X=p+(W-2*p)*(n===1?.5:i/(n-1)),Y=H-p-(H-2*p)*(x.v||0)/max;return X.toFixed(1)+','+Y.toFixed(1)}).join(' ');document.getElementById('node-trend').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="100%" preserveAspectRatio="none"><path d="M'+pts+'" fill="none" stroke="#1677ff" stroke-width="3" stroke-linecap="round"/></svg>'}
function load(){var selected=document.getElementById('node-filter').value;window.pfApi('GET','/overview').then(function(d){var rows=(d.sites.rows||[]).filter(function(s){return !selected||s.name===selected||s.wg_ip===selected});var out=0,active=0,queue=0,available=0,fields=0,total=rows.length*4;rows.forEach(function(s){var m=s.metrics||{};if(s.status==='online')available++;out+=Number(m.output_tok_s||0);active+=Number(m.requests_running||0);queue+=Number(m.requests_waiting||0);['output_tok_s','requests_running','kv_cache_pct','gpu_util_pct'].forEach(function(k){if(m[k]!=null)fields++})});document.getElementById('node-output').textContent=out?fmt(out)+' tok/s':'—';document.getElementById('node-active').textContent=active;document.getElementById('node-queue').textContent='排队 '+queue;document.getElementById('node-health').innerHTML=available+'<small>/'+rows.length+'</small>';document.getElementById('node-coverage').textContent=total?Math.round(fields/total*100)+'%':'—';var f=document.getElementById('node-filter'),old=f.value,opts=Array.from(new Map((d.sites.rows||[]).map(function(s){return [s.name,s]})).values());f.innerHTML='<option value="">全部节点</option>'+opts.map(function(s){return '<option value="'+esc(s.name)+'">'+esc(s.name)+'</option>'}).join('');if(opts.some(function(s){return s.name===old}))f.value=old;document.getElementById('node-rows').innerHTML=rows.map(function(s){var m=s.metrics||{};return '<tr><td>'+esc(s.name)+'</td><td>'+esc(m.runtime||'—')+'</td><td>'+fmt(m.output_tok_s)+(m.output_tok_s==null?'':' tok/s')+'</td><td>'+ (m.requests_running==null?'—':Math.round(m.requests_running))+' / '+(m.requests_waiting==null?'—':Math.round(m.requests_waiting))+'</td><td>'+fmt(m.kv_cache_pct)+(m.kv_cache_pct==null?'':'%')+'</td><td>'+fmt(m.gpu_util_pct)+(m.gpu_util_pct==null?'':'%')+'</td><td><span class="pf-chip '+(s.status==='online'?'ok':'warn')+'">'+esc(s.status||'未知')+'</span></td></tr>'}).join('')||'<tr><td colspan="7" class="pf-desc">暂无节点数据</td></tr>';trend(rows.map(function(s){return {v:Number((s.metrics||{}).output_tok_s||0)}}));document.getElementById('node-updated').textContent='最近刷新 '+new Date().toLocaleTimeString('zh-CN')}).catch(function(e){window.pfErr(e.error||'加载失败')})}
window.pfReady.then(function(){var timer=null;function schedule(){if(timer)clearInterval(timer);timer=document.getElementById('node-auto').checked?setInterval(load,Number(document.getElementById('node-interval').value||10)*1000):null}document.getElementById('node-filter').addEventListener('change',load);document.getElementById('node-auto').addEventListener('change',schedule);document.getElementById('node-interval').addEventListener('change',schedule);schedule();load()})})();</script></body></html>
