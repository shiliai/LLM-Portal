<title>节点性能 · 远程模型网关</title><link rel="stylesheet" href="assets/portal.css"><link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
<style>
  #nd-summary, #nd-blocks { margin-bottom: 12px; }
  .nd-dashboard { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:10px; }
  .nd-dashboard + .nd-dashboard { margin-top:12px; }
  .nd-dashboard-bar { display:flex; align-items:center; gap:8px; min-height:28px; padding-bottom:9px; border-bottom:1px solid var(--border); }
  .nd-dashboard-title { color:var(--heading); font-size:13px; font-weight:600; margin-right:auto; }
  .nd-dashboard-title span { color:var(--muted); font-weight:400; }
  .nd-dashboard-meta { color:var(--muted); font:10px var(--mono); }
  .nd-row { margin-top:11px; }
  .nd-row-head { display:flex; align-items:center; gap:7px; margin-bottom:6px; color:var(--heading); font-size:11px; font-weight:600; }
  .nd-row-head button { width:20px; height:20px; padding:0; border:0; background:none; color:var(--muted); cursor:pointer; }
  .nd-row-head button:hover { color:var(--accent); }
  .nd-row-meta { margin-left:auto; color:var(--muted); font:10px var(--mono); font-weight:400; }
  .nd-grid { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:8px; }
  .nd-stats { grid-template-columns:repeat(5,minmax(0,1fr)); }
  .nd-panel { min-width:0; padding:9px 10px; background:var(--panel); border:1px solid var(--border); border-radius:3px; }
  .nd-panel.nd-span-3 { grid-column:span 3; }
  .nd-panel.nd-span-4 { grid-column:span 4; }
  .nd-panel.nd-span-5 { grid-column:span 5; }
  .nd-panel.nd-span-6 { grid-column:span 6; }
  .nd-panel.nd-span-7 { grid-column:span 7; }
  .nd-panel.nd-span-8 { grid-column:span 8; }
  .nd-panel.nd-span-12 { grid-column:span 12; }
  .nd-panel-head { display:flex; align-items:center; gap:8px; margin-bottom:7px; color:var(--text2); font-size:11px; }
  .nd-panel-head small { margin-left:auto; color:var(--muted); font:10px var(--mono); }
  .nd-panel-menu { color:var(--muted); letter-spacing:1px; }
  .nd-history-grid { margin-top:8px; }
  .nd-cluster-members { display:flex; gap:9px; flex-wrap:wrap; margin-left:auto; }
  .nd-cluster-dashboard .nd-dashboard-bar { align-items:flex-start; }
  .nd-stat { display:flex; align-items:baseline; gap:5px; color:var(--heading); font:600 23px/1 var(--mono); }
  .nd-stat small { color:var(--muted); font-size:10px; font-weight:400; }
  .nd-stat-sub { margin-top:7px; color:var(--muted); font:10px var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nd-stat-sub.good { color:var(--green); }
  .nd-stat-sub.warn { color:var(--amber); }
  .nd-mini-chart { height:66px; margin-top:7px; }
  .nd-mini-chart svg { width:100%; height:100%; display:block; }
  .nd-chart { height:220px; }
  .nd-chart.short { height:168px; }
  .nd-resource-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; }
  .nd-resource { min-width:0; padding:8px; background:var(--panel2); border:1px solid var(--border); border-radius:3px; }
  .nd-resource-label { color:var(--muted); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nd-resource-value { margin-top:5px; color:var(--heading); font:600 14px var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nd-resource-value small { color:var(--muted); font-size:10px; font-weight:400; }
  .nd-resource-sub { margin-top:4px; color:var(--text2); font:10px var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nd-resource-sub.good { color:var(--green); }
  .nd-resource-sub.warn { color:var(--amber); }
  .nd-node-block { border-left:2px solid var(--accent); }
  .nd-node-block.nd-span-6 { grid-column:span 6; }
  .nd-node-head { display:flex; align-items:center; gap:7px; margin-bottom:9px; }
  .nd-node-name { color:var(--heading); font-size:12px; font-weight:600; }
  .nd-node-head .pf-desc { margin-left:auto; }
  .nd-member-status { display:inline-flex; align-items:center; gap:5px; color:var(--text2); font-size:10px; }
  .nd-member-list { display:grid; gap:6px; }
  .nd-member-row { display:grid; grid-template-columns:minmax(145px,1fr) 100px 105px 105px; align-items:center; gap:9px; padding:8px 9px; border:1px solid var(--border); border-radius:3px; background:var(--panel2); }
  .nd-member-main { min-width:0; }
  .nd-member-name { color:var(--heading); font-size:11px; font-weight:600; }
  .nd-member-meta { margin-top:3px; color:var(--muted); font:10px var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nd-member-metric { color:var(--muted); font:10px var(--mono); }
  .nd-member-metric strong { display:block; color:var(--heading); font-size:12px; }
  .nd-member-status { justify-self:end; }
  .nd-empty { padding:30px 12px; color:var(--muted); text-align:center; font-size:11px; }
  .nd-node-inference { margin-bottom:8px; }
  .nd-node-inference .nd-panel { min-height:0; }
  .nd-node-inference .nd-stat { font-size:18px; }
  @media (max-width:980px) { .nd-stats { grid-template-columns:repeat(3,minmax(0,1fr)); } .nd-panel.nd-span-3,.nd-panel.nd-span-4,.nd-panel.nd-span-5,.nd-panel.nd-span-6,.nd-panel.nd-span-7,.nd-panel.nd-span-8 { grid-column:span 6; } .nd-resource-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (max-width:640px) { .nd-grid { grid-template-columns:1fr; } .nd-stats,.nd-resource-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .nd-panel.nd-span-3,.nd-panel.nd-span-4,.nd-panel.nd-span-5,.nd-panel.nd-span-6,.nd-panel.nd-span-7,.nd-panel.nd-span-8,.nd-panel.nd-span-12,.nd-node-block.nd-span-6 { grid-column:span 1; } .nd-cluster-dashboard .nd-dashboard-bar { display:block; } .nd-cluster-members { margin:8px 0 0; } .nd-member-row { grid-template-columns:1fr 1fr; } .nd-member-status { justify-self:start; } }
</style></head>
<body data-page="nodes"><template id="page">
  <div class="pf-toolbar">
    <div class="pf-tb-item"><label>节点</label><select class="pf-select" id="nd-node"><option value="">全部节点</option></select></div>
    <div class="pf-tb-item"><label>时间范围</label><div class="pf-seg" id="nd-win">
      <button data-h="1" class="on">1小时</button><button data-h="6">6小时</button><button data-h="24">24小时</button><button data-h="168">7天</button>
    </div></div>
    <div class="pf-tb-right">
      <span class="pf-tb-item"><label>自动刷新</label><label class="pf-switch" title="按所选间隔自动更新"><input type="checkbox" id="nd-auto" checked><span></span></label></span>
      <div class="pf-seg" id="nd-interval">
        <button data-int="10" class="on">10s</button><button data-int="15">15s</button>
        <button data-int="30">30s</button><button data-int="60">60s</button>
      </div>
      <span>最近更新 <span id="nd-last" style="color:var(--accent)">--:--:--</span></span>
      <span>下次刷新 <span id="nd-cd" style="color:var(--amber)">10s</span></span>
      <button class="pf-btn primary" id="nd-refresh" type="button">⟳ 刷新</button>
    </div>
  </div>
  <div id="nd-summary"></div>
  <div id="nd-blocks"></div>
</template>
<script src="assets/vendor/echarts.min.js"></script>
<script src="assets/portal.js?v=20260914-spa"></script>
<script>
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function dash() { return '<span style="color:var(--muted)">—</span>'; }
  function num(v, digits, unit) {
    if (v == null) return dash();
    return (digits ? v.toFixed(digits) : Math.round(v).toLocaleString('zh-CN')) + (unit ? '<span class="unit"> ' + unit + '</span>' : '');
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tsLabel(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function spark(points, w, h, color) {
    w = w || 78; h = h || 15;
    var data = (points || []).map(function (p) { return p[1]; });
    if (data.length < 2) return '';
    var min = Math.min.apply(null, data), max = Math.max.apply(null, data), span = (max - min) || 1;
    var pts = data.map(function (v, i) { return ((i / (data.length - 1)) * w).toFixed(1) + ',' + (h - 1 - ((v - min) / span) * (h - 2)).toFixed(1); }).join(' ');
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '"><polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.3"/></svg>';
  }
  function pctTile(pct, cls) {
    if (pct == null) return '';
    var c = cls || (pct > 85 ? 'c-err' : (pct > 65 ? 'c-warn' : ''));
    return '<div class="pf-bar"><i class="' + c + '" style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div>';
  }

  function TC() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    return {
      text2: light ? '#475569' : '#9ca3af', muted: light ? '#64748b' : '#6b7280',
      border: light ? '#e2e8f0' : '#1f2937', panel2: light ? '#f8fafc' : '#151b26',
      s: light ? { cyan: '#4f46e5', green: '#16a34a', amber: '#d97706', red: '#dc2626', blue: '#2563eb', violet: '#7c3aed' }
               : { cyan: '#22d3ee', green: '#34d399', amber: '#fbbf24', red: '#f87171', blue: '#60a5fa', violet: '#a78bfa' }
    };
  }
  var NODE_COLORS = ['cyan', 'blue', 'green', 'violet', 'amber'];
  var charts = {};
  function resetCharts() {
    Object.keys(charts).forEach(function (id) {
      try { if (charts[id] && !charts[id].isDisposed()) charts[id].dispose(); } catch (e) { /* stale canvas */ }
    });
    charts = {};
  }
  function getChart(id) {
    var dom = document.getElementById(id);
    if (!dom) return null;
    if (charts[id] && charts[id].isDisposed()) delete charts[id];
    if (!charts[id]) charts[id] = echarts.init(dom, null, { renderer: 'canvas' });
    return charts[id];
  }
  function axisStyle(t) {
    return { axisLine: { lineStyle: { color: t.border } }, axisLabel: { color: t.muted, fontSize: 10, fontFamily: 'ui-monospace,Menlo,monospace' }, splitLine: { lineStyle: { color: t.panel2 } } };
  }
  function baseGrid() { return { left: 44, right: 38, top: 26, bottom: 24 }; }
  function baseTooltip(t) {
    return { trigger: 'axis', backgroundColor: t.panel2, borderColor: t.border,
      textStyle: { color: t.text2, fontSize: 11, fontFamily: 'ui-monospace,Menlo,monospace' } };
  }

  var st = { hours: 1, node: '', interval: 10, left: 10, ov: null, hist: {} };  // hist[rowKey]={speed,pre,kv,gpu,temp,power}

  function rowKey(s) { return String(s.site_name || s.name || '').replace(/[^A-Za-z0-9_-]/g, '_') + (s.instance ? '--' + String(s.instance).replace(/[^A-Za-z0-9_-]/g, '_') : ''); }
  function clusterKey(s) { return String(s.name || '').replace(/[^A-Za-z0-9_-]/g, '_'); }
  function sharedMember(s) {
    return (s.members || []).find(function (m) {
      var metrics = m.metrics || {};
      return ['output_tok_s', 'input_tok_s', 'requests_running', 'kv_cache_pct', 'spec_accept_pct']
        .some(function (key) { return metrics[key] != null; });
    }) || (s.members || [])[0] || { metrics: {} };
  }
  function dashboardNodes() {
    var rows = (st.ov && st.ov.sites.rows) || [];
    rows = rows.filter(function (s) { return !st.node || s.name === st.node; });
    var out = [];
    rows.forEach(function (s) {
      if (s.cluster && Array.isArray(s.members) && s.members.length) {
        s.members.forEach(function (m) {
          out.push({ site_name: s.name, name: s.name, instance: m.instance,
            display_name: (s.display_name || s.name) + ' · ' + (m.display_name || m.instance),
            parent_display_name: s.display_name || s.name, status: m.status,
            wg_ip: s.wg_ip, address: s.address, metrics: m.metrics || {}, cluster_member: true });
        });
      } else {
        out.push(Object.assign({}, s, { site_name: s.name }));
      }
    });
    return out;
  }

  function visibleNodes() {
    return dashboardNodes();
  }

  function renderSummary() {
    var box = document.getElementById('nd-summary');
    if (!box) return;
    var rows = ((st.ov && st.ov.sites.rows) || []).filter(function (s) { return !st.node || s.name === st.node; });
    var clusters = rows.filter(function (s) { return s.cluster && Array.isArray(s.members) && s.members.length; });
    if (!clusters.length) {
      if (box.dataset.sig !== 'empty') resetCharts();
      box.dataset.sig = 'empty';
      box.innerHTML = '';
      return;
    }
    var summarySig = clusters.map(clusterKey).join(',') + '|' + st.hours + '|' + st.interval;
    if (box.dataset.sig === summarySig) return;
    resetCharts();
    box.dataset.sig = summarySig;
    box.innerHTML = clusters.map(function (s) {
      var online = s.members.filter(function (m) { return m.status === 'online'; }).length;
      var key = clusterKey(s);
      var members = s.members.map(function (m) {
        var ok = m.status === 'online';
        return '<span class="nd-member-status"><span class="pf-dot ' + (ok ? 'ok' : 'warn') + '"></span>' +
          esc(m.display_name || m.instance) + ' · ' + (ok ? '在线' : '暂无数据') + '</span>';
      }).join('');
      return '<div class="nd-dashboard nd-cluster-dashboard">' +
        '<div class="nd-dashboard-bar"><div class="nd-dashboard-title">' + esc(s.display_name || s.name) + ' <span>/ cluster shared</span></div>' +
          '<div class="nd-member-list nd-cluster-members">' + members + '</div>' +
          '<span class="nd-dashboard-meta">' + online + '/' + s.members.length + ' online</span></div>' +
        '<div class="nd-row">' +
          '<div class="nd-row-head"><button class="nd-collapse" type="button" aria-expanded="true" aria-label="折叠推理区">⌄</button>' +
            '<span>推理 / Cluster shared</span><span class="nd-row-meta">5 stat panels · refresh ' + st.interval + 's</span></div>' +
          '<div class="nd-content">' +
            '<div class="nd-grid nd-stats" id="ni-' + esc(key) + '"></div>' +
            '<div class="nd-grid nd-history-grid">' +
              ndChartPanel('吞吐趋势', 'last ' + st.hours + 'h', 'ch-nd-shared-tps-' + esc(key), 'nd-span-8') +
              ndChartPanel('KV Cache / 请求压力', 'last ' + st.hours + 'h', 'ch-nd-shared-res-' + esc(key), 'nd-span-4') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  async function fetchHist(nodes, hours) {
    var metrics = ['output_tok_s', 'input_tok_s', 'kv_cache_pct', 'gpu_util_pct', 'gpu_temp_c', 'power_w'];
    var jobs = [], jobIndex = {};
    nodes.forEach(function (s) {
      metrics.forEach(function (m) {
        /* GB10 inference is cluster-wide; only host resources are instance-scoped. */
        var shared = s.cluster_member && ['output_tok_s', 'input_tok_s', 'kv_cache_pct'].indexOf(m) >= 0;
        var query = '&site=' + encodeURIComponent(s.site_name || s.name) +
          (shared ? '' : (s.instance ? '&instance=' + encodeURIComponent(s.instance) : ''));
        var requestKey = (shared ? 'shared:' + (s.site_name || s.name) : rowKey(s)) + ':' + m;
        if (jobIndex[requestKey] == null) {
          jobIndex[requestKey] = jobs.length;
          jobs.push({ key: requestKey, promise: window.pfApi('GET', '/metrics/range?metric=' + m + query + '&hours=' + hours).catch(function () { return null; }) });
        }
      });
    });
    var out = await Promise.all(jobs.map(function (job) { return job.promise; }));
    var histories = {};
    jobs.forEach(function (job, i) { histories[job.key] = (out[i] || {}).points || []; });
    nodes.forEach(function (s) {
      var key = rowKey(s);
      function points(metric) {
        var shared = s.cluster_member && ['output_tok_s', 'input_tok_s', 'kv_cache_pct'].indexOf(metric) >= 0;
        return histories[(shared ? 'shared:' + (s.site_name || s.name) : key) + ':' + metric] || [];
      }
      var hist = {
        speed: points('output_tok_s'), pre: points('input_tok_s'), kv: points('kv_cache_pct'),
        gpu: points('gpu_util_pct'), temp: points('gpu_temp_c'), power: points('power_w')
      };
      // The range endpoint is sampled independently from /overview.  Append
      // the same live snapshot used by the tiles so the rightmost chart point
      // cannot show the previous 10-second interval beside newer card values.
      var m = s.metrics || {};
      var now = Math.floor(Date.now() / 1000);
      function appendLive(points, value) {
        if (value == null || !isFinite(Number(value))) return points;
        var next = (points || []).slice();
        var point = [now, Number(value)];
        if (next.length && next[next.length - 1][0] >= now) next[next.length - 1] = point;
        else next.push(point);
        return next;
      }
      hist.speed = appendLive(hist.speed, m.output_tok_s);
      hist.pre = appendLive(hist.pre, m.input_tok_s);
      hist.kv = appendLive(hist.kv, m.kv_cache_pct);
      hist.gpu = appendLive(hist.gpu, m.gpu_util_pct);
      hist.temp = appendLive(hist.temp, m.gpu_temp_c);
      hist.power = appendLive(hist.power, m.power_w);
      st.hist[key] = hist;
    });
  }

  function buildBlock(s, idx) {
    var t = TC();
    var color = t.s[NODE_COLORS[idx % NODE_COLORS.length]];
    var m = s.metrics || {};
    var key = rowKey(s);
    var online = s.status === 'online';
    var revoked = s.status === 'revoked';
    var groups = [m.memory_used_mib != null || m.memory_total_mib != null, m.gpu_memory_used_mib != null,
      m.gpu_util_pct != null, m.gpu_temp_c != null, m.power_w != null];
    var nGroups = groups.filter(Boolean).length;
    var full = nGroups === 5;
    var partial = nGroups > 0 && !full;
    var addr = s.wg_ip || (s.address || '').replace(/^https?:\/\//, '') || '—';
    var statusText = s.status === 'no_data' ? '暂无数据' : (s.status || '未知');
    var chartsMarkup = s.cluster_member
      ? '<div class="nd-grid nd-history-grid">' +
          ndChartPanel('GPU 活跃度趋势', 'instance · last ' + st.hours + 'h', 'ch-nd-res-' + esc(key), 'nd-span-7') +
          ndChartPanel('温度 / 功耗', 'instance · last ' + st.hours + 'h', 'ch-nd-thermal-' + esc(key), 'nd-span-5') +
        '</div>'
      : '<div class="nd-grid nd-history-grid">' +
          ndChartPanel('吞吐趋势', 'last ' + st.hours + 'h', 'ch-nd-tps-' + esc(key), 'nd-span-8') +
          ndChartPanel('KV / GPU 活跃度', 'last ' + st.hours + 'h', 'ch-nd-res-' + esc(key), 'nd-span-4') +
          ndChartPanel('温度 / 功耗', 'last ' + st.hours + 'h', 'ch-nd-thermal-' + esc(key), 'nd-span-12') +
        '</div>';
    return '<section class="nd-panel nd-node-panel nd-node-block pf-node-block' + (s.cluster_member ? ' pf-cluster-node' : '') + ' nd-span-6">' +
      '<div class="nd-node-head">' +
        '<span class="pf-dot ' + (online ? 'ok' : revoked ? 'gray' : 'warn') + '"></span>' +
        '<span class="nd-node-name" style="color:' + color + '">' + esc(s.display_name || s.name) + '</span>' +
        '<span class="pf-chip gray">' + esc(m.runtime || 'runtime —') + '</span>' +
        '<span class="pf-chip gray">' + esc(addr) + '</span>' +
        (online ? '<span class="pf-chip ok"><span class="pf-dot ok" style="margin-right:0"></span>up</span>'
                : revoked ? '<span class="pf-chip gray">已吊销</span>'
                : '<span class="pf-chip ' + (s.status === 'no_data' ? 'gray' : 'warn') + '">' + esc(statusText) + '</span>') +
        (full ? '<span class="pf-chip accent">exporter 完整</span>'
              : partial ? '<span class="pf-chip warn">exporter 部分</span>' : '') +
        '<span class="pf-desc">最近采集 <span style="color:var(--accent)">' + (online ? '刚刚' : '—') + '</span></span>' +
      '</div>' +
      (s.cluster_member ? '<div class="nd-resource-grid" id="nm-' + esc(key) + '"></div>' :
        '<div class="nd-grid nd-stats nd-node-inference" id="nm-' + esc(key) + '"></div>' +
        '<div class="nd-resource-grid" id="nr-' + esc(key) + '"></div>') +
      chartsMarkup +
    '</section>';
  }

  function ndChartPanel(title, meta, id, span) {
    return '<div class="nd-panel ' + (span || 'nd-span-6') + '"><div class="nd-panel-head"><span>' + esc(title) + '</span>' +
      '<small>' + esc(meta || '') + '</small><span class="nd-panel-menu" aria-hidden="true">⋮</span></div>' +
      '<div id="' + id + '" class="pf-chart nd-chart"></div></div>';
  }

  function ndStatPanel(label, value, sub, cls, mini) {
    return '<div class="nd-panel nd-stat-panel' + (cls ? ' ' + cls : '') + '">' +
      '<div class="nd-panel-head"><span>' + label + '</span><small>now</small><span class="nd-panel-menu" aria-hidden="true">⋮</span></div>' +
      '<div class="nd-stat">' + value + '</div><div class="nd-stat-sub">' + sub + '</div>' +
      (mini ? '<div class="nd-mini-chart">' + mini + '</div>' : '') + '</div>';
  }

  function inferencePanels(s) {
    var m = s.metrics || {};
    var hist = st.hist[rowKey(s)] || {};
    var act = m.requests_running == null ? null : Math.round(m.requests_running);
    var que = m.requests_waiting == null ? null : Math.round(m.requests_waiting);
    var kvHit = m.cache_hit_pct == null ? null : m.cache_hit_pct;
    var spec = m.spec_accept_pct == null ? null : m.spec_accept_pct;
    return [
      ndStatPanel('输出吞吐', num(m.output_tok_s, 1, 'tok/s'), act == null ? 'cluster shared' : 'cluster shared · ' + act + ' active', 'c-accent', spark(hist.speed, 150, 32, TC().s.cyan)),
      ndStatPanel('输入吞吐 / Prefill', num(m.input_tok_s, 1, 'tok/s'), 'cluster shared', 'c-violet', spark(hist.pre, 150, 32, TC().s.violet)),
      ndStatPanel('活动 / 排队',
        (act == null ? dash() : act) + ' <span class="unit">/ ' + (que == null ? dash() : que) + '</span>',
        '实时并发' + pctTile(act == null ? null : act * 12.5), 'c-green'),
      ndStatPanel('KV Cache / 命中率',
        m.kv_cache_pct == null ? dash() : m.kv_cache_pct.toFixed(0) + '<span class="unit">%</span>',
        '命中 ' + (kvHit == null ? '<span style="color:var(--muted)">—</span>' : kvHit.toFixed(1) + '%') + pctTile(m.kv_cache_pct, 'c-accent'), 'c-accent', spark(hist.kv, 150, 32, TC().s.cyan)),
      ndStatPanel('MTP / TAR 接受率',
        spec == null ? dash() : spec.toFixed(1) + '<span class="unit">%</span>',
        spec == null ? 'exporter 未提供指标' : '推测解码 · exporter', spec == null ? '' : 'c-violet')
    ].join('');
  }

  function resourceMetric(label, value, sub, cls) {
    return '<div class="nd-resource"><div class="nd-resource-label">' + label + '</div><div class="nd-resource-value' +
      (cls ? ' ' + cls : '') + '">' + value + '</div><div class="nd-resource-sub">' + sub + '</div></div>';
  }

  function resourceMetrics(s) {
    var m = s.metrics || {};
    var memoryLabel = m.memory_kind === 'unified' ? '统一内存' : '显存';
    var tiles = [
      resourceMetric(memoryLabel + ' 已用 / 总量',
        (m.memory_used_mib == null ? dash() : Math.round(m.memory_used_mib).toLocaleString('zh-CN')) +
          ' <span class="unit">/ ' + (m.memory_total_mib == null ? '—' : Math.round(m.memory_total_mib).toLocaleString('zh-CN') + ' MiB') + '</span>',
        m.memory_used_mib == null && m.memory_total_mib == null ? 'exporter 未提供内存指标' : (m.memory_kind === 'unified' ? 'GB10 agent · MiB' : 'DCGM · MiB')),
      resourceMetric(memoryLabel + ' 剩余', m.memory_free_mib == null ? dash() : Math.round(m.memory_free_mib).toLocaleString('zh-CN') + '<span class="unit"> MiB</span>',
        m.memory_free_mib == null ? 'exporter 未提供内存指标' : (m.memory_kind === 'unified' ? 'GB10 agent · mem_avail' : 'DCGM · FB_FREE'))
    ];
    if (m.gpu_memory_used_mib != null) {
      tiles.push(resourceMetric('GPU 显存占用', Math.round(m.gpu_memory_used_mib).toLocaleString('zh-CN') + '<span class="unit"> MiB</span>', 'GB10 agent · gpu_mem'));
    }
    tiles.push(
      resourceMetric('GPU 活跃度',
        m.gpu_util_pct == null ? dash() : m.gpu_util_pct.toFixed(0) + '<span class="unit">%</span>',
        'DCGM · exporter' + pctTile(m.gpu_util_pct)),
      resourceMetric('GPU 温度',
        m.gpu_temp_c == null ? dash() : m.gpu_temp_c.toFixed(0) + '<span class="unit">°C</span>', 'DCGM · exporter'),
      resourceMetric('GPU 功耗',
        m.power_w == null ? dash() : m.power_w.toFixed(0) + '<span class="unit">W</span>', 'DCGM · 板卡功耗')
    );
    return tiles.join('');
  }

  function metricTiles(s) {
    return s.cluster_member ? resourceMetrics(s) : inferencePanels(s);
  }

  function lineChart(id, seriesDefs, yMax, yAxes) {
    var ch = getChart(id); if (!ch) return;
    var t = TC();
    ch.setOption({
      backgroundColor: 'transparent', tooltip: baseTooltip(t),
      legend: { textStyle: { color: t.text2, fontSize: 10 }, top: 0, icon: 'roundRect', itemWidth: 10, itemHeight: 3 },
      grid: baseGrid(),
      xAxis: Object.assign({ type: 'time', axisLabel: { formatter: tsLabel, color: t.muted, fontSize: 10, hideOverlap: true } }, axisStyle(t)),
      yAxis: yAxes || Object.assign({ type: 'value', max: yMax, minInterval: yMax ? 1 : null }, axisStyle(t)),
      series: seriesDefs
    }, { notMerge: true });
  }

  function renderSharedClusters() {
    var rows = ((st.ov && st.ov.sites.rows) || []).filter(function (s) { return !st.node || s.name === st.node; });
    rows.filter(function (s) { return s.cluster && Array.isArray(s.members) && s.members.length; }).forEach(function (s) {
      var member = sharedMember(s);
      var row = { name: s.name, site_name: s.name, instance: member.instance, metrics: member.metrics || {} };
      var key = clusterKey(s);
      var metricEl = document.getElementById('ni-' + key);
      if (metricEl) metricEl.innerHTML = inferencePanels(row);
      var hist = st.hist[rowKey(row)] || {};
      var toXY = function (pts) { return (pts || []).map(function (p) { return [p[0] * 1000, Math.round(p[1] * 10) / 10]; }); };
      lineChart('ch-nd-shared-tps-' + key, [
        { name: '输出 tok/s', type: 'line', smooth: true, symbol: 'none', data: toXY(hist.speed),
          yAxisIndex: 0, lineStyle: { width: 1.5, color: TC().s.cyan }, itemStyle: { color: TC().s.cyan }, areaStyle: { color: TC().s.cyan, opacity: 0.12 } },
        { name: 'Prefill tok/s', type: 'line', smooth: true, symbol: 'none', data: toXY(hist.pre),
          yAxisIndex: 1, lineStyle: { width: 1.5, color: TC().s.violet }, itemStyle: { color: TC().s.violet } }
      ], null, [
        Object.assign({ type: 'value', name: '输出 tok/s', nameTextStyle: { color: TC().s.cyan, fontSize: 10 }, splitNumber: 4 }, axisStyle(TC())),
        Object.assign({ type: 'value', name: 'Prefill', position: 'right', nameTextStyle: { color: TC().s.violet, fontSize: 10 }, splitNumber: 4 }, axisStyle(TC()))
      ]);
      lineChart('ch-nd-shared-res-' + key, [
        { name: 'KV Cache %', type: 'line', smooth: true, symbol: 'none', data: toXY(hist.kv),
          lineStyle: { width: 1.4, color: TC().s.cyan }, itemStyle: { color: TC().s.cyan }, areaStyle: { color: TC().s.cyan, opacity: 0.1 } }
      ], 100);
    });
  }

  function render() {
    var nodes = visibleNodes();
    var box = document.getElementById('nd-blocks');
    /* Only rebuild panels when the visible set or time window changes. */
    var sig = nodes.map(rowKey).join(',') + '|' + st.hours;
    if (box.dataset.sig !== sig) {
      box.dataset.sig = sig;
      box.innerHTML = nodes.length
        ? '<div class="nd-dashboard nd-resource-dashboard"><div class="nd-dashboard-bar"><div class="nd-dashboard-title">节点资源 <span>/ instance scoped</span></div><span class="nd-dashboard-meta">' + nodes.length + ' instances · refresh ' + st.interval + 's</span></div>' +
            '<div class="nd-row"><div class="nd-row-head"><button class="nd-collapse" type="button" aria-expanded="true" aria-label="折叠成员资源区">⌄</button><span>成员资源与独立节点</span><span class="nd-row-meta">historical panels</span></div><div class="nd-grid nd-content">' + nodes.map(buildBlock).join('') + '</div></div></div>'
        : '<div class="nd-dashboard"><div class="nd-empty">暂无节点数据</div></div>';
      resetCharts();     // 容器重建后旧实例作废
    }
    renderSharedClusters();
    nodes.forEach(function (s, idx) {
      var key = rowKey(s);
      var el = document.getElementById('nm-' + key);
      if (el) el.innerHTML = s.cluster_member ? resourceMetrics(s) : inferencePanels(s);
      var resourceEl = document.getElementById('nr-' + key);
      if (resourceEl) resourceEl.innerHTML = resourceMetrics(s);
      var color = TC().s[NODE_COLORS[idx % NODE_COLORS.length]];
      var hist = st.hist[key] || {};
      var toXY = function (pts) { return pts.map(function (p) { return [p[0] * 1000, Math.round(p[1] * 10) / 10]; }); };
      if (!s.cluster_member) {
        lineChart('ch-nd-tps-' + key, [
          { name: '输出 tok/s', type: 'line', smooth: true, symbol: 'none', data: toXY(hist.speed),
            yAxisIndex: 0, lineStyle: { width: 1.5, color: color }, itemStyle: { color: color }, areaStyle: { color: color, opacity: 0.12 } },
          { name: 'Prefill tok/s', type: 'line', smooth: true, symbol: 'none', data: toXY(hist.pre),
            yAxisIndex: 1, lineStyle: { width: 1.5, color: TC().s.violet }, itemStyle: { color: TC().s.violet } }
        ], null, [
          Object.assign({ type: 'value', name: '输出 tok/s', nameTextStyle: { color: color, fontSize: 10 }, splitNumber: 4 }, axisStyle(TC())),
          Object.assign({ type: 'value', name: 'Prefill', position: 'right', nameTextStyle: { color: TC().s.violet, fontSize: 10 }, splitNumber: 4 }, axisStyle(TC()))
        ]);
      }
      lineChart('ch-nd-res-' + key, s.cluster_member ? [
        { name: 'GPU 活跃 %', type: 'line', smooth: true, symbol: 'none', data: toXY(hist.gpu),
          lineStyle: { width: 1.4, color: TC().s.green }, itemStyle: { color: TC().s.green } }
      ] : [
        { name: 'KV Cache %', type: 'line', smooth: true, symbol: 'none', data: toXY(hist.kv),
          lineStyle: { width: 1.4, color: TC().s.cyan }, itemStyle: { color: TC().s.cyan } },
        { name: 'GPU 活跃 %', type: 'line', smooth: true, symbol: 'none', data: toXY(hist.gpu),
          lineStyle: { width: 1.4, color: TC().s.green }, itemStyle: { color: TC().s.green } }
      ], 100);
      lineChart('ch-nd-thermal-' + key, [
        { name: 'GPU 温度 °C', type: 'line', smooth: true, symbol: 'none', data: toXY(hist.temp),
          yAxisIndex: 0, lineStyle: { width: 1.4, color: TC().s.amber }, itemStyle: { color: TC().s.amber } },
        { name: 'GPU 功耗 W', type: 'line', smooth: true, symbol: 'none', data: toXY(hist.power),
          yAxisIndex: 1, lineStyle: { width: 1.4, color: TC().s.red }, itemStyle: { color: TC().s.red } }
      ], null, [
        Object.assign({ type: 'value', name: '°C', nameTextStyle: { color: TC().s.amber, fontSize: 10 }, splitNumber: 4 }, axisStyle(TC())),
        Object.assign({ type: 'value', name: 'W', position: 'right', nameTextStyle: { color: TC().s.red, fontSize: 10 }, splitNumber: 4 }, axisStyle(TC()))
      ]);
    });
  }

  function fillFilter() {
    var f = document.getElementById('nd-node'), old = st.node || f.value;
    var rows = (st.ov && st.ov.sites.rows) || [];
    f.innerHTML = '<option value="">全部节点</option>' + rows.map(function (s) {
      return '<option value="' + esc(s.name) + '">' + esc(s.display_name || s.name) + '</option>'; }).join('');
    if (Array.from(f.options).some(function (o) { return o.value === old; })) f.value = old;
  }

  var loadEpoch = 0;
  window.addEventListener('pfpagehide', function () { loadEpoch++; });
  var loading = false;
  async function load() {
    if (loading) return;
    loading = true;
    var epoch = ++loadEpoch;
    try {
      st.ov = await window.pfApi('GET', '/overview');
      if (epoch !== loadEpoch) return;
      fillFilter();
      await fetchHist(visibleNodes(), st.hours);
      if (epoch !== loadEpoch) return;
      renderSummary();
      render();
      var last = document.getElementById('nd-last'); if (last) last.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      st.left = st.interval;
    } catch (e) {
      if (epoch !== loadEpoch) return;
      window.pfErr((e && e.error) || '加载失败');
      var last = document.getElementById('nd-last'); if (last) last.textContent = '加载失败';
    } finally { loading = false; }
  }

  window.pfReady.then(function () {
    document.getElementById('nd-node').addEventListener('change', function () {
      st.node = this.value; load();
    });
    document.getElementById('nd-win').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      st.hours = parseInt(b.dataset.h, 10);
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      load();
    });
    setInterval(function () {
      if (!document.getElementById('nd-auto').checked) { document.getElementById('nd-cd').textContent = '暂停'; return; }
      st.left -= 1;
      if (st.left <= 0) { st.left = st.interval; load(); }
      document.getElementById('nd-cd').textContent = st.left + 's';
    }, 1000);
    document.getElementById('nd-interval').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      st.interval = parseInt(b.dataset.int, 10);
      st.left = st.interval;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    });
    document.getElementById('nd-refresh').addEventListener('click', function () { st.left = st.interval; load(); });
    document.addEventListener('click', function (e) {
      var button = e.target.closest('.nd-collapse');
      if (!button) return;
      var row = button.closest('.nd-row');
      var content = row && row.querySelector('.nd-content');
      var open = button.getAttribute('aria-expanded') !== 'false';
      button.setAttribute('aria-expanded', open ? 'false' : 'true');
      button.textContent = open ? '›' : '⌄';
      if (content) content.style.display = open ? 'none' : '';
    });
    document.addEventListener('pftheme', function () {
      resetCharts();
      renderSummary();
      render();
    });
    window.addEventListener('resize', function () {
      Object.values(charts).forEach(function (c) { if (!c.isDisposed()) c.resize(); });
    });
    load();
  });
})();
</script></body></html>
