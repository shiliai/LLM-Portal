<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 远程模型网关</title>
<link rel="stylesheet" href="assets/portal.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* 页面级布局（无壳居中）：仅排版尺寸，颜色全部复用 portal.css 令牌 */
  .lg-page {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .lg-card {
    width: 380px; max-width: 100%;
    background: #fff; border: 1px solid #f0f0f0; border-radius: 6px;
    padding: 36px 32px 26px;
  }
  .lg-logo {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 6px;
  }
  .lg-logo .pf-logo-mark { width: 36px; height: 36px; border-radius: 8px; }
  .lg-title { font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  .lg-sub { text-align: center; font-size: 12.5px; color: #8c8c8c; margin-bottom: 24px; }
  .lg-label {
    display: block; font-size: 12.5px; color: #1f1f1f; margin-bottom: 6px;
  }
  .lg-card .pf-input { height: 34px; width: 100%; }
  .lg-btn { width: 100%; height: 34px; margin-top: 18px; font-size: 13px; border: 0; cursor: pointer; }
  .lg-note { text-align: center; margin-top: 16px; }
  .lg-link { display: block; text-align: center; margin-top: 12px; font-size: 12.5px; }
  .lg-foot { margin-top: 24px; font-size: 12px; color: #8c8c8c; text-align: center; }
  .lg-surface {
    margin-top: 18px; display: flex; align-items: center; justify-content: center;
    gap: 10px; font-size: 11.5px; color: #8c8c8c;
  }
  .lg-err { text-align: center; font-size: 12.5px; color: #c0392b; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>

<div class="lg-page">
  <div class="lg-card">
    <div class="lg-logo">
      <span class="pf-logo-mark"><svg viewBox="0 0 64 64" width="100%" height="100%"><rect x="4.5" y="4.5" width="55" height="55" rx="9.5" fill="#0b60f5"/><path d="M13.3 13H31.5A5.5 5.5 0 0 1 37 18.5V29H35.3V35H37V45.5A5.5 5.5 0 0 1 31.5 51H13.3A5.5 5.5 0 0 1 7.8 45.5V18.5A5.5 5.5 0 0 1 13.3 13Z" fill="#041d66"/><path d="M14.3 19.5 30.4 32M14.3 32H30.4M14.3 44.5 30.4 32" stroke="#fff" stroke-width="3.1" stroke-linecap="round" fill="none"/><path d="M30.4 32H50" stroke="#fff" stroke-width="4.6" stroke-linecap="round" fill="none"/><circle cx="14.3" cy="19.5" r="3.6" fill="#fff"/><circle cx="14.3" cy="32" r="3.6" fill="#fff"/><circle cx="14.3" cy="44.5" r="3.6" fill="#fff"/><circle cx="50" cy="32" r="4.4" fill="#fff"/></svg></span>
      <span class="lg-title">远程模型网关</span>
    </div>
    <div class="lg-sub">管理控制台 · 凭据登录</div>

    <label class="lg-label" for="lg-pwd">访问密钥</label>
    <input class="pf-input mono" id="lg-pwd" type="password" placeholder="输入分配的访问密钥" autocomplete="current-password">

    <button class="pf-btn primary lg-btn" id="lg-go" type="button">登 录</button>
    <div class="lg-err" id="lg-err"></div>

    <div class="pf-desc lg-note">用户密钥仅可查看「我的用量」；管理员请使用管理员入口。</div>
    <a class="lg-link" href="/console/admin-login.html">管理员登录 →</a>
  </div>

  <div class="lg-foot">远程模型网关 · 局域网私有推理模型的统一公网入口</div>
</div>

<script>
(function () {
  'use strict';
  var input = document.getElementById('lg-pwd');
  var btn = document.getElementById('lg-go');
  var errBox = document.getElementById('lg-err');

  async function go() {
    var key = input.value.trim();
    if (!key) { errBox.textContent = '请输入 Key'; return; }
    btn.disabled = true; btn.textContent = '登录中…'; errBox.textContent = '';
    try {
      var r = await fetch('/console/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
        body: JSON.stringify({ key: key })
      });
      var body = null;
      try { body = await r.json(); } catch (e) {}
      if (!r.ok) throw (body && body.error) || ('登录失败 (' + r.status + ')');
      location.href = r.role === 'admin' ? '/console/' : '/console/my-usage.html';
    } catch (e) {
      errBox.textContent = String(e);
      btn.disabled = false; btn.textContent = '登 录';
      input.select();
    }
  }
  btn.addEventListener('click', go);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  input.focus();
})();
</script>
</body>
</html>
