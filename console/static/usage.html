<style>
  #ug-policy-drawer { width: 620px; max-width: 94vw; }
  #ug-detail-drawer { width: 720px; max-width: 96vw; }
  .ug-detail-notice { padding: 10px 12px; margin-bottom: 16px; border-left: 2px solid var(--accent); background: var(--accent-soft); color: var(--text2); font-size: 12px; line-height: 1.5; }
  .ug-detail-meta { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 7px 12px; margin-bottom: 16px; }
  .ug-detail-meta dt { color: var(--muted); }
  .ug-detail-meta dd { margin: 0; color: var(--text); min-width: 0; word-break: break-word; }
  .ug-detail-section { margin-top: 16px; }
  .ug-detail-section h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 7px; color: var(--heading); font-size: 12px; }
  .ug-detail-section h3::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .ug-detail-code { max-height: 260px; overflow: auto; margin: 0; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; background: var(--panel3); border: 1px solid var(--border); border-radius: 5px; color: var(--text2); font: 11px/1.55 var(--mono); }
  .ug-detail-state { color: var(--muted); padding: 24px 0; text-align: center; }
  .ug-detail-conversation { display: grid; gap: 8px; }
  .ug-message { padding: 9px 11px; border: 1px solid var(--border); border-radius: 5px; background: var(--panel3); }
  .ug-message-role { margin-bottom: 4px; color: var(--accent); font: 10px var(--mono); text-transform: uppercase; }
  .ug-message-content { color: var(--text); white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.55; }
  .ug-message.tool { border-left: 2px solid var(--violet); }
  .ug-policy-action { margin-left: auto; align-self: center; }
  .ug-policy-intro { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; margin-bottom: 16px; border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--border)); border-radius: 6px; background: var(--accent-soft); color: var(--text2); font-size: 12px; line-height: 1.55; }
  .ug-policy-intro-mark { color: var(--accent); font: 14px var(--mono); }
  .ug-policy-overview { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel3); }
  .ug-policy-overview-title { color: var(--muted); font-size: 11px; }
  .ug-policy-overview-meta { margin-top: 3px; color: var(--text2); font: 10px var(--mono); }
  .ug-policy-overview-right { display: flex; align-items: center; gap: 8px; }
  .ug-policy-field { margin-bottom: 16px; }
  .ug-policy-field > label { display: block; margin-bottom: 7px; color: var(--heading); font-size: 12px; font-weight: 500; }
  .ug-policy-help { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.5; }
  .ug-policy-mode-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .ug-policy-mode { position: relative; display: block; min-height: 70px; padding: 9px 10px; border: 1px solid var(--border2); border-radius: 5px; background: var(--panel3); cursor: pointer; }
  .ug-policy-mode:hover { border-color: var(--accent); }
  .ug-policy-mode.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .ug-policy-mode input { position: absolute; opacity: 0; pointer-events: none; }
  .ug-policy-mode-title { color: var(--heading); font-size: 12px; }
  .ug-policy-mode-copy { display: block; margin-top: 3px; color: var(--muted); font-size: 10.5px; line-height: 1.4; }
  .ug-policy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ug-policy-keys { max-height: 250px; overflow: auto; border: 1px solid var(--border); border-radius: 5px; background: var(--panel3); }
  .ug-policy-key { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 7px 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .ug-policy-key:last-child { border-bottom: 0; }
  .ug-policy-key:hover { background: var(--hover); }
  .ug-policy-key input { margin: 0; accent-color: var(--accent); }
  .ug-policy-key-main { min-width: 0; flex: 1; }
  .ug-policy-key-name { color: var(--text); }
  .ug-policy-key-ref { margin-left: 7px; color: var(--muted); font: 11px var(--mono); }
  .ug-policy-key-hash { color: var(--muted); font: 10px var(--mono); white-space: nowrap; }
  .ug-policy-empty { padding: 14px; color: var(--muted); font-size: 11px; text-align: center; }
  .ug-policy-status { min-height: 18px; margin-top: 10px; color: var(--muted); font-size: 11px; line-height: 1.5; }
  .ug-policy-status.error { color: var(--red); }
  .ug-monitor-health { margin-bottom: 14px; }
  .ug-monitor-health .pf-card-head { align-items: flex-start; margin-bottom: 14px; }
  .ug-health-headcopy { min-width: 0; }
  .ug-health-subtitle { margin-top: 2px; color: var(--muted); font-size: 11px; }
  .ug-health-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .ug-health-status { font-size: 10.5px; }

  .ug-health-status.error { color: var(--red); border-color: color-mix(in srgb, var(--red) 35%, transparent); background: color-mix(in srgb, var(--red) 9%, transparent); }
  .ug-health-metrics { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }

  .ug-health-recent { margin-top: 7px; color: var(--text2); font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmt(n) { return Number(Math.round(n || 0)).toLocaleString('zh-CN'); }
  function latency(ms) {
    ms = Number(ms || 0);
    if (!ms) return { value: '—', unit: '', title: '' };
    if (ms >= 60000) {
      var minutes = Math.floor(ms / 60000), seconds = (ms % 60000) / 1000;
      return { value: minutes + 'm ' + seconds.toFixed(1) + 's', unit: '', title: fmt(ms) + ' ms' };
    }
    if (ms >= 1000) return { value: (ms / 1000).toFixed(1), unit: 's', title: fmt(ms) + ' ms' };
    return { value: fmt(ms), unit: 'ms', title: '' };
  }
  function latencyHtml(ms) {
    var x = latency(ms);
    return '<span' + (x.title ? ' title="原始值 ' + esc(x.title) + '"' : '') + '>' + x.value +
      (x.unit ? ' <span class="unit">' + x.unit + '</span>' : '') + '</span>';
  }
  function fmtK(n) {
    n = Number(n || 0);
    if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(Math.round(n));
  }
  function dash() { return '<span style="color:var(--muted)">—</span>'; }

  /* Token 内容由行数据提供，视觉格式统一由 formatter + portal.css 提供。 */
  function tokenMetricHtml(value, kind, compact) {
    var n = Number(value || 0);
    var meta = {
      total: { icon: 'Σ', label: '总' },
      read: { icon: '↓', label: '读' },
      write: { icon: '↑', label: '写' }
    }[kind] || { icon: '·', label: '' };
    return '<span class="pf-token-metric pf-token-' + kind + '" title="' + esc(meta.label + ' Token ' + fmt(n)) + '">' +
      '<span class="pf-token-icon" aria-hidden="true">' + meta.icon + '</span>' +
      '<span class="pf-token-value">' + (compact ? fmtK(n) : fmt(n)) + '</span></span>';
  }
  function cacheMetricHtml(value, compact) {
    var n = Number(value || 0);
    if (n > 0) {
      return '<span class="pf-token-metric pf-token-cache is-hit" title="缓存命中 · 读取 ' + esc(fmt(n)) + ' token">' +
        '<span class="pf-token-icon" aria-hidden="true">▣</span><span class="pf-token-value">' + (compact ? fmtK(n) : fmt(n)) +
        '</span><span class="pf-token-state">命中</span></span>';
    }
    return '<span class="pf-token-metric pf-token-cache is-miss" title="缓存未命中 · 读取 0 token">' +
      '<span class="pf-token-icon" aria-hidden="true">□</span><span class="pf-token-state">未命中</span></span>';
  }

  function TC() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    return {
      text2: light ? '#475569' : '#9ca3af', muted: light ? '#64748b' : '#6b7280',
      border: light ? '#e2e8f0' : '#1f2937', panel2: light ? '#f8fafc' : '#151b26',
      panel: light ? '#ffffff' : '#111827', heading: light ? '#0f172a' : '#f3f4f6',
      s: light ? { cyan: '#4f46e5', green: '#16a34a', amber: '#d97706', red: '#dc2626', blue: '#2563eb', violet: '#7c3aed' }
               : { cyan: '#22d3ee', green: '#34d399', amber: '#fbbf24', red: '#f87171', blue: '#60a5fa', violet: '#a78bfa' }
    };
  }
  var SERIES_COLORS = ['cyan', 'green', 'violet', 'amber', 'blue'];
  var charts = {};
  function getChart(id) {
    var dom = $(id);
    if (!dom) return null;
    if (charts[id] && charts[id].isDisposed()) delete charts[id];
    if (!charts[id]) charts[id] = echarts.init(dom, null, { renderer: 'canvas' });
    return charts[id];
  }
  function axisStyle(t) {
    return { axisLine: { lineStyle: { color: t.border } }, axisLabel: { color: t.muted, fontSize: 10, fontFamily: 'ui-monospace,Menlo,monospace' }, splitLine: { lineStyle: { color: t.panel2 } } };
  }
  function tooltipItem(t) {
    return { trigger: 'item', backgroundColor: t.panel2, borderColor: t.border,
      textStyle: { color: t.text2, fontSize: 11, fontFamily: 'ui-monospace,Menlo,monospace' } };
  }
  function donut(items, centerLabel, centerVal) {
    var t = TC();
    return {
      backgroundColor: 'transparent',
      tooltip: tooltipItem(t),
      title: { text: centerVal, subtext: centerLabel, left: 'center', top: '38%',
        textStyle: { color: t.heading, fontSize: 15, fontFamily: 'ui-monospace,Menlo,monospace' },
        subtextStyle: { color: t.muted, fontSize: 9 } },
      series: [{ type: 'pie', radius: ['56%', '80%'], center: ['50%', '50%'],
        label: { show: false }, labelLine: { show: false },
        itemStyle: { borderColor: t.panel, borderWidth: 2 },
        emphasis: { scale: true, scaleSize: 4 },
        data: items }]
    };
  }
  /* 维度取色：同名实体在同一面板内颜色稳定 */
  function colorFor(t, kind, key) {
    var idx = 0;
    for (var i = 0; i < key.length; i++) idx = (idx * 31 + key.charCodeAt(i)) >>> 0;
    return t.s[SERIES_COLORS[idx % SERIES_COLORS.length]];
  }

  /* ══════════ 对话采集策略 ══════════ */
  var ugPolicy = { policy: null, keys: [], epoch: 0 };

  function policyHash(value) {
    value = String(value || '').toLowerCase();
    return /^[0-9a-f]{64}$/.test(value) ? value : '';
  }

  function policyError(e) {
    if (e && e.status === 401) return '登录已失效，请重新登录。';
    if (e && e.status === 403) return '当前账号没有管理采集策略的权限。';
    if (e && e.status === 404) return '采集策略接口暂不可用，请确认 Portal 版本。';
    return (e && e.error) || '采集策略加载失败，请稍后重试。';
  }

  function policyStatus(message, isError) {
    var el = $('ug-policy-status');
    if (!el) return;
    el.textContent = message || '';
    el.classList.toggle('error', !!isError);
  }

  function renderPolicyForm(policy, keyRows) {
    var allowed = {};
    (policy.keys || []).forEach(function (value) {
      var hash = policyHash(value);
      if (hash) allowed[hash] = true;
    });
    var seen = {};
    var usable = (keyRows || []).map(function (row) {
      var hash = policyHash(row.key_hash);
      if (!hash || seen[hash]) return null;
      seen[hash] = true;
      return { hash: hash, alias: row.alias || '(未命名)', ref: row.key_last4 || '…' };
    }).filter(Boolean).sort(function (a, b) {
      return (a.alias + a.ref).localeCompare(b.alias + b.ref, 'zh-CN');
    });
    var keyMarkup = usable.length ? usable.map(function (row) {
      return '<label class="ug-policy-key"><input type="checkbox" data-key-hash="' + esc(row.hash) + '"' +
        (allowed[row.hash] ? ' checked' : '') + '><span class="ug-policy-key-main"><span class="ug-policy-key-name">' +
        esc(row.alias) + '</span><span class="ug-policy-key-ref">' + esc(row.ref) + '</span></span>' +
        '<span class="ug-policy-key-hash">…' + esc(row.hash.slice(-12)) + '</span></label>';
    }).join('') : '<div class="ug-policy-empty">没有可用于 allowlist 的 Key hash。请先在 Key 管理中创建或导入 Key。</div>';
    var mode = ['off', 'stream', 'persist'].indexOf(policy.mode) >= 0 ? policy.mode : 'off';
    var modeCards = [
      { value: 'off', title: '关闭', copy: '不产生采集事件' },
      { value: 'stream', title: '实时流', copy: '只推送 SSE，不落盘' },
      { value: 'persist', title: '实时流 + 持久化', copy: '推送并保存 Portal 原文' }
    ].map(function (item) {
      return '<label class="ug-policy-mode' + (item.value === mode ? ' selected' : '') + '" data-mode="' + item.value + '">' +
        '<input type="radio" name="ug-policy-mode-choice" value="' + item.value + '"' + (item.value === mode ? ' checked' : '') + '>' +
        '<span class="ug-policy-mode-title">' + item.title + '</span><span class="ug-policy-mode-copy">' + item.copy + '</span></label>';
    }).join('');
    $('ug-policy-body').innerHTML =
      '<div class="ug-policy-intro"><span class="ug-policy-intro-mark">◈</span><span>Portal 保存原文，collector 自行调用 OPF。只有 allowlist 中的 Key 会产生事件；链路故障只记录监控状态，不阻断主请求。</span></div>' +
      '<div class="ug-policy-overview"><div><div class="ug-policy-overview-title">当前策略</div><div class="ug-policy-overview-meta">版本 ' + esc(String(policy.version == null ? '—' : policy.version)) + ' · 更新于 ' + esc(policy.updated_at || '—') + '</div></div>' +
        '<div class="ug-policy-overview-right"><span class="pf-chip accent">' + esc(mode) + '</span><span class="pf-chip gray">' + fmt((policy.keys || []).length) + ' 个 Key</span></div></div>' +
      '<div class="ug-policy-field"><label>采集模式</label><div class="ug-policy-mode-grid">' + modeCards + '</div>' +
        '<select class="pf-select" id="ug-policy-mode" hidden><option value="off">off</option><option value="stream">stream</option><option value="persist">persist</option></select>' +
        '<div class="ug-policy-help">模式切换立即影响后续请求；历史原文不会因切换被改写。</div></div>' +
      '<div class="ug-policy-grid"><div class="ug-policy-field"><label for="ug-policy-ttl">原文保留期</label>' +
        '<select class="pf-select" id="ug-policy-ttl"><option value="7">7 天</option><option value="14">14 天</option><option value="30">30 天</option></select>' +
        '<div class="ug-policy-help">仅影响 persist 模式中的 Portal 原文记录。</div></div>' +
      '<div class="ug-policy-field"><label for="ug-policy-capacity">原文容量上限</label>' +
        '<select class="pf-select" id="ug-policy-capacity"><option value="10000">10,000 条</option><option value="50000">50,000 条</option><option value="100000">100,000 条</option></select>' +
        '<div class="ug-policy-help">达到上限时优先清理最早记录。</div></div></div>' +
      '<div class="ug-policy-field"><label for="ug-policy-key-search">Key allowlist</label>' +
        '<input class="pf-input" id="ug-policy-key-search" type="search" placeholder="按名称或尾号筛选 Key" autocomplete="off">' +
        '<div class="ug-policy-keys" id="ug-policy-key-list">' + keyMarkup + '</div>' +
        '<div class="ug-policy-help">提交内容只包含 SHA-256 hash；Portal 不把原始 Key 写入采集策略或监控数据库。</div></div>' +
      '<div class="ug-policy-status" id="ug-policy-status"></div>';
    $('ug-policy-mode').value = ['off', 'stream', 'persist'].indexOf(policy.mode) >= 0 ? policy.mode : 'off';
    $('ug-policy-ttl').value = ['7', '14', '30'].indexOf(String(policy.ttl_days)) >= 0 ? String(policy.ttl_days) : '14';
    $('ug-policy-capacity').value = ['10000', '50000', '100000'].indexOf(String(policy.capacity)) >= 0 ? String(policy.capacity) : '50000';
    document.querySelectorAll('#ug-policy-body .ug-policy-mode').forEach(function (card) {
      card.addEventListener('click', function () {
        $('ug-policy-mode').value = card.dataset.mode;
        document.querySelectorAll('#ug-policy-body .ug-policy-mode').forEach(function (item) { item.classList.toggle('selected', item === card); });
      });
    });
    $('ug-policy-key-search').addEventListener('input', function () {
      var query = this.value.trim().toLowerCase();
      document.querySelectorAll('#ug-policy-key-list .ug-policy-key').forEach(function (row) {
        row.hidden = !!query && row.textContent.toLowerCase().indexOf(query) < 0;
      });
    });
    $('ug-policy-save').disabled = false;
    policyStatus('当前策略版本 ' + String(policy.version == null ? '—' : policy.version) + ' · 更新时间 ' + (policy.updated_at || '—'));
  }

  async function loadPolicyPanel() {
    var epoch = ++ugPolicy.epoch;
    $('ug-policy-save').disabled = true;
    $('ug-policy-body').innerHTML = '<div class="ug-detail-state">正在读取采集策略与 Key 列表…</div>';
    try {
      var result = await Promise.all([
        window.pfApi('GET', '/conversation-monitor/policy'),
        window.pfApi('GET', '/keys')
      ]);
      if (epoch !== ugPolicy.epoch) return;
      ugPolicy.policy = result[0] || {};
      ugPolicy.keys = (result[1] && result[1].keys) || [];
      renderPolicyForm(ugPolicy.policy, ugPolicy.keys);
    } catch (e) {
      if (epoch !== ugPolicy.epoch) return;
      $('ug-policy-body').innerHTML = '<div class="ug-detail-state error">' + esc(policyError(e)) + '</div>';
      $('ug-policy-save').disabled = true;
    }
  }

  async function savePolicyPanel() {
    var save = $('ug-policy-save');
    var hashes = Array.from(document.querySelectorAll('#ug-policy-body input[data-key-hash]:checked'))
      .map(function (input) { return policyHash(input.dataset.keyHash); }).filter(Boolean);
    var payload = {
      mode: $('ug-policy-mode').value,
      ttl_days: Number($('ug-policy-ttl').value),
      capacity: Number($('ug-policy-capacity').value),
      keys: Array.from(new Set(hashes))
    };
    save.disabled = true;
    policyStatus('正在保存策略…');
    try {
      var saved = await window.pfApi('PUT', '/conversation-monitor/policy', payload);
      ugPolicy.policy = saved || payload;
      renderPolicyForm(ugPolicy.policy, ugPolicy.keys);
      loadMonitorHealth();
      window.pfToast('采集策略已保存');
    } catch (e) {
      policyStatus(policyError(e), true);
      save.disabled = false;
    }
  }

  /* ══════════ 采集健康 / SSE ══════════ */
  var ugMonitor = { source: null, lastEventId: '', paused: true, loading: false, connecting: false, refreshTimer: null };

  function monitorHealthStatus(message, kind) {
    var el = $('ug-health-status');
    if (!el) return;
    el.textContent = message || '';
    el.className = 'pf-chip ug-health-status' + (kind ? ' ' + kind : ' gray');
  }

  function monitorHealthError(e) {
    if (e && e.status === 401) return '登录已失效，请重新登录。';
    if (e && e.status === 403) return '当前账号没有查看采集健康状态的权限。';
    if (e && e.status === 404) return '采集健康接口暂不可用，请确认 Portal 版本。';
    return (e && e.error) || '采集健康状态加载失败。';
  }

  function renderMonitorHealth(data) {
    data = data || {};
    $('ug-health-mode').textContent = String(data.capture_mode || 'off');
    $('ug-health-captured').textContent = fmt(data.captured);
    $('ug-health-persisted').textContent = fmt(data.persisted);
    $('ug-health-dropped').textContent = fmt(data.dropped);
    $('ug-health-clients').textContent = fmt(data.sse_clients);
    $('ug-health-retention').textContent = String(data.ttl_days == null ? '—' : data.ttl_days + 'd') + ' / ' +
      fmt(data.capacity) + ' 条';
    if (!ugMonitor.lastEventId && data.last_event_id) ugMonitor.lastEventId = data.last_event_id;
  }

  async function loadMonitorHealth() {
    if (ugMonitor.loading) return;
    ugMonitor.loading = true;
    try {
      var data = await window.pfApi('GET', '/conversation-monitor/summary');
      renderMonitorHealth(data);
      if (!ugMonitor.connecting) $('ug-monitor-sse-toggle').disabled = false;
      if (!ugMonitor.source && ugMonitor.paused) monitorHealthStatus('已暂停', '');
    } catch (e) {
      monitorHealthStatus(monitorHealthError(e), 'error');
      $('ug-monitor-sse-toggle').disabled = !ugMonitor.source;
    } finally {
      ugMonitor.loading = false;
    }
  }

  function monitorRecent(type, data) {
    data = data || {};
    var parts = [type];
    if (data.request_id) parts.push(data.request_id);
    if (data.model) parts.push(data.model);
    if (data.status) parts.push(data.status);
    if (data.reason) parts.push(data.reason);
    $('ug-health-recent').textContent = '最近事件：' + parts.join(' · ');
  }

  function handleMonitorEvent(event) {
    if (event.lastEventId) ugMonitor.lastEventId = event.lastEventId;
    if (event.type === 'reset') {
      ugMonitor.lastEventId = '';
      monitorRecent('reset', { reason: 'replay unavailable; 可从请求明细补查' });
      return;
    }
    var data = {};
    try { data = JSON.parse(event.data || '{}'); } catch (e) { data = {}; }
    /* 事件只在这里显示 envelope metadata，不把 Portal 原文 payload 放进页面。 */
    monitorRecent(event.type || 'message', data);
    if (event.type === 'conversation.capture' || event.type === 'conversation.drop' || event.type === 'policy.changed') {
      loadMonitorHealth();
    }
  }

  function stopMonitorStream(message, kind) {
    if (ugMonitor.source) {
      ugMonitor.source.close();
      ugMonitor.source = null;
    }
    ugMonitor.paused = true;
    ugMonitor.connecting = false;
    var toggle = $('ug-monitor-sse-toggle');
    toggle.textContent = '恢复实时流';
    toggle.disabled = false;
    monitorHealthStatus(message || '已暂停', kind || '');
  }

  async function startMonitorStream() {
    if (ugMonitor.source) return;
    monitorHealthStatus('正在连接…');
    ugMonitor.connecting = true;
    $('ug-monitor-sse-toggle').disabled = true;
    try {
      /* 先用 REST 验证当前会话，EventSource 本身不会暴露 401/403 响应体。 */
      await window.pfApi('GET', '/conversation-monitor/summary');
    } catch (e) {
      stopMonitorStream(monitorHealthError(e), 'error');
      return;
    }
    ugMonitor.connecting = false;
    var query = ugMonitor.lastEventId ? '?last_event_id=' + encodeURIComponent(ugMonitor.lastEventId) : '';
    var source;
    try {
      source = new EventSource('/console/api/conversation-monitor/stream' + query, { withCredentials: true });
    } catch (e) {
      stopMonitorStream('SSE 初始化失败，已暂停（请点击恢复）', 'error');
      return;
    }
    ugMonitor.source = source;
    ugMonitor.paused = false;
    $('ug-monitor-sse-toggle').textContent = '暂停实时流';
    source.onopen = function () {
      monitorHealthStatus('SSE 已连接', 'connected');
      $('ug-monitor-sse-toggle').disabled = false;
      loadMonitorHealth();
    };
    ['conversation.capture', 'conversation.drop', 'policy.changed', 'reset'].forEach(function (type) {
      source.addEventListener(type, handleMonitorEvent);
    });
    source.onerror = function () {
      /* 自动重连会掩盖“暂停”语义，故错误后关闭；恢复按钮会带上最近 event id。 */
      stopMonitorStream('SSE 连接失败，已暂停（请点击恢复）', 'error');
      loadMonitorHealth();
    };
  }

  function toggleMonitorStream() {
    if (ugMonitor.source || ugMonitor.connecting) {
      stopMonitorStream('已暂停');
      return;
    }
    startMonitorStream().catch(function () {
      stopMonitorStream('SSE 连接失败，已暂停（请点击恢复）', 'error');
    });
  }

  /* ══════════ 汇总状态 ══════════ */
  var ug = { range: '0.9999', today: false, gran: '', tabModel: 'tok', tabKey: 'group', tabEp: 'tok',
             dims: { model: 'all', group: 'all', key: 'all', node: 'all', ep: 'all' },
             data: null, expand: {} };

  function sumQuery() {
    var q = '?days=' + encodeURIComponent(ug.today ? 1 : ug.range);
    if (ug.today) q += '&today=1';
    if (ug.gran) q += '&gran=' + ug.gran;
    Object.keys(ug.dims).forEach(function (k) {
      if (ug.dims[k] !== 'all') q += '&' + (k === 'ep' ? 'endpoint' : k) + '=' + encodeURIComponent(ug.dims[k]);
    });
    return q;
  }

  async function loadSummary() {
    try {
      ug.data = await window.pfApi('GET', '/usage' + sumQuery());
      fillDimOptions();
      renderSumKpis(); renderDistModel(); renderDistKey(); renderDistEp(); renderTrend();
    } catch (e) { window.pfErr((e && e.error) || '用量汇总加载失败'); }
  }

  function fillDimOptions() {
    var d = ug.data; if (!d) return;
    function fill(id, vals, allLabel) {
      var el = $(id), old = el.value;
      el.innerHTML = '<option value="all">' + allLabel + '</option>' + vals.map(function (v) {
        return '<option value="' + esc(v.v) + '">' + esc(v.t) + '</option>'; }).join('');
      if (Array.from(el.options).some(function (o) { return o.value === old; })) el.value = old;
    }
    var models = {}, groups = {}, keys = {}, nodes = {}, eps = {};
    (d.rows || []).forEach(function (r) {
      if (r.model) models[r.model] = 1;
      if (r.group) groups[r.group] = 1;
      keys[r.key] = r.alias;
      if (r.node) nodes[r.node] = 1;
      if (r.endpoint) eps[r.endpoint] = 1;
    });
    fill('ug-dim-model', Object.keys(models).sort().map(function (m) { return { v: m, t: m }; }), '全部模型');
    fill('ug-dim-group', Object.keys(groups).sort().map(function (g) { return { v: g, t: g }; }), '全部分组');
    fill('ug-dim-key', Object.keys(keys).sort().map(function (k) { return { v: k, t: '…' + k + '（' + keys[k] + '）' }; }), '全部 Key');
    fill('ug-dim-node', Object.keys(nodes).sort().map(function (n) { return { v: n, t: n }; }), '全部节点');
    fill('ug-dim-ep', Object.keys(eps).sort().map(function (e) { return { v: e, t: e }; }), '全部端点');
  }

  function renderSumKpis() {
    var t = TC();
    var d = ug.data; if (!d) return;
    var tt = d.totals || {};
    var okN = (tt.requests || 0) - (tt.failures || 0);
    var sr = tt.requests ? okN / tt.requests * 100 : null;
    var rangeLabel = ug.today ? '今天' : ({ '0.041666': '近1小时', '0.9999': '近24小时', '7': '近7天' }[ug.range] || ug.range + ' 天');
    var kpis = [
      { label: '总请求', val: fmt(tt.requests), unit: '次', sub: '范围 · ' + rangeLabel, color: t.s.blue },
      { label: '总 Token', val: fmtK((tt.prompt_tokens || 0) + (tt.completion_tokens || 0)), unit: 'tok',
        sub: '读 ' + fmtK(tt.prompt_tokens) + ' / 写 ' + fmtK(tt.completion_tokens), color: t.s.cyan },
      { label: '成功率', val: sr === null ? dash() : sr.toFixed(1), unit: sr === null ? '' : '%',
        sub: '失败 ' + fmt(tt.failures || 0) + ' 次', color: sr !== null && sr < 95 ? t.s.red : t.s.green },
      { label: '平均首字延迟', val: latency(tt.avg_tft).value, unit: latency(tt.avg_tft).unit,
        sub: '成功请求 TTFT · 总时延 ' + latencyHtml(tt.avg_ms), color: t.s.amber },
      { label: '缓存读取 Token', val: fmtK(tt.cached_tokens), unit: 'tok',
        sub: '命中率 ' + (tt.prompt_tokens ? ((tt.cached_tokens || 0) / tt.prompt_tokens * 100).toFixed(0) : '0') + '%（占输入）', color: t.s.violet }
    ];
    $('ug-kpis').innerHTML = kpis.map(function (k) {
      return '<div class="pf-kpi"><div class="k-label"><span class="pf-dot" style="background:' + k.color + ';margin-right:0"></span>' + k.label + '</div>' +
        '<div class="k-val">' + k.val + '<span class="unit">' + k.unit + '</span></div>' +
        '<div class="k-sub">' + k.sub + '</div></div>';
    }).join('');
  }

  function aggRows(keyFn) {
    var m = {};
    (ug.data.rows || []).forEach(function (r) {
      var k = keyFn(r);
      var o = m[k] || (m[k] = { req: 0, inT: 0, outT: 0, cacheT: 0 });
      o.req += r.requests || 0;
      o.inT += r.prompt_tokens || 0;
      o.outT += r.completion_tokens || 0;
      o.cacheT += r.cached_tokens || 0;
    });
    return m;
  }
  function cellTokens(o) {
    return '<td class="num">' + tokenMetricHtml(o.inT + o.outT, 'total', true) + '</td>' +
      '<td class="num">' + tokenMetricHtml(o.inT, 'read', true) + '</td>' +
      '<td class="num">' + tokenMetricHtml(o.outT, 'write', true) + '</td>' +
      '<td class="num">' + cacheMetricHtml(o.cacheT, true) + '</td>';
  }

  function renderDistModel() {
    var t = TC();
    var m = aggRows(function (r) { return r.model || '?'; });
    var byTok = ug.tabModel === 'tok';
    var val = function (k) { return byTok ? m[k].inT + m[k].outT : m[k].req; };
    var keys = Object.keys(m).sort(function (a, b) { return val(b) - val(a); });
    var ch = getChart('ch-dist-model');
    if (ch) ch.setOption(donut(keys.map(function (k) {
      return { name: k, value: val(k), itemStyle: { color: colorFor(t, 'model', k) } };

  function baseTooltip(t) {

  /* ══════════ 请求明细 ══════════ */
  var rl = { range: '0.9999', today: false, from: null, to: null, key: 'all', model: 'all',
             node: 'all', ep: 'all', status: '', q: '', page: 1, per: 20, logs: [], expanded: {} };
  var recEpoch = 0;
  var detailEpoch = 0;

  function detailValue(value) {
    if (value === undefined || value === null || value === '') return '—';
    try { return JSON.stringify(value, null, 2); } catch (e) { return String(value); }
  }

  function detailCode(value) { return '<pre class="ug-detail-code">' + esc(detailValue(value)) + '</pre>'; }

  function detailState(message, kind) {
    return '<div class="ug-detail-state ' + (kind || '') + '">' + esc(message) + '</div>';
  }

  function messageText(value) {
    if (value === undefined || value === null) return '';
    if (typeof value === 'string') return value;
    if (Array.isArray(value)) {
      return value.map(function (part) {
        if (typeof part === 'string') return part;
        if (part && typeof part === 'object' && part.text) return String(part.text);
        return detailValue(part);
      }).join('\n');
    }
    return detailValue(value);
  }

  function conversationHtml(payload) {
    var request = payload && payload.request;
    var response = payload && payload.response;
    var messages = request && Array.isArray(request.messages) ? request.messages : [];
    var choices = response && Array.isArray(response.choices) ? response.choices : [];
    var blocks = [];
    messages.forEach(function (message) {
      if (!message || typeof message !== 'object') return;
      var role = message.role || 'request';
      var content = message.content;
      if (content !== undefined && content !== null && content !== '') {
        blocks.push('<div class="ug-message"><div class="ug-message-role">request · ' + esc(role) + '</div><div class="ug-message-content">' + esc(messageText(content)) + '</div></div>');
      }
      if (Array.isArray(message.tool_calls)) {
        message.tool_calls.forEach(function (call) {
          blocks.push('<div class="ug-message tool"><div class="ug-message-role">request · tool call</div><div class="ug-message-content">' + esc(detailValue(call)) + '</div></div>');
        });
      }
    });
    choices.forEach(function (choice) {
      var message = choice && choice.message;
      if (!message || typeof message !== 'object') return;
      var role = message.role || 'assistant';
      var content = message.content;
      if (content !== undefined && content !== null && content !== '') {
        blocks.push('<div class="ug-message"><div class="ug-message-role">response · ' + esc(role) + '</div><div class="ug-message-content">' + esc(messageText(content)) + '</div></div>');
      }
      if (Array.isArray(message.tool_calls)) {
        message.tool_calls.forEach(function (call) {
          blocks.push('<div class="ug-message tool"><div class="ug-message-role">response · tool call</div><div class="ug-message-content">' + esc(detailValue(call)) + '</div></div>');
        });
      }
    });
    return blocks.length ? blocks.join('') : '<div class="ug-detail-state">请求或响应中没有可解析的 messages/content，完整原文见下方 JSON。</div>';
  }

  function unavailableDetail(row, message) {
    row = row || {};
    $('ug-detail-title').textContent = '请求详情 · ' + (row.request_id || '');
    $('ug-detail-body').innerHTML =

  function renderConversationDetail(detail) {

    var truncated = payload.capture_truncated ? '<div class="ug-detail-notice">原文 capture 达到 Portal 字节上限，当前内容带有截断标记。</div>' : '';
    $('ug-detail-title').textContent = '请求详情 · ' + (detail.request_id || '');
    $('ug-detail-body').innerHTML =
      '<div class="ug-detail-notice">以下内容是 Portal 保存的原文，仅对当前授权管理员可见。Portal 不调用 OPF；collector 的脱敏副本不会显示在此处。</div>' +
      truncated +
      '<dl class="ug-detail-meta">' +
        '<dt>Request ID</dt><dd class="mono">' + esc(detail.request_id) + '</dd>' +
        '<dt>时间</dt><dd>' + esc(detail.created_at) + '</dd>' +

        '<dt>响应类型</dt><dd class="mono">' + esc(payload.response_content_type || '—') + '</dd>' +
        '<dt>Capture</dt><dd><span class="pf-chip accent">' + esc(detail.capture_mode) + '</span></dd>' +
        '<dt>正文</dt><dd>' + esc(detail.content_mode || 'not-captured') + '</dd>' +
        '<dt>保留期</dt><dd>' + esc(String(payload.retention_ttl_days == null ? '—' : payload.retention_ttl_days) + (payload.retention_ttl_days == null ? '' : ' 天（摄取时策略）')) + '</dd>' +
        '<dt>总时延</dt><dd>' + esc(String(payload.latency_ms == null ? '—' : payload.latency_ms) + (payload.latency_ms == null ? '' : ' ms')) + '</dd>' +

      '<section class="ug-detail-section"><h3>原文对话</h3><div class="ug-detail-conversation">' + conversationHtml(payload) + '</div></section>' +
      '<section class="ug-detail-section"><h3>原始 request</h3>' + detailCode(payload.request) + '</section>' +
      '<section class="ug-detail-section"><h3>原始 response</h3>' + detailCode(payload.response) + '</section>' +
      '<section class="ug-detail-section"><h3>Tool calls</h3>' + detailCode(tools) + '</section>' +
      '<section class="ug-detail-section"><h3>Usage</h3>' + detailCode(usage) + '</section>';
  }

  async function openConversationDetail(requestId, row) {
    var epoch = ++detailEpoch;
    $('ug-detail-title').textContent = '请求详情 · ' + requestId;
    $('ug-detail-body').innerHTML = detailState('正在读取 Portal 原文…');
    window.pfDrawer('ug-detail-drawer');
    try {
      var detail = await window.pfApi('GET', '/conversation-monitor/records/' + encodeURIComponent(requestId));
      if (epoch !== detailEpoch) return;
      if (!detail || !detail.payload) throw { status: 404, error: '此请求未采集原文，或已按 TTL / 容量清理。' };
      renderConversationDetail(detail);
    } catch (e) {
      if (epoch !== detailEpoch) return;
      var message;
      if (e && e.status === 401) message = '登录已失效，请重新登录。';
      else if (e && e.status === 403) message = '当前账号没有查看原文的权限。';
      else if (e && e.status === 404) { unavailableDetail(row, e.error || '此请求未采集原文，或已按 TTL / 容量清理。'); return; }
      else message = (e && e.error) || '请求详情加载失败，请稍后重试。';
      $('ug-detail-body').innerHTML = detailState(message, 'error');
    }
  }

  function recQuery() {
    var q = '?days=' + encodeURIComponent(rl.today ? 1 : rl.range) + '&limit=2000';
    if (rl.today) q += '&today=1';
    if (rl.from) q += '&from=' + encodeURIComponent(rl.from);
    if (rl.to) q += '&to=' + encodeURIComponent(rl.to);
    [['key', rl.key], ['model', rl.model], ['node', rl.node], ['endpoint', rl.ep], ['status', rl.status], ['q', rl.q]]
      .forEach(function (p) { if (p[1] && p[1] !== 'all') q += '&' + p[0] + '=' + encodeURIComponent(p[1]); });
    return q;
  }

  async function loadRecs(keepPage) {
    var epoch = ++recEpoch;
    try {
      var all = [], cursor = '';
      /* Follow the server cursor so large ranges remain complete while each
         response stays bounded. The UI still paginates the combined result. */
      for (var page = 0; page < 100; page++) {
        var d = await window.pfApi('GET', '/usage/logs' + recQuery() + (cursor ? '&cursor=' + encodeURIComponent(cursor) : ''));
        if (epoch !== recEpoch) return;
        all = all.concat(d.logs || []);
        if (!d.next_cursor || !d.has_more) break;
        cursor = d.next_cursor;
      }
      if (epoch !== recEpoch) return;
      rl.logs = all;
      if (!keepPage) rl.page = 1;
      rl.expanded = {};
      fillRecFilters();
      renderRecTable();
      $('ug-tab-rec').innerHTML = '请求明细 <span class="mono" style="font-size:10px;color:var(--muted)">(' + fmt(rl.logs.length) + ')</span>';
    } catch (e) { window.pfErr((e && e.error) || '请求明细加载失败'); }
  }

  function fillRecFilters() {
    function fill(id, vals, allLabel) {
      var el = $(id), old = el.value;
      el.innerHTML = '<option value="all">' + allLabel + '</option>' + vals.map(function (v) {
        return '<option value="' + esc(v.v) + '">' + esc(v.t) + '</option>'; }).join('');
      if (Array.from(el.options).some(function (o) { return o.value === old; })) el.value = old;
    }
    var keys = {}, models = {}, nodes = {}, eps = {};
    rl.logs.forEach(function (r) {
      keys[r.key] = r.alias; if (r.model) models[r.model] = 1;
      if (r.node) nodes[r.node] = 1; if (r.endpoint) eps[r.endpoint] = 1;
    });
    fill('ug-f-key', Object.keys(keys).sort().map(function (k) { return { v: k, t: '…' + k + '（' + keys[k] + '）' }; }), '全部 Key');
    fill('ug-f-model', Object.keys(models).sort().map(function (m) { return { v: m, t: m }; }), '全部模型');
    fill('ug-f-node', Object.keys(nodes).sort().map(function (n) { return { v: n, t: n }; }), '全部节点');
    fill('ug-f-ep', Object.keys(eps).sort().map(function (e) { return { v: e, t: e }; }), '全部端点');
  }

  function renderRecStats() {
    var t = TC();
    var rows = rl.logs;
    var ok = rows.filter(function (r) { return r.status === 'ok'; });
    var inT = rows.reduce(function (a, r) { return a + (r.prompt_tokens || 0); }, 0);
    var outT = rows.reduce(function (a, r) { return a + (r.completion_tokens || 0); }, 0);
    var cacheT = rows.reduce(function (a, r) { return a + (r.cached_tokens || 0); }, 0);
    var avgTft = ok.length ? Math.round(ok.reduce(function (a, r) { return a + (r.tft_ms || 0); }, 0) / ok.length) : null;
    var avgLat = ok.length ? Math.round(ok.reduce(function (a, r) { return a + (r.duration_ms || 0); }, 0) / ok.length) : null;
    var sr = rows.length ? ok.length / rows.length * 100 : null;
    var cards = [
      { label: '筛选结果请求数', val: fmt(rows.length), unit: '次', sub: '当前过滤条件命中', color: t.s.blue },
      { label: '成功率', val: sr === null ? dash() : sr.toFixed(1), unit: sr === null ? '' : '%',
        sub: '失败 ' + fmt(rows.length - ok.length) + ' 次', color: sr !== null && sr < 95 ? t.s.red : t.s.green },
      { label: '读 TOKEN 合计', val: fmtK(inT), unit: 'tok', sub: '输入 / Prompt', color: t.s.cyan },
      { label: '写 TOKEN 合计', val: fmtK(outT), unit: 'tok', sub: '输出 / 解码生成', color: t.s.green },
      { label: '缓存 TOKEN 合计', val: fmtK(cacheT), unit: 'tok', sub: 'KV Cache 命中复用', color: t.s.amber },
      { label: '平均延迟', val: avgTft === null ? dash() : latency(avgTft).value, unit: avgTft === null ? '' : latency(avgTft).unit,
        sub: '首字 TTFT · 总时延 ' + (avgLat === null ? '—' : latencyHtml(avgLat)), color: t.s.violet }
    ];
    $('ug-statbar').innerHTML = cards.map(function (k) {
      return '<div class="pf-kpi"><div class="k-label"><span class="pf-dot" style="background:' + k.color + ';margin-right:0"></span>' + k.label + '</div>' +
        '<div class="k-val" style="font-size:20px">' + k.val + '<span class="unit">' + k.unit + '</span></div>' +
        '<div class="k-sub">' + k.sub + '</div></div>';
    }).join('');
  }

  function renderRecTable() {
    renderRecStats();
    var rows = rl.logs;
    var pages = Math.max(1, Math.ceil(rows.length / rl.per));
    if (rl.page > pages) rl.page = pages;
    var slice = rows.slice((rl.page - 1) * rl.per, rl.page * rl.per);
    $('ug-tbody').innerHTML = slice.map(function (r) {
      var fail = r.status === 'failure';

      var tr = '<tr data-rid="' + esc(r.request_id) + '" class="ug-request-row ' + (fail ? 'pf-err-row' : '') + '" tabindex="0" role="button" aria-label="打开请求 ' + esc(r.request_id) + ' 详情">' +
        '<td class="mono" style="font-size:11px">' + esc((r.ts || '').replace('T', ' ')) + '</td>' +
        '<td><span class="mono" style="font-size:11px">…' + esc(r.key) + '</span><div style="font-size:11px;color:var(--muted)">' + esc(r.alias) + ' · ' + esc(r.group || 'default') + '</div></td>' +
        '<td class="mono" style="font-size:11px">' + esc(r.model) + '</td>' +
        '<td class="mono" style="font-size:11px">' + esc(r.node || '—') + '</td>' +
        '<td class="mono" style="font-size:11px;color:var(--muted)">' + esc(r.ip || '—') + '</td>' +
        '<td class="mono" style="font-size:11px;color:var(--muted)">' + esc(r.endpoint || '—') + '</td>' +
        '<td class="num">' + tokenMetricHtml(r.prompt_tokens, 'read') + '</td>' +
        '<td class="num">' + tokenMetricHtml(r.completion_tokens, 'write') + '</td>' +
        '<td class="num">' + cacheMetricHtml(r.cached_tokens) + '</td>' +
        '<td class="num">' + latencyHtml(r.tft_ms) + '</td>' +
        '<td class="num">' + latencyHtml(r.duration_ms) + '</td>' +
        '<td>' + (fail
          ? '<span class="pf-chip err"><span class="pf-dot err" style="margin-right:0"></span>失败</span> <button class="pf-btn-icon ug-error-toggle" type="button" aria-label="展开错误详情" title="展开错误详情">' + (exp ? '▾' : '▸') + '</button>'
          : '<span class="pf-chip ok"><span class="pf-dot ok" style="margin-right:0"></span>成功</span>') + '</td>' +
        '<td><button class="pf-btn sm ug-detail-btn" type="button" data-rid="' + esc(r.request_id) + '">详情</button></td>' +
      '</tr>';
      if (fail && exp) {
        tr += '<tr class="pf-err-row"><td colspan="13"><div class="pf-err-detail">' +
          'request_id: ' + esc(r.request_id) + '\n' +
          'error: ' + esc(r.error || 'failure') + '\n' +
          'node: ' + esc(r.node || '—') + ' · model: ' + esc(r.model) + ' · endpoint: ' + esc(r.endpoint || '—') + '\n' +
          'ip: ' + esc(r.ip || '—') + (r.effort ? ' · effort: ' + esc(r.effort) : '') + '</div></td></tr>';
      }
      return tr;
    }).join('') || '<tr><td colspan="13" style="padding:10px" class="pf-desc">当前过滤条件下暂无请求</td></tr>';
    $('ug-count').textContent = '共 ' + fmt(rows.length) + ' 条 · 第 ' + rl.page + '/' + pages + ' 页';
    /* 分页（窗口页码） */
    var pager = $('ug-pager');
    var btns = '<button data-pg="prev"' + (rl.page <= 1 ? ' disabled' : '') + '>‹</button>';
    var win = [];
    for (var p = 1; p <= pages; p++) if (p === 1 || p === pages || Math.abs(p - rl.page) <= 2) win.push(p);
    var last = 0;
    win.forEach(function (p) {
      if (p - last > 1) btns += '<button disabled>…</button>';
      btns += '<button data-pg="' + p + '"' + (p === rl.page ? ' class="on"' : '') + '>' + p + '</button>';
      last = p;
    });
    btns += '<button data-pg="next"' + (rl.page >= pages ? ' disabled' : '') + '>›</button>';
    pager.innerHTML = btns;
  }

  function csvCell(s) {
    s = String(s == null ? '' : s);
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCsv() {
    var head = ['时间', '请求ID', 'Key', '用户', '分组', '模型', '节点', 'IP', '端点', '读Token', '写Token', '缓存Token', '首字延迟ms', '总时延ms', '状态', '错误详情'];
    var lines = [head.join(',')];
    rl.logs.forEach(function (r) {
      lines.push([r.ts, r.request_id, '…' + r.key, r.alias, r.group, r.model, r.node, r.ip, r.endpoint,
        r.prompt_tokens, r.completion_tokens, r.cached_tokens, r.tft_ms, r.duration_ms,
        r.status === 'failure' ? '失败' : '成功', r.error].map(csvCell).join(','));
    });
    var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'llm-portal-requests-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 100);
    window.pfToast('已导出当前筛选结果集 ' + rl.logs.length + ' 条 CSV');
  }

  function fmtDTLocal(d) {
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function setRecRange(t) {
    rl.today = t === 'today';
    rl.from = rl.to = null;
    if (t !== 'today') rl.range = t;
  }

  window.pfReady.then(function () {
    $('ug-policy-open').addEventListener('click', function () {
      window.pfDrawer('ug-policy-drawer');
      loadPolicyPanel();
    });
    $('ug-policy-save').addEventListener('click', savePolicyPanel);
    $('ug-monitor-sse-toggle').addEventListener('click', toggleMonitorStream);
    $('ug-monitor-health-refresh').addEventListener('click', function () {
      loadMonitorHealth();
      window.pfToast('采集健康状态已刷新');
    });
    loadMonitorHealth();
    window.setInterval(loadMonitorHealth, 30000);

    /* 汇总面板事件 */
    $('ug-range').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      setRecRangeShared(b.dataset.r);
      loadSummary();
      loadRecs();
    });
    function setRecRangeShared(r) {
      ug.today = r === 'today';
      if (r !== 'today') ug.range = r;
      /* Keep the detail window aligned with the summary selection so switching
         tabs does not silently show a different time range. */
      setRecRange(r);
    }
    $('ug-gran').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      ug.gran = b.dataset.g;
      loadSummary();
    });
    [['ug-dim-model', 'model'], ['ug-dim-group', 'group'], ['ug-dim-key', 'key'],
     ['ug-dim-node', 'node'], ['ug-dim-ep', 'ep']].forEach(function (pair) {
      $(pair[0]).addEventListener('change', function () {
        ug.dims[pair[1]] = this.value;
        loadSummary();
      });
    });
    $('ug-dim-reset').addEventListener('click', function () {
      ug.dims = { model: 'all', group: 'all', key: 'all', node: 'all', ep: 'all' };
      ['ug-dim-model', 'ug-dim-group', 'ug-dim-key', 'ug-dim-node', 'ug-dim-ep'].forEach(function (id) { $(id).value = 'all'; });
      loadSummary();
      window.pfToast('维度筛选已重置');
    });
    $('ug-refresh1').addEventListener('click', function () { loadSummary(); window.pfToast('用量汇总已刷新'); });
    $('ug-tabs').addEventListener('click', function (e) {
      var tab = e.target.closest('.pf-tab');
      if (tab && tab.dataset.tab === 'rec') loadRecs();
    });
    $('ug-model-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      ug.tabModel = b.dataset.m;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderDistModel();
    });
    $('ug-key-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      ug.tabKey = b.dataset.k;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderDistKey();
    });
    $('ug-ep-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      ug.tabEp = b.dataset.e;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderDistEp();
    });
    $('ug-dist-model').addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-dx]'); if (!tr) return;
      var k = tr.dataset.dx;
      ug.expand[k] = !ug.expand[k];
      renderDistModel();
    });

    /* 明细面板事件 */
    $('ug-time').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      var t = b.dataset.t;
      if (t === 'custom') {
        var now = new Date(), from = new Date(now.getTime() - 86400000);
        $('ug-custom-wrap').style.display = '';
        $('ug-from').value = fmtDTLocal(from);
        $('ug-to').value = fmtDTLocal(now);
        rl.from = from.toISOString();
        rl.to = now.toISOString();
      } else {
        $('ug-custom-wrap').style.display = 'none';
        setRecRange(t);
      }
      loadRecs();
    });
    $('ug-from').addEventListener('change', function () {
      if (this.value) rl.from = this.value ? new Date(this.value).toISOString() : null;
      loadRecs();
    });
    $('ug-to').addEventListener('change', function () {
      rl.to = this.value ? new Date(this.value).toISOString() : null;
      loadRecs();
    });
    [['ug-f-key', 'key'], ['ug-f-model', 'model'], ['ug-f-node', 'node'], ['ug-f-ep', 'ep'], ['ug-f-status', 'status']]
      .forEach(function (pair) {
        $(pair[0]).addEventListener('change', function () {
          rl[pair[1]] = this.value;
          loadRecs();
        });
      });
    var searchTimer = null;
    $('ug-search').addEventListener('input', function () {
      clearTimeout(searchTimer);
      var v = this.value.trim();
      searchTimer = setTimeout(function () { rl.q = v; loadRecs(); }, 350);
    });
    $('ug-reset').addEventListener('click', function () {
      rl = { range: '0.9999', today: false, from: null, to: null, key: 'all', model: 'all',
             node: 'all', ep: 'all', status: '', q: '', page: 1, per: 20, logs: rl.logs, expanded: {} };
      $('ug-search').value = '';
      $('ug-f-key').value = 'all';       // 先复位 DOM，fillRecFilters 才不会恢复旧选择
      $('ug-f-model').value = 'all';
      $('ug-f-node').value = 'all';
      $('ug-f-ep').value = 'all';
      $('ug-f-status').value = '';
      $('ug-custom-wrap').style.display = 'none';
      document.querySelectorAll('#ug-time button').forEach(function (x) { x.classList.toggle('on', x.dataset.t === '0.9999'); });
      loadRecs();
      window.pfToast('已重置全部过滤条件（默认近24小时）');
    });
    $('ug-refresh2').addEventListener('click', function () { loadRecs(); });
    $('ug-csv').addEventListener('click', exportCsv);
    $('ug-per').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      rl.per = parseInt(b.dataset.p, 10); rl.page = 1;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderRecTable();
    });
    $('ug-pager').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-pg]'); if (!b || b.disabled) return;
      var g = b.dataset.pg, pages = Math.max(1, Math.ceil(rl.logs.length / rl.per));
      if (g === 'prev') rl.page = Math.max(1, rl.page - 1);
      else if (g === 'next') rl.page = Math.min(pages, rl.page + 1);
      else rl.page = parseInt(g, 10);
      renderRecTable();
    });
    $('ug-tbody').addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-rid]'); if (!tr) return;
      var detailButton = e.target.closest('.ug-detail-btn');
      if (detailButton) {
        e.stopPropagation();
        openConversationDetail(detailButton.dataset.rid || tr.dataset.rid, rl.logs.find(function (row) { return row.request_id === tr.dataset.rid; }));
        return;
      }
      var errorToggle = e.target.closest('.ug-error-toggle');
      if (errorToggle) {
        e.stopPropagation();
        rl.expanded[tr.dataset.rid] = !rl.expanded[tr.dataset.rid];
        renderRecTable();
        return;
      }
      /* Keep the existing failure-row affordance: clicking the red row exposes
         the short error summary; the explicit 详情 button still opens Portal
         detail for both successful and failed requests. */
      if (tr.classList.contains('pf-err-row')) {
        rl.expanded[tr.dataset.rid] = !rl.expanded[tr.dataset.rid];
        renderRecTable();
        return;
      }
      openConversationDetail(tr.dataset.rid, rl.logs.find(function (row) { return row.request_id === tr.dataset.rid; }));
    });
    $('ug-tbody').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var tr = e.target.closest('tr[data-rid]'); if (!tr) return;
      e.preventDefault();
      openConversationDetail(tr.dataset.rid, rl.logs.find(function (row) { return row.request_id === tr.dataset.rid; }));
    });

    /* 主题切换 → 图表重渲染 */
    document.addEventListener('pftheme', function () {
      charts = {};
      renderSumKpis(); renderDistModel(); renderDistKey(); renderDistEp(); renderTrend(); renderRecStats();
    });
    window.addEventListener('resize', function () {
      Object.values(charts).forEach(function (c) { if (!c.isDisposed()) c.resize(); });
    });

    loadSummary();
    renderRecTable();
  });
})();
</script>
</body>
</html>
