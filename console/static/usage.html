<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><script>try{var q=new URLSearchParams(location.search).get("theme");var t=(q==="light"||q==="dark")?q:(localStorage.getItem("llm-portal-theme")||"dark");document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<title>请求与用量 · 远程模型网关</title>
<link rel="stylesheet" href="assets/portal.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body data-page="usage">
<template id="page">

  <div class="pf-tabs" id="ug-tabs">
    <button class="pf-tab active" data-tab="sum" type="button">用量汇总</button>
    <button class="pf-tab" data-tab="rec" type="button" id="ug-tab-rec">请求明细</button>
  </div>

  <!-- ══════════ 汇总面板 ══════════ -->
  <div class="pf-tabpane active" data-tab="sum" id="ug-panel-sum">
    <div class="pf-toolbar">
      <div class="pf-tb-item"><label>时间范围</label><div class="pf-seg" id="ug-range">
        <button data-r="0.041666">近1小时</button><button data-r="today">今天</button>
        <button data-r="0.9999" class="on">近24小时</button><button data-r="7">近7天</button>
      </div></div>
      <div class="pf-tb-item"><label>粒度</label><div class="pf-seg" id="ug-gran">
        <button data-g="" class="on">自动</button><button data-g="hour">按小时</button><button data-g="day">按天</button>
      </div></div>
      <div class="pf-tb-item"><label>模型</label><select class="pf-select" id="ug-dim-model"><option value="all">全部模型</option></select></div>
      <div class="pf-tb-item"><label>分组</label><select class="pf-select" id="ug-dim-group"><option value="all">全部分组</option></select></div>
      <div class="pf-tb-item"><label>Key</label><select class="pf-select" id="ug-dim-key"><option value="all">全部 Key</option></select></div>
      <div class="pf-tb-item"><label>节点</label><select class="pf-select" id="ug-dim-node"><option value="all">全部节点</option></select></div>
      <div class="pf-tb-item"><label>端点</label><select class="pf-select" id="ug-dim-ep"><option value="all">全部端点</option></select></div>
      <div class="pf-tb-item"><button class="pf-btn" id="ug-dim-reset" type="button">✕ 重置</button></div>
      <div class="pf-tb-right"><button class="pf-btn" id="ug-refresh1" type="button">⟳ 刷新</button></div>
    </div>
    <div class="pf-kpi-row" style="grid-template-columns:repeat(5,1fr)" id="ug-kpis"></div>
    <div class="pf-grid" style="grid-template-columns:1fr 1fr">
      <div class="pf-card">
        <div class="pf-card-head"><div class="pf-card-title">模型分布</div><div class="pf-card-extra pf-panel-tag">donut + 明细</div></div>
        <div class="pf-minitabs" id="ug-model-tabs"><button data-m="tok" class="on" type="button">按 Tokens</button><button data-m="req" type="button">按请求数</button></div>
        <div style="display:grid;grid-template-columns:190px minmax(0,1fr);gap:8px;align-items:start;overflow-x:auto">
          <div id="ch-dist-model" class="pf-chart" style="height:206px"></div>
          <table class="pf-table"><thead><tr><th style="width:20px"></th><th>模型</th><th class="num">请求数</th>
            <th class="num">Tokens</th><th class="num">读</th><th class="num">写</th><th class="num">缓存</th></tr></thead>
          <tbody id="ug-dist-model"></tbody></table>
        </div>
      </div>
      <div class="pf-card">
        <div class="pf-card-head"><div class="pf-card-title">分组 / Key 分布</div><div class="pf-card-extra pf-panel-tag">donut + 明细</div></div>
        <div class="pf-minitabs" id="ug-key-tabs"><button data-k="group" class="on" type="button">按分组</button><button data-k="key" type="button">按 Key</button></div>
        <div style="display:grid;grid-template-columns:190px minmax(0,1fr);gap:8px;align-items:start;overflow-x:auto">
          <div id="ch-dist-key" class="pf-chart" style="height:206px"></div>
          <table class="pf-table"><thead><tr><th id="ug-key-th">分组</th><th class="num">请求数</th>
            <th class="num">Tokens</th><th class="num">读</th><th class="num">写</th><th class="num">缓存</th></tr></thead>
          <tbody id="ug-dist-key"></tbody></table>
        </div>
      </div>
      <div class="pf-card">
        <div class="pf-card-head"><div class="pf-card-title">端点分布</div><div class="pf-card-extra pf-panel-tag">donut + 明细</div></div>
        <div class="pf-minitabs" id="ug-ep-tabs"><button data-e="tok" class="on" type="button">按 Tokens</button><button data-e="req" type="button">按请求数</button></div>
        <div style="display:grid;grid-template-columns:190px minmax(0,1fr);gap:8px;align-items:start;overflow-x:auto">
          <div id="ch-dist-ep" class="pf-chart" style="height:206px"></div>
          <table class="pf-table"><thead><tr><th>端点</th><th class="num">请求数</th>
            <th class="num">Tokens</th><th class="num">读</th><th class="num">写</th><th class="num">缓存</th></tr></thead>
          <tbody id="ug-dist-ep"></tbody></table>
        </div>
      </div>
      <div class="pf-card">
        <div class="pf-card-head"><div class="pf-card-title">Token 用量趋势</div><div class="pf-card-extra pf-panel-tag" id="ug-trend-tag"></div></div>
        <div id="ch-ug-trend" class="pf-chart" style="height:262px"></div>
      </div>
    </div>
  </div>

  <!-- ══════════ 明细面板 ══════════ -->
  <div class="pf-tabpane" data-tab="rec" id="ug-panel-rec">
    <div class="pf-kpi-row" style="grid-template-columns:repeat(6,1fr)" id="ug-statbar"></div>
    <div class="pf-toolbar">
      <div class="pf-tb-item"><label>时间</label><div class="pf-seg" id="ug-time">
        <button data-t="0.041666">近1小时</button><button data-t="today">今天</button>
        <button data-t="0.9999" class="on">近24小时</button><button data-t="7">近7天</button><button data-t="custom">自定义</button>
      </div></div>
      <div class="pf-tb-item" id="ug-custom-wrap" style="display:none">
        <input type="datetime-local" class="pf-input" id="ug-from" style="width:190px"><span class="pf-desc">至</span><input type="datetime-local" class="pf-input" id="ug-to" style="width:190px">
      </div>
      <div class="pf-tb-item"><label>Key</label><select class="pf-select" id="ug-f-key"><option value="all">全部 Key</option></select></div>
      <div class="pf-tb-item"><label>模型</label><select class="pf-select" id="ug-f-model"><option value="all">全部模型</option></select></div>
      <div class="pf-tb-item"><label>节点</label><select class="pf-select" id="ug-f-node"><option value="all">全部节点</option></select></div>
      <div class="pf-tb-item"><label>端点</label><select class="pf-select" id="ug-f-ep"><option value="all">全部端点</option></select></div>
      <div class="pf-tb-item"><label>状态</label><select class="pf-select" id="ug-f-status"><option value="">全部</option><option value="ok">成功</option><option value="failure">失败</option></select></div>
      <div class="pf-tb-item"><input type="text" class="pf-input" id="ug-search" placeholder="搜索 Key / 用户 / 模型 / 节点 / 端点 / request_id…" style="width:230px"></div>
      <div class="pf-tb-right">
        <span id="ug-count"></span>
        <button class="pf-btn" id="ug-reset" type="button">✕ 重置</button>
        <button class="pf-btn" id="ug-refresh2" type="button">⟳ 刷新</button>
        <button class="pf-btn primary" id="ug-csv" type="button">⬇ 导出 CSV</button>
      </div>
    </div>
    <div class="pf-card flush">
      <table class="pf-table"><thead><tr>
        <th>时间</th><th>Key / 用户</th><th>模型</th><th>节点</th><th>端点</th>
        <th class="num">读 Token</th><th class="num">写 Token</th><th class="num">缓存 Token</th>
        <th class="num">首字延迟</th><th class="num">总时延</th><th>状态</th>
      </tr></thead><tbody id="ug-tbody"></tbody></table>
      <div style="display:flex;align-items:center;padding:9px 12px;gap:12px">
        <div class="pf-tb-item"><label>每页</label><div class="pf-seg" id="ug-per">
          <button data-p="10" type="button">10</button><button data-p="20" class="on" type="button">20</button><button data-p="50" type="button">50</button>
        </div></div>
        <div class="pf-pager" id="ug-pager" style="margin-left:auto;padding:0"></div>
      </div>
    </div>
  </div>

</template>
<script src="assets/vendor/echarts.min.js"></script>
<script src="assets/portal.js"></script>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmt(n) { return Number(Math.round(n || 0)).toLocaleString('zh-CN'); }
  function fmtK(n) {
    n = Number(n || 0);
    if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(1) + '万';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(Math.round(n));
  }
  function dash() { return '<span style="color:var(--muted)">—</span>'; }

  function TC() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    return {
      text2: light ? '#475569' : '#9ca3af', muted: light ? '#64748b' : '#6b7280',
      border: light ? '#e2e8f0' : '#1f2937', panel2: light ? '#f8fafc' : '#151b26',
      panel: light ? '#ffffff' : '#111827', heading: light ? '#0f172a' : '#f3f4f6',
      s: light ? { cyan: '#4f46e5', green: '#16a34a', amber: '#d97706', red: '#dc2626', blue: '#2563eb', violet: '#7c3aed' }
               : { cyan: '#22d3ee', green: '#34d399', amber: '#fbbf24', red: '#f87171', blue: '#60a5fa', violet: '#a78bfa' }
    };
  }
  var SERIES_COLORS = ['cyan', 'green', 'violet', 'amber', 'blue'];
  var charts = {};
  function getChart(id) {
    var dom = $(id);
    if (!dom) return null;
    if (charts[id] && charts[id].isDisposed()) delete charts[id];
    if (!charts[id]) charts[id] = echarts.init(dom, null, { renderer: 'canvas' });
    return charts[id];
  }
  function axisStyle(t) {
    return { axisLine: { lineStyle: { color: t.border } }, axisLabel: { color: t.muted, fontSize: 10, fontFamily: 'ui-monospace,Menlo,monospace' }, splitLine: { lineStyle: { color: t.panel2 } } };
  }
  function tooltipItem(t) {
    return { trigger: 'item', backgroundColor: t.panel2, borderColor: t.border,
      textStyle: { color: t.text2, fontSize: 11, fontFamily: 'ui-monospace,Menlo,monospace' } };
  }
  function donut(items, centerLabel, centerVal) {
    var t = TC();
    return {
      backgroundColor: 'transparent',
      tooltip: tooltipItem(t),
      title: { text: centerVal, subtext: centerLabel, left: 'center', top: '38%',
        textStyle: { color: t.heading, fontSize: 15, fontFamily: 'ui-monospace,Menlo,monospace' },
        subtextStyle: { color: t.muted, fontSize: 9 } },
      series: [{ type: 'pie', radius: ['56%', '80%'], center: ['50%', '50%'],
        label: { show: false }, labelLine: { show: false },
        itemStyle: { borderColor: t.panel, borderWidth: 2 },
        emphasis: { scale: true, scaleSize: 4 },
        data: items }]
    };
  }
  /* 维度取色：同名实体在同一面板内颜色稳定 */
  function colorFor(t, kind, key) {
    var idx = 0;
    for (var i = 0; i < key.length; i++) idx = (idx * 31 + key.charCodeAt(i)) >>> 0;
    return t.s[SERIES_COLORS[idx % SERIES_COLORS.length]];
  }

  /* ══════════ 汇总状态 ══════════ */
  var ug = { range: '0.9999', today: false, gran: '', tabModel: 'tok', tabKey: 'group', tabEp: 'tok',
             dims: { model: 'all', group: 'all', key: 'all', node: 'all', ep: 'all' },
             data: null, expand: {} };

  function sumQuery() {
    var q = '?days=' + encodeURIComponent(ug.today ? 1 : ug.range);
    if (ug.today) q += '&today=1';
    if (ug.gran) q += '&gran=' + ug.gran;
    Object.keys(ug.dims).forEach(function (k) {
      if (ug.dims[k] !== 'all') q += '&' + (k === 'ep' ? 'endpoint' : k) + '=' + encodeURIComponent(ug.dims[k]);
    });
    return q;
  }

  async function loadSummary() {
    try {
      ug.data = await window.pfApi('GET', '/usage' + sumQuery());
      fillDimOptions();
      renderSumKpis(); renderDistModel(); renderDistKey(); renderDistEp(); renderTrend();
    } catch (e) { window.pfErr((e && e.error) || '用量汇总加载失败'); }
  }

  function fillDimOptions() {
    var d = ug.data; if (!d) return;
    function fill(id, vals, allLabel) {
      var el = $(id), old = el.value;
      el.innerHTML = '<option value="all">' + allLabel + '</option>' + vals.map(function (v) {
        return '<option value="' + esc(v.v) + '">' + esc(v.t) + '</option>'; }).join('');
      if (Array.from(el.options).some(function (o) { return o.value === old; })) el.value = old;
    }
    var models = {}, groups = {}, keys = {}, nodes = {}, eps = {};
    (d.rows || []).forEach(function (r) {
      if (r.model) models[r.model] = 1;
      if (r.group) groups[r.group] = 1;
      keys[r.key] = r.alias;
      if (r.node) nodes[r.node] = 1;
      if (r.endpoint) eps[r.endpoint] = 1;
    });
    fill('ug-dim-model', Object.keys(models).sort().map(function (m) { return { v: m, t: m }; }), '全部模型');
    fill('ug-dim-group', Object.keys(groups).sort().map(function (g) { return { v: g, t: g }; }), '全部分组');
    fill('ug-dim-key', Object.keys(keys).sort().map(function (k) { return { v: k, t: '…' + k + '（' + keys[k] + '）' }; }), '全部 Key');
    fill('ug-dim-node', Object.keys(nodes).sort().map(function (n) { return { v: n, t: n }; }), '全部节点');
    fill('ug-dim-ep', Object.keys(eps).sort().map(function (e) { return { v: e, t: e }; }), '全部端点');
  }

  function renderSumKpis() {
    var t = TC();
    var d = ug.data; if (!d) return;
    var tt = d.totals || {};
    var okN = (tt.requests || 0) - (tt.failures || 0);
    var sr = tt.requests ? okN / tt.requests * 100 : null;
    var rangeLabel = ug.today ? '今天' : ({ '0.041666': '近1小时', '0.9999': '近24小时', '7': '近7天' }[ug.range] || ug.range + ' 天');
    var kpis = [
      { label: '总请求', val: fmt(tt.requests), unit: '次', sub: '范围 · ' + rangeLabel, color: t.s.blue },
      { label: '总 Token', val: fmtK((tt.prompt_tokens || 0) + (tt.completion_tokens || 0)), unit: 'tok',
        sub: '读 ' + fmtK(tt.prompt_tokens) + ' / 写 ' + fmtK(tt.completion_tokens), color: t.s.cyan },
      { label: '成功率', val: sr === null ? dash() : sr.toFixed(1), unit: sr === null ? '' : '%',
        sub: '失败 ' + fmt(tt.failures || 0) + ' 次', color: sr !== null && sr < 95 ? t.s.red : t.s.green },
      { label: '平均首字延迟', val: tt.avg_tft ? fmt(tt.avg_tft) : dash(), unit: tt.avg_tft ? 'ms' : '',
        sub: '成功请求 TTFT · 总时延 ' + (tt.avg_ms ? fmt(tt.avg_ms) + ' ms' : '—'), color: t.s.amber },
      { label: '缓存读取 Token', val: fmtK(tt.cached_tokens), unit: 'tok',
        sub: '命中率 ' + (tt.prompt_tokens ? ((tt.cached_tokens || 0) / tt.prompt_tokens * 100).toFixed(0) : '0') + '%（占输入）', color: t.s.violet }
    ];
    $('ug-kpis').innerHTML = kpis.map(function (k) {
      return '<div class="pf-kpi"><div class="k-label"><span class="pf-dot" style="background:' + k.color + ';margin-right:0"></span>' + k.label + '</div>' +
        '<div class="k-val">' + k.val + '<span class="unit">' + k.unit + '</span></div>' +
        '<div class="k-sub">' + k.sub + '</div></div>';
    }).join('');
  }

  function aggRows(keyFn) {
    var m = {};
    (ug.data.rows || []).forEach(function (r) {
      var k = keyFn(r);
      var o = m[k] || (m[k] = { req: 0, inT: 0, outT: 0, cacheT: 0 });
      o.req += r.requests || 0;
      o.inT += r.prompt_tokens || 0;
      o.outT += r.completion_tokens || 0;
      o.cacheT += r.cached_tokens || 0;
    });
    return m;
  }
  function cellTokens(o) {
    return '<td class="num" style="color:var(--accent)">' + fmtK(o.inT + o.outT) + '</td>' +
      '<td class="num">' + fmtK(o.inT) + '</td>' +
      '<td class="num">' + fmtK(o.outT) + '</td>' +
      '<td class="num">' + (o.cacheT ? fmtK(o.cacheT) : dash()) + '</td>';
  }

  function renderDistModel() {
    var t = TC();
    var m = aggRows(function (r) { return r.model || '?'; });
    var byTok = ug.tabModel === 'tok';
    var val = function (k) { return byTok ? m[k].inT + m[k].outT : m[k].req; };
    var keys = Object.keys(m).sort(function (a, b) { return val(b) - val(a); });
    var ch = getChart('ch-dist-model');
    if (ch) ch.setOption(donut(keys.map(function (k) {
      return { name: k, value: val(k), itemStyle: { color: colorFor(t, 'model', k) } };
    }), byTok ? 'Tokens' : '请求', fmtK(keys.reduce(function (a, k) { return a + val(k); }, 0))), { notMerge: true });
    $('ug-dist-model').innerHTML = keys.map(function (k) {
      var o = m[k], exp = ug.expand['m:' + k];
      var sel = ug.dims.model === k;
      var html = '<tr data-dx="m:' + esc(k) + '" class="clickable"' + (sel ? ' style="background:var(--hover);box-shadow:inset 2px 0 0 var(--accent)"' : '') + '>' +
        '<td style="color:var(--muted)">' + (exp ? '▾' : '▸') + '</td>' +
        '<td class="mono"><span class="pf-dot" style="background:' + colorFor(t, 'model', k) + ';margin-right:0"></span> ' + esc(k) + '</td>' +
        '<td class="num">' + fmt(o.req) + '</td>' + cellTokens(o) + '</tr>';
      if (exp) {
        var byNode = aggRows(function (r) { return r.model === k ? (r.node || '—') : null; });
        html += Object.keys(byNode).sort(function (a, b) {
          return (byNode[b].inT + byNode[b].outT) - (byNode[a].inT + byNode[a].outT); }).map(function (n) {
          var no = byNode[n];
          return '<tr style="background:var(--panel3)"><td></td>' +
            '<td class="mono" style="padding-left:22px;color:var(--text2)">└ ' + esc(n) + '</td>' +
            '<td class="num">' + fmt(no.req) + '</td>' + cellTokens(no) + '</tr>';
        }).join('');
      }
      return html;
    }).join('') || '<tr><td colspan="7" style="padding:10px" class="pf-desc">窗口内暂无请求</td></tr>';
  }

  function renderDistKey() {
    var t = TC();
    var byGroup = ug.tabKey === 'group';
    var m = aggRows(function (r) { return byGroup ? (r.group || 'default') : (r.key || '—'); });
    var val = function (k) { return m[k].inT + m[k].outT; };
    var keys = Object.keys(m).sort(function (a, b) { return val(b) - val(a); });
    $('ug-key-th').textContent = byGroup ? '分组' : 'Key / 用户';
    var ch = getChart('ch-dist-key');
    if (ch) {
      var names = {};
      (ug.data.rows || []).forEach(function (r) { names[r.key] = r.alias; });
      ch.setOption(donut(keys.map(function (k) {
        return { name: byGroup ? k : (names[k] || '…' + k), value: val(k), itemStyle: { color: colorFor(t, 'key', k) } };
      }), 'Tokens', fmtK(keys.reduce(function (a, k) { return a + val(k); }, 0))), { notMerge: true });
    }
    $('ug-dist-key').innerHTML = keys.map(function (k) {
      var o = m[k];
      var label = byGroup ? '<span class="pf-chip gray">' + esc(k) + '</span>'
        : '<span class="mono">…' + esc(k) + '</span> <span style="color:var(--muted)">' + esc(names[k] || '') + '</span>';
      return '<tr><td><span class="pf-dot" style="background:' + colorFor(t, 'key', k) + ';margin-right:0"></span> ' + label + '</td>' +
        '<td class="num">' + fmt(o.req) + '</td>' + cellTokens(o) + '</tr>';
    }).join('') || '<tr><td colspan="6" style="padding:10px" class="pf-desc">窗口内暂无请求</td></tr>';
  }

  function renderDistEp() {
    var t = TC();
    var m = aggRows(function (r) { return r.endpoint || '/v1/other'; });
    var byTok = ug.tabEp === 'tok';
    var val = function (k) { return byTok ? m[k].inT + m[k].outT : m[k].req; };
    var keys = Object.keys(m).sort(function (a, b) { return val(b) - val(a); });
    var ch = getChart('ch-dist-ep');
    if (ch) ch.setOption(donut(keys.map(function (k) {
      return { name: k, value: val(k), itemStyle: { color: colorFor(t, 'ep', k) } };
    }), byTok ? 'Tokens' : '请求', fmtK(keys.reduce(function (a, k) { return a + val(k); }, 0))), { notMerge: true });
    $('ug-dist-ep').innerHTML = keys.map(function (k) {
      var o = m[k];
      return '<tr><td class="mono"><span class="pf-dot" style="background:' + colorFor(t, 'ep', k) + ';margin-right:0"></span> ' + esc(k) + '</td>' +
        '<td class="num">' + fmt(o.req) + '</td>' + cellTokens(o) + '</tr>';
    }).join('') || '<tr><td colspan="6" style="padding:10px" class="pf-desc">窗口内暂无请求</td></tr>';
  }

  function renderTrend() {
    var ch = getChart('ch-ug-trend'); if (!ch) return;
    var t = TC();
    var d = ug.data; if (!d) return;
    var byHour = (d.hourly || []).length > 1 && d.hourly[0].label.indexOf('-') < 0;
    var labels = (d.hourly || []).map(function (x) { return x.label; });
    var inD = d.hourly.map(function (x) { return x.in; });
    var outD = d.hourly.map(function (x) { return x.out; });
    var cacheD = d.hourly.map(function (x) { return x.cache; });
    var hitD = d.hourly.map(function (x) { return x.in ? Math.round(x.cache / x.in * 1000) / 10 : 0; });
    $('ug-trend-tag').textContent = '粒度 · ' + (labels.length && labels[0].indexOf('-') >= 0 ? '天' : '小时');
    ch.setOption({
      backgroundColor: 'transparent', tooltip: baseTooltip(t),
      legend: { textStyle: { color: t.text2, fontSize: 10 }, top: 0, icon: 'roundRect', itemWidth: 10, itemHeight: 3 },
      grid: { left: 46, right: 46, top: 28, bottom: 24 },
      xAxis: Object.assign({ type: 'category', boundaryGap: false, data: labels }, axisStyle(t)),
      yAxis: [
        Object.assign({ type: 'value', name: 'Token', nameTextStyle: { color: t.muted, fontSize: 10 },
          axisLabel: { color: t.muted, fontSize: 10, fontFamily: 'ui-monospace,Menlo,monospace',
            formatter: function (v) { return fmtK(v); } } }, axisStyle(t)),
        Object.assign({ type: 'value', name: '命中率 %', max: 100, nameTextStyle: { color: t.muted, fontSize: 10 },
          splitLine: { show: false } }, axisStyle(t))
      ],
      series: [
        { name: '输入 Token', type: 'line', stack: 'tk', smooth: true, symbol: 'none', data: inD,
          lineStyle: { width: 1.3, color: t.s.violet }, itemStyle: { color: t.s.violet }, areaStyle: { color: t.s.violet, opacity: 0.14 } },
        { name: '输出 Token', type: 'line', stack: 'tk', smooth: true, symbol: 'none', data: outD,
          lineStyle: { width: 1.3, color: t.s.cyan }, itemStyle: { color: t.s.cyan }, areaStyle: { color: t.s.cyan, opacity: 0.14 } },
        { name: '缓存读取', type: 'line', stack: 'tk', smooth: true, symbol: 'none', data: cacheD,
          lineStyle: { width: 1.3, color: t.s.amber }, itemStyle: { color: t.s.amber }, areaStyle: { color: t.s.amber, opacity: 0.12 } },
        { name: '缓存命中率', type: 'line', yAxisIndex: 1, smooth: true, symbol: 'none', data: hitD,
          lineStyle: { width: 1.4, color: t.s.green, type: 'dashed' }, itemStyle: { color: t.s.green } }
      ]
    }, { notMerge: true });
  }
  function baseTooltip(t) {
    return { trigger: 'axis', backgroundColor: t.panel2, borderColor: t.border,
      textStyle: { color: t.text2, fontSize: 11, fontFamily: 'ui-monospace,Menlo,monospace' } };
  }

  /* ══════════ 请求明细 ══════════ */
  var rl = { range: '0.9999', today: false, from: null, to: null, key: 'all', model: 'all',
             node: 'all', ep: 'all', status: '', q: '', page: 1, per: 20, logs: [], expanded: {} };
  var recEpoch = 0;

  function recQuery() {
    var q = '?days=' + encodeURIComponent(rl.today ? 1 : rl.range) + '&limit=2000';
    if (rl.today) q += '&today=1';
    if (rl.from) q += '&from=' + encodeURIComponent(rl.from);
    if (rl.to) q += '&to=' + encodeURIComponent(rl.to);
    [['key', rl.key], ['model', rl.model], ['node', rl.node], ['endpoint', rl.ep], ['status', rl.status], ['q', rl.q]]
      .forEach(function (p) { if (p[1] && p[1] !== 'all') q += '&' + p[0] + '=' + encodeURIComponent(p[1]); });
    return q;
  }

  async function loadRecs(keepPage) {
    var epoch = ++recEpoch;
    try {
      var all = [], cursor = '';
      /* Follow the server cursor so large ranges remain complete while each
         response stays bounded. The UI still paginates the combined result. */
      for (var page = 0; page < 100; page++) {
        var d = await window.pfApi('GET', '/usage/logs' + recQuery() + (cursor ? '&cursor=' + encodeURIComponent(cursor) : ''));
        if (epoch !== recEpoch) return;
        all = all.concat(d.logs || []);
        if (!d.next_cursor || !d.has_more) break;
        cursor = d.next_cursor;
      }
      if (epoch !== recEpoch) return;
      rl.logs = all;
      if (!keepPage) rl.page = 1;
      rl.expanded = {};
      fillRecFilters();
      renderRecTable();
      $('ug-tab-rec').innerHTML = '请求明细 <span class="mono" style="font-size:10px;color:var(--muted)">(' + fmt(rl.logs.length) + ')</span>';
    } catch (e) { window.pfErr((e && e.error) || '请求明细加载失败'); }
  }

  function fillRecFilters() {
    function fill(id, vals, allLabel) {
      var el = $(id), old = el.value;
      el.innerHTML = '<option value="all">' + allLabel + '</option>' + vals.map(function (v) {
        return '<option value="' + esc(v.v) + '">' + esc(v.t) + '</option>'; }).join('');
      if (Array.from(el.options).some(function (o) { return o.value === old; })) el.value = old;
    }
    var keys = {}, models = {}, nodes = {}, eps = {};
    rl.logs.forEach(function (r) {
      keys[r.key] = r.alias; if (r.model) models[r.model] = 1;
      if (r.node) nodes[r.node] = 1; if (r.endpoint) eps[r.endpoint] = 1;
    });
    fill('ug-f-key', Object.keys(keys).sort().map(function (k) { return { v: k, t: '…' + k + '（' + keys[k] + '）' }; }), '全部 Key');
    fill('ug-f-model', Object.keys(models).sort().map(function (m) { return { v: m, t: m }; }), '全部模型');
    fill('ug-f-node', Object.keys(nodes).sort().map(function (n) { return { v: n, t: n }; }), '全部节点');
    fill('ug-f-ep', Object.keys(eps).sort().map(function (e) { return { v: e, t: e }; }), '全部端点');
  }

  function renderRecStats() {
    var t = TC();
    var rows = rl.logs;
    var ok = rows.filter(function (r) { return r.status === 'ok'; });
    var inT = rows.reduce(function (a, r) { return a + (r.prompt_tokens || 0); }, 0);
    var outT = rows.reduce(function (a, r) { return a + (r.completion_tokens || 0); }, 0);
    var cacheT = rows.reduce(function (a, r) { return a + (r.cached_tokens || 0); }, 0);
    var avgTft = ok.length ? Math.round(ok.reduce(function (a, r) { return a + (r.tft_ms || 0); }, 0) / ok.length) : null;
    var avgLat = ok.length ? Math.round(ok.reduce(function (a, r) { return a + (r.duration_ms || 0); }, 0) / ok.length) : null;
    var sr = rows.length ? ok.length / rows.length * 100 : null;
    var cards = [
      { label: '筛选结果请求数', val: fmt(rows.length), unit: '次', sub: '当前过滤条件命中', color: t.s.blue },
      { label: '成功率', val: sr === null ? dash() : sr.toFixed(1), unit: sr === null ? '' : '%',
        sub: '失败 ' + fmt(rows.length - ok.length) + ' 次', color: sr !== null && sr < 95 ? t.s.red : t.s.green },
      { label: '读 TOKEN 合计', val: fmtK(inT), unit: 'tok', sub: '输入 / Prompt', color: t.s.cyan },
      { label: '写 TOKEN 合计', val: fmtK(outT), unit: 'tok', sub: '输出 / 解码生成', color: t.s.green },
      { label: '缓存 TOKEN 合计', val: fmtK(cacheT), unit: 'tok', sub: 'KV Cache 命中复用', color: t.s.amber },
      { label: '平均延迟', val: avgTft === null ? dash() : fmt(avgTft), unit: avgTft === null ? '' : 'ms',
        sub: '首字 TTFT · 总时延 ' + (avgLat === null ? '—' : fmt(avgLat) + ' ms'), color: t.s.violet }
    ];
    $('ug-statbar').innerHTML = cards.map(function (k) {
      return '<div class="pf-kpi"><div class="k-label"><span class="pf-dot" style="background:' + k.color + ';margin-right:0"></span>' + k.label + '</div>' +
        '<div class="k-val" style="font-size:20px">' + k.val + '<span class="unit">' + k.unit + '</span></div>' +
        '<div class="k-sub">' + k.sub + '</div></div>';
    }).join('');
  }

  function renderRecTable() {
    renderRecStats();
    var rows = rl.logs;
    var pages = Math.max(1, Math.ceil(rows.length / rl.per));
    if (rl.page > pages) rl.page = pages;
    var slice = rows.slice((rl.page - 1) * rl.per, rl.page * rl.per);
    $('ug-tbody').innerHTML = slice.map(function (r) {
      var fail = r.status === 'failure';
      var exp = rl.expanded[r.request_id];
      var tr = '<tr data-rid="' + esc(r.request_id) + '" class="' + (fail ? 'pf-err-row' : '') + (fail ? ' clickable' : '') + '">' +
        '<td class="mono" style="font-size:11px">' + esc((r.ts || '').replace('T', ' ')) + '</td>' +
        '<td><span class="mono" style="font-size:11px">…' + esc(r.key) + '</span><div style="font-size:11px;color:var(--muted)">' + esc(r.alias) + ' · ' + esc(r.group || 'default') + '</div></td>' +
        '<td class="mono" style="font-size:11px">' + esc(r.model) + '</td>' +
        '<td class="mono" style="font-size:11px">' + esc(r.node || '—') + '</td>' +
        '<td class="mono" style="font-size:11px;color:var(--muted)">' + esc(r.endpoint || '—') + '</td>' +
        '<td class="num">' + fmt(r.prompt_tokens) + '</td>' +
        '<td class="num">' + fmt(r.completion_tokens) + '</td>' +
        '<td class="num">' + (r.cached_tokens ? fmt(r.cached_tokens) : dash()) + '</td>' +
        '<td class="num">' + (r.tft_ms ? fmt(r.tft_ms) + ' ms' : dash()) + '</td>' +
        '<td class="num">' + fmt(r.duration_ms) + ' ms</td>' +
        '<td>' + (fail
          ? '<span class="pf-chip err"><span class="pf-dot err" style="margin-right:0"></span>失败</span> <span style="font-size:11px;color:var(--muted)">' + (exp ? '▾' : '▸') + '</span>'
          : '<span class="pf-chip ok"><span class="pf-dot ok" style="margin-right:0"></span>成功</span>') + '</td>' +
      '</tr>';
      if (fail && exp) {
        tr += '<tr class="pf-err-row"><td colspan="11"><div class="pf-err-detail">' +
          'request_id: ' + esc(r.request_id) + '\n' +
          'error: ' + esc(r.error || 'failure') + '\n' +
          'node: ' + esc(r.node || '—') + ' · model: ' + esc(r.model) + ' · endpoint: ' + esc(r.endpoint || '—') + '\n' +
          'ip: ' + esc(r.ip || '—') + (r.effort ? ' · effort: ' + esc(r.effort) : '') + '</div></td></tr>';
      }
      return tr;
    }).join('') || '<tr><td colspan="11" style="padding:10px" class="pf-desc">当前过滤条件下暂无请求</td></tr>';
    $('ug-count').textContent = '共 ' + fmt(rows.length) + ' 条 · 第 ' + rl.page + '/' + pages + ' 页';
    /* 分页（窗口页码） */
    var pager = $('ug-pager');
    var btns = '<button data-pg="prev"' + (rl.page <= 1 ? ' disabled' : '') + '>‹</button>';
    var win = [];
    for (var p = 1; p <= pages; p++) if (p === 1 || p === pages || Math.abs(p - rl.page) <= 2) win.push(p);
    var last = 0;
    win.forEach(function (p) {
      if (p - last > 1) btns += '<button disabled>…</button>';
      btns += '<button data-pg="' + p + '"' + (p === rl.page ? ' class="on"' : '') + '>' + p + '</button>';
      last = p;
    });
    btns += '<button data-pg="next"' + (rl.page >= pages ? ' disabled' : '') + '>›</button>';
    pager.innerHTML = btns;
  }

  function csvCell(s) {
    s = String(s == null ? '' : s);
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCsv() {
    var head = ['时间', '请求ID', 'Key', '用户', '分组', '模型', '节点', '端点', '读Token', '写Token', '缓存Token', '首字延迟ms', '总时延ms', '状态', '错误详情'];
    var lines = [head.join(',')];
    rl.logs.forEach(function (r) {
      lines.push([r.ts, r.request_id, '…' + r.key, r.alias, r.group, r.model, r.node, r.endpoint,
        r.prompt_tokens, r.completion_tokens, r.cached_tokens, r.tft_ms, r.duration_ms,
        r.status === 'failure' ? '失败' : '成功', r.error].map(csvCell).join(','));
    });
    var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'llm-portal-requests-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 100);
    window.pfToast('已导出当前筛选结果集 ' + rl.logs.length + ' 条 CSV');
  }

  function fmtDTLocal(d) {
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function setRecRange(t) {
    rl.today = t === 'today';
    rl.from = rl.to = null;
    if (t !== 'today') rl.range = t;
  }

  window.pfReady.then(function () {
    /* 汇总面板事件 */
    $('ug-range').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      setRecRangeShared(b.dataset.r);
      loadSummary();
      loadRecs();
    });
    function setRecRangeShared(r) {
      ug.today = r === 'today';
      if (r !== 'today') ug.range = r;
      /* Keep the detail window aligned with the summary selection so switching
         tabs does not silently show a different time range. */
      setRecRange(r);
    }
    $('ug-gran').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      ug.gran = b.dataset.g;
      loadSummary();
    });
    [['ug-dim-model', 'model'], ['ug-dim-group', 'group'], ['ug-dim-key', 'key'],
     ['ug-dim-node', 'node'], ['ug-dim-ep', 'ep']].forEach(function (pair) {
      $(pair[0]).addEventListener('change', function () {
        ug.dims[pair[1]] = this.value;
        loadSummary();
      });
    });
    $('ug-dim-reset').addEventListener('click', function () {
      ug.dims = { model: 'all', group: 'all', key: 'all', node: 'all', ep: 'all' };
      ['ug-dim-model', 'ug-dim-group', 'ug-dim-key', 'ug-dim-node', 'ug-dim-ep'].forEach(function (id) { $(id).value = 'all'; });
      loadSummary();
      window.pfToast('维度筛选已重置');
    });
    $('ug-refresh1').addEventListener('click', function () { loadSummary(); window.pfToast('用量汇总已刷新'); });
    $('ug-tabs').addEventListener('click', function (e) {
      var tab = e.target.closest('.pf-tab');
      if (tab && tab.dataset.tab === 'rec') loadRecs();
    });
    $('ug-model-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      ug.tabModel = b.dataset.m;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderDistModel();
    });
    $('ug-key-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      ug.tabKey = b.dataset.k;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderDistKey();
    });
    $('ug-ep-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      ug.tabEp = b.dataset.e;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderDistEp();
    });
    $('ug-dist-model').addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-dx]'); if (!tr) return;
      var k = tr.dataset.dx;
      ug.expand[k] = !ug.expand[k];
      renderDistModel();
    });

    /* 明细面板事件 */
    $('ug-time').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      var t = b.dataset.t;
      if (t === 'custom') {
        var now = new Date(), from = new Date(now.getTime() - 86400000);
        $('ug-custom-wrap').style.display = '';
        $('ug-from').value = fmtDTLocal(from);
        $('ug-to').value = fmtDTLocal(now);
        rl.from = from.toISOString();
        rl.to = now.toISOString();
      } else {
        $('ug-custom-wrap').style.display = 'none';
        setRecRange(t);
      }
      loadRecs();
    });
    $('ug-from').addEventListener('change', function () {
      if (this.value) rl.from = this.value ? new Date(this.value).toISOString() : null;
      loadRecs();
    });
    $('ug-to').addEventListener('change', function () {
      rl.to = this.value ? new Date(this.value).toISOString() : null;
      loadRecs();
    });
    [['ug-f-key', 'key'], ['ug-f-model', 'model'], ['ug-f-node', 'node'], ['ug-f-ep', 'ep'], ['ug-f-status', 'status']]
      .forEach(function (pair) {
        $(pair[0]).addEventListener('change', function () {
          rl[pair[1]] = this.value;
          loadRecs();
        });
      });
    var searchTimer = null;
    $('ug-search').addEventListener('input', function () {
      clearTimeout(searchTimer);
      var v = this.value.trim();
      searchTimer = setTimeout(function () { rl.q = v; loadRecs(); }, 350);
    });
    $('ug-reset').addEventListener('click', function () {
      rl = { range: '0.9999', today: false, from: null, to: null, key: 'all', model: 'all',
             node: 'all', ep: 'all', status: '', q: '', page: 1, per: 20, logs: rl.logs, expanded: {} };
      $('ug-search').value = '';
      $('ug-f-key').value = 'all';       // 先复位 DOM，fillRecFilters 才不会恢复旧选择
      $('ug-f-model').value = 'all';
      $('ug-f-node').value = 'all';
      $('ug-f-ep').value = 'all';
      $('ug-f-status').value = '';
      $('ug-custom-wrap').style.display = 'none';
      document.querySelectorAll('#ug-time button').forEach(function (x) { x.classList.toggle('on', x.dataset.t === '0.9999'); });
      loadRecs();
      window.pfToast('已重置全部过滤条件（默认近24小时）');
    });
    $('ug-refresh2').addEventListener('click', function () { loadRecs(); });
    $('ug-csv').addEventListener('click', exportCsv);
    $('ug-per').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      rl.per = parseInt(b.dataset.p, 10); rl.page = 1;
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
      renderRecTable();
    });
    $('ug-pager').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-pg]'); if (!b || b.disabled) return;
      var g = b.dataset.pg, pages = Math.max(1, Math.ceil(rl.logs.length / rl.per));
      if (g === 'prev') rl.page = Math.max(1, rl.page - 1);
      else if (g === 'next') rl.page = Math.min(pages, rl.page + 1);
      else rl.page = parseInt(g, 10);
      renderRecTable();
    });
    $('ug-tbody').addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-rid]'); if (!tr) return;
      rl.expanded[tr.dataset.rid] = !rl.expanded[tr.dataset.rid];
      renderRecTable();
    });

    /* 主题切换 → 图表重渲染 */
    document.addEventListener('pftheme', function () {
      charts = {};
      renderSumKpis(); renderDistModel(); renderDistKey(); renderDistEp(); renderTrend(); renderRecStats();
    });
    window.addEventListener('resize', function () {
      Object.values(charts).forEach(function (c) { if (!c.isDisposed()) c.resize(); });
    });

    loadSummary();
    renderRecTable();
  });
})();
</script>
</body>
</html>
