<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仪表盘 · 远程模型网关</title>
<link rel="stylesheet" href="assets/portal.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body data-page="dashboard">
<template id="page">

  <div class="pf-toolbar" id="dashboard-filters" style="margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <select class="pf-select" id="dash-days"><option value="1">今天</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select>
    <select class="pf-select" id="dash-node"><option value="">全部节点</option></select>
    <select class="pf-select" id="dash-model"><option value="">全部模型</option></select>
    <select class="pf-select" id="dash-key"><option value="">全部 Key</option></select>
    <label class="pf-switch" title="每 15 秒自动更新"><input type="checkbox" id="dash-auto" checked><span></span></label><span class="pf-desc">自动更新</span>
    <span class="pf-desc" id="dash-updated" style="margin-left:auto">等待数据…</span>
  </div>

  <div class="pf-card flush" style="margin-bottom:14px">
    <div class="pf-card-head"><div class="pf-card-title">请求与 Token 趋势</div><div class="pf-card-extra">图表保持不动 · 数据自动更新</div></div>
    <div id="dash-trend" style="height:180px;padding:8px 14px"></div>
    <div style="display:flex;gap:18px;padding:0 14px 10px;color:#8c8c8c;font-size:11px"><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#1677ff;margin-right:4px"></i>请求数</span><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#52c41a;margin-right:4px"></i>输入+输出 Token</span><span id="dash-window">今天</span></div>
  </div>

  <!-- 统计卡行 -->
  <div class="pf-grid cols-4">
    <div class="pf-stat">
      <div class="pf-stat-label">今日请求</div>
      <div class="pf-stat-value" id="stat-req">—</div>
      <div class="pf-stat-sub" id="stat-req-sub">加载中…</div>
    </div>
    <div class="pf-stat">
      <div class="pf-stat-label">Token 消耗（今日）</div>
      <div class="pf-stat-value" id="stat-token">—</div>
      <div class="pf-stat-sub" id="stat-token-sub">&nbsp;</div>
    </div>
    <div class="pf-stat">
      <div class="pf-stat-label">站点隧道</div>
      <div class="pf-stat-value" id="stat-sites">—</div>
      <div class="pf-stat-sub" id="stat-sites-sub">&nbsp;</div>
    </div>
    <div class="pf-stat">
      <div class="pf-stat-label">模型部署状态</div>
      <div class="pf-stat-value" id="stat-deps">—</div>
      <div class="pf-stat-sub" id="stat-deps-sub">&nbsp;</div>
    </div>
  </div>

  <div class="pf-grid main-side">
    <!-- 站点隧道状态 -->
    <div class="pf-card">
      <div class="pf-card-head">
        <div class="pf-card-title">站点隧道状态</div>
        <div class="pf-card-extra"><a href="sites.html">管理站点 ›</a></div>
      </div>
      <div id="site-rows"></div>
    </div>

    <!-- 公网攻击面 -->
    <div class="pf-card">
      <div class="pf-card-head">
        <div class="pf-card-title">公网攻击面</div>
        <div class="pf-card-extra"><span class="pf-chip ok">C1/C2 基线</span></div>
      </div>
      <div class="pf-surface-row">
        <div class="pf-surface-main">
          <span class="pf-surface-icon">443</span>
          <div>
            <div class="pf-surface-title">443/tcp · HTTPS 入口</div>
            <div class="pf-desc">唯一公网入口（API / MCP / 站点接入 / 控制台）</div>
          </div>
        </div>
        <span class="pf-chip ok">开放</span>
      </div>
      <div class="pf-surface-row">
        <div class="pf-surface-main">
          <span class="pf-surface-icon" style="font-size:10px">51820</span>
          <div>
            <div class="pf-surface-title">51820/udp · WireGuard</div>
            <div class="pf-desc">站点隧道；仅已注册密钥的站点可建联</div>
          </div>
        </div>
        <span class="pf-chip ok">开放</span>
      </div>
      <div class="pf-desc" style="border-top:1px solid #f0f0f0;padding-top:10px;margin-top:2px">
        内部组件均不直接对外；攻击面与收敛策略详见 runbook（部署仓库）。
      </div>
    </div>
  </div>

  <div class="pf-card flush">
    <div class="pf-card-head"><div class="pf-card-title">私有化节点实时指标</div><div class="pf-card-extra"><span id="metric-updated">加载中…</span> · Prometheus /metrics</div></div>
    <table class="pf-table"><thead><tr><th>节点</th><th>输出速度</th><th>请求队列</th><th>KV Cache</th><th>GPU 活跃度</th></tr></thead><tbody id="metric-rows"></tbody></table>
  </div>

  <!-- 模型部署健康 -->
  <div class="pf-card flush">
    <div class="pf-card-head">
      <div class="pf-card-title">模型 Deployment 状态（近 24h 请求成败）</div>
      <div class="pf-card-extra"><a href="models.html">查看模型与别名 ›</a></div>
    </div>
    <table class="pf-table">
      <thead>
        <tr><th>对外模型名</th><th>站点</th><th>api_base</th><th>限流 RPM/TPM</th><th>近 24h</th><th>状态</th></tr>
      </thead>
      <tbody id="dep-rows"></tbody>
    </table>
  </div>

  <!-- 最近错误 -->
  <div class="pf-card flush">
    <div class="pf-card-head">
      <div class="pf-card-title">最近错误</div>
      <div class="pf-card-extra"><a href="usage.html">查看用量与错误 ›</a></div>
    </div>
    <table class="pf-table">
      <thead>
        <tr><th>时间</th><th>Key</th><th>模型</th><th>说明</th></tr>
      </thead>
      <tbody id="err-rows"></tbody>
    </table>
    <div class="pf-desc" style="padding:8px 12px">近期错误仅覆盖已入账请求（鉴权失败不产生日志行）。</div>
  </div>

</template>
<script src="assets/portal.js"></script>
<script>
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmtN(n) { return Number(n || 0).toLocaleString('zh-CN'); }
  function fmtM(n) { return n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n || 0); }
  function ago(sec) {
    if (sec === null || sec === undefined) return '未知';
    if (sec < 0) return '从未握手';
    if (sec < 60) return sec + ' 秒前';
    if (sec < 3600) return Math.round(sec / 60) + ' 分钟前';
    if (sec < 86400) return Math.round(sec / 3600) + ' 小时前';
    return Math.round(sec / 86400) + ' 天前';
  }
  function siteNameOf(apiBase, sites) {
    var host = ((apiBase || '').split('//')[1] || '').split(':')[0];
    for (var i = 0; i < sites.length; i++) if (sites[i].wg_ip === host) return sites[i].name;
    return host;
  }

  function queryString() {
    var q = '?days=' + encodeURIComponent(document.getElementById('dash-days').value);
    ['dash-node','dash-model','dash-key'].forEach(function (id) { var v = document.getElementById(id).value; if (v) q += '&' + id.slice(5) + '=' + encodeURIComponent(v); });
    return q;
  }
  function renderTrend(hourly) {
    var W=900,H=150, pad=24, n=hourly.length||1, maxR=Math.max.apply(null,hourly.map(function(x){return x.reqs||0}).concat([1])), maxT=Math.max.apply(null,hourly.map(function(x){return (x.in||0)+(x.out||0)}).concat([1]));
    function pts(fn,max){return hourly.map(function(x,i){var px=pad+(W-pad*2)*(n===1?0.5:i/(n-1||1));var py=H-pad-(H-pad*2)*(fn(x)/max);return px.toFixed(1)+','+py.toFixed(1)}).join(' ')}
    var labels=hourly.filter(function(_,i){return i%Math.max(1,Math.ceil(n/8))===0}).map(function(x,i){return '<text x="'+(pad+i*(W-pad*2)/Math.max(1,Math.ceil(n/8)) + 2)+'" y="'+(H-3)+'" fill="#8c8c8c" font-size="10">'+esc(x.label)+'</text>'}).join('');
    document.getElementById('dash-trend').innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="100%" preserveAspectRatio="none"><path d="M'+pts(function(x){return x.reqs||0},maxR)+'" fill="none" stroke="#1677ff" stroke-width="3" stroke-linecap="round"/><path d="M'+pts(function(x){return (x.in||0)+(x.out||0)},maxT)+'" fill="none" stroke="#52c41a" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>'+labels+'</svg>';
  }
  function fillFilters(d, usage) {
    var nodes=(d.sites.rows||[]).map(function(s){return {value:s.wg_ip||s.address||s.name,label:s.name}}), models=(d.deployments.rows||[]).map(function(s){return s.model}), keys=(usage.rows||[]).map(function(s){return {value:s.key,label:s.alias+' · …'+s.key}});
    function fill(id, vals, label){var el=document.getElementById(id), old=el.value; el.innerHTML='<option value="">'+label+'</option>'+Array.from(new Map(vals.filter(function(v){return v.value||v}).map(function(v){return [v.value||v.value||v,v]})).values()).sort(function(a,b){return (a.label||a).localeCompare(b.label||b)}).map(function(v){var value=v.value||v,labelText=v.label||v;return '<option value="'+esc(value)+'">'+esc(labelText)+'</option>'}).join(''); if(Array.from(el.options).some(function(o){return o.value===old}))el.value=old;}
    fill('dash-node',nodes,'全部节点'); fill('dash-model',models.map(function(v){return {value:v,label:v}}),'全部模型'); fill('dash-key',keys,'全部 Key');
  }
  function loadDashboard() {
    var epoch=++window.__dashEpoch;
    Promise.all([window.pfApi('GET','/overview'), window.pfApi('GET','/usage'+queryString())]).then(function (pair) {
      if(epoch!==window.__dashEpoch)return; var d=pair[0], usage=pair[1], t=usage.totals;
      fillFilters(d, usage); renderTrend(usage.hourly||[]); document.getElementById('dash-window').textContent='窗口：'+(document.getElementById('dash-days').value==='1'?'今天':'最近 '+document.getElementById('dash-days').value+' 天'); document.getElementById('dash-updated').textContent='最近更新 '+new Date().toLocaleTimeString('zh-CN');
      document.getElementById('stat-req').textContent = fmtN(t.requests);
      document.getElementById('stat-req-sub').textContent = '错误 ' + fmtN(t.failures) + ' 次';
      document.getElementById('stat-token').textContent = fmtM(t.prompt_tokens + t.completion_tokens + (t.cached_tokens || 0));
      document.getElementById('stat-token-sub').textContent =
        '输入 ' + fmtM(t.prompt_tokens) + ' · 缓存读取 ' + fmtM(t.cached_tokens || 0) + ' · 输出 ' + fmtM(t.completion_tokens);
      document.getElementById('stat-sites').innerHTML = d.sites.online + '<small>/' + d.sites.total + '</small>';
      document.getElementById('stat-sites-sub').textContent = '隧道在线';
      document.getElementById('stat-deps').innerHTML = d.deployments.healthy + '<small>/' + d.deployments.total + '</small>';
      var bad = d.deployments.total - d.deployments.healthy;
      document.getElementById('stat-deps-sub').textContent = bad ? bad + ' 个待关注' : '全部健康';

      var lockSvg = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="1.8" y="5.4" width="12.4" height="7.4" rx="1.2"/><path d="M4.6 5.4V4a3.4 3.4 0 0 1 6.8 0v1.4"/></svg>';
      document.getElementById('site-rows').innerHTML = d.sites.rows.map(function (s) {
        var online = s.status === 'online';
        var revoked = s.status === 'revoked';
        return '<div class="pf-surface-row">' +
          '<div class="pf-surface-main">' +
            '<span class="pf-surface-icon"' + (revoked ? ' style="background:#fafafa;color:#bfbfbf"' : '') + '>' + lockSvg + '</span>' +
            '<div>' +
              '<div class="pf-surface-title' + (revoked ? ' pf-muted' : '') + '">' + esc(s.name) + ' <span class="pf-muted mono">' + esc(s.wg_ip) + '</span></div>' +
              '<div class="pf-desc">' + (revoked ? '已吊销 · 隧道无法重连' : '最近握手 ' + ago(s.handshake) + ' · ' + s.deployments + ' 个模型部署') + '</div>' +
            '</div>' +
          '</div>' +
          '<span class="pf-chip ' + (online ? 'ok' : revoked ? 'gray' : 'warn') + '">' + (online ? '<span class="pf-dot ok"></span>在线' : revoked ? '已吊销' : esc(s.status)) + '</span>' +
        '</div>';
      }).join('') || '<div class="pf-desc" style="padding:10px 12px">暂无站点</div>';

      document.getElementById('metric-rows').innerHTML = d.sites.rows.filter(function (s) { return s.metrics && Object.keys(s.metrics).length; }).map(function (s) {
        var m = s.metrics || {}, q = (m.requests_running == null ? '—' : Math.round(m.requests_running)) + ' 活动 / ' + (m.requests_waiting == null ? '—' : Math.round(m.requests_waiting)) + ' 排队';
        return '<tr><td>' + esc(s.name) + '</td><td class="num">' + (m.output_tok_s == null ? '—' : m.output_tok_s.toFixed(1) + ' tok/s') + '</td><td>' + q + '</td><td>' + (m.kv_cache_pct == null ? '—' : m.kv_cache_pct.toFixed(1) + '%') + '</td><td>' + (m.gpu_util_pct == null ? '—' : m.gpu_util_pct.toFixed(1) + '%') + '</td></tr>';
      }).join('') || '<tr><td colspan="5" class="pf-desc" style="padding:10px">暂无可用实时指标（节点需提供 /metrics）</td></tr>';
      document.getElementById('metric-updated').textContent = '最近刷新 ' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

      document.getElementById('dep-rows').innerHTML = d.deployments.rows.map(function (r) {
        var chip = r.state === '健康' ? '<span class="pf-chip ok"><span class="pf-dot ok"></span>健康</span>'
          : r.state === '近期异常' ? '<span class="pf-chip warn"><span class="pf-dot warn"></span>近期异常</span>'
          : '<span class="pf-chip gray">' + esc(r.state) + '</span>';
        var lim = (r.rpm == null ? '—' : r.rpm) + ' / ' + (r.tpm == null ? '—' : fmtN(r.tpm));
        return '<tr>' +
          '<td>' + esc(r.model) + '</td>' +
          '<td>' + esc(siteNameOf(r.api_base, d.sites.rows)) + '</td>' +
          '<td class="mono">' + esc((r.api_base || '').replace(/^https?:\/\//, '')) + '</td>' +
          '<td class="num mono">' + lim + '</td>' +
          '<td class="num">' + fmtN(r.requests) + ' 次' + (r.failures ? ' / 败 ' + r.failures : '') + '</td>' +
          '<td>' + chip + '</td>' +
        '</tr>';
      }).join('') || '<tr><td colspan="6" class="pf-desc" style="padding:10px">暂无 deployment</td></tr>';

      document.getElementById('err-rows').innerHTML = d.recent_errors.map(function (e) {
        return '<tr>' +
          '<td class="mono">' + esc((e.time || '').replace('T', ' ').slice(5)) + '</td>' +
          '<td><span class="pf-key">' + esc(e.key) + '</span></td>' +
          '<td>' + esc(e.model) + '</td>' +
          '<td class="pf-desc">' + esc(e.detail) + '</td>' +
        '</tr>';
      }).join('') || '<tr><td colspan="4" class="pf-desc" style="padding:10px">今日无已入账错误</td></tr>';
    }).catch(function (e) { window.pfErr(e.error || '加载失败'); });
  }
  window.pfReady.then(function () {
    ['dash-days','dash-node','dash-model','dash-key'].forEach(function(id){ document.getElementById(id).addEventListener('change', loadDashboard); });
    var timer=null;
    document.getElementById('dash-auto').addEventListener('change', function(){ if(timer)clearInterval(timer); timer=this.checked?setInterval(loadDashboard,15000):null; });
    timer=setInterval(loadDashboard,15000);
    loadDashboard();
  });
})();
</script>
</body>
</html>
