<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCP 管理 · 远程模型网关</title>
<link rel="stylesheet" href="assets/portal.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  #modal-usemcp { width: 680px; max-width: 94vw; }
  #modal-usemcp .pf-modal-body { max-height: 62vh; overflow-y: auto; }
  .mcp-use-key-row { display: flex; gap: 8px; align-items: center; margin: 8px 0 14px; }
  .mcp-use-key-row .pf-input { flex: 1; }
  .mcp-use-key-masked { -webkit-text-security: disc; }
  .mcp-use-blk { margin-top: 12px; }
  .mcp-use-blk-label { font-size: 12px; color: #595959; margin-bottom: 2px; }
  .vision-controls { display:grid; grid-template-columns:minmax(180px,1fr) minmax(220px,1.25fr) auto; gap:8px; }
  .mcp-main-tabs { gap: 22px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: thin; }
  .mcp-main-tab { flex: 0 0 auto; min-width:88px; }
  .mcp-main-pane { min-width: 0; }
  .mcp-usage-toolbar { border-bottom:1px solid #f0f0f0; padding:0; flex-wrap:nowrap; overflow-x:auto; }
  .mcp-usage-spacer { flex:1 0 12px; }
  .mcp-usage-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; padding:14px 0; }
  .mcp-usage-stat { border:1px solid #f0f0f0; border-radius:6px; padding:11px 13px; min-width:0; }
  .mcp-usage-stat-label { color:#8c8c8c; font-size:12px; }
  .mcp-usage-stat-value { font-size:20px; font-weight:600; margin-top:4px; }
  .mcp-usage-table-wrap { overflow-x:auto; min-height:108px; }
  .mcp-tool-list { display:flex; flex-wrap:wrap; gap:4px; min-width:180px; }
  .mcp-share { display:flex; align-items:center; gap:7px; min-width:132px; }
  .mcp-share-track { width:72px; height:5px; overflow:hidden; border-radius:3px; background:#f0f0f0; }
  .mcp-share-bar { height:100%; background:#1677ff; border-radius:3px; }
  @media (max-width: 540px) { .mcp-usage-stats { grid-template-columns:repeat(2,minmax(0,1fr)); } .mcp-usage-toolbar .pf-btn { flex:0 0 auto; } }
  @media (max-width: 760px) { .vision-controls { grid-template-columns:1fr; } }
</style>
</head>
<body data-page="mcp">
<template id="page">

  <div class="pf-page-head">
    <div class="pf-desc">客户端以 <span class="mono">/mcp</span> + 与 API 相同的 Key 注册网关 MCP（Streamable HTTP）；网关按 Key 所属分组裁剪外部工具，用户的 Key 只用于网关鉴权与记账，永不发往任何上游（US-P4/C5）。</div>
  </div>

  <div class="pf-tabs mcp-main-tabs" data-pf-bound="1" role="tablist" aria-label="MCP 管理">
    <button class="pf-tab mcp-main-tab" id="mcp-tab-tools" role="tab" aria-selected="false" aria-controls="mcp-pane-tools" tabindex="-1" data-mcp-main-tab="tools" type="button">工具与模型</button>
    <button class="pf-tab mcp-main-tab" id="mcp-tab-external" role="tab" aria-selected="false" aria-controls="mcp-pane-external" tabindex="-1" data-mcp-main-tab="external" type="button">外部服务</button>
    <button class="pf-tab mcp-main-tab active" id="mcp-tab-usage" role="tab" aria-selected="true" aria-controls="mcp-pane-usage" data-mcp-main-tab="usage" type="button">调用用量</button>
    <button class="pf-tab mcp-main-tab" id="mcp-tab-config" role="tab" aria-selected="false" aria-controls="mcp-pane-config" tabindex="-1" data-mcp-main-tab="config" type="button">接入配置</button>
  </div>

  <section class="pf-tabpane mcp-main-pane" id="mcp-pane-tools" role="tabpanel" aria-labelledby="mcp-tab-tools" data-mcp-main-pane="tools" hidden>
  <!-- 内建工具 -->
  <div class="pf-card">
    <div class="pf-card-head">
      <div class="pf-card-title">内建工具</div>
      <div class="pf-card-extra"><span class="pf-chip info">网关托管</span></div>
    </div>
    <div class="pf-dep-item" style="padding:10px 0">
      <div class="pf-dep-main">
        <strong class="mono" id="builtin-sig">analyze_image(question, image_url | image_base64[, mime_type])</strong>
        <span class="pf-chip gray" id="builtin-model">—</span>
      </div>
      <span class="pf-chip gray" id="builtin-status"><span class="pf-dot"></span>加载中</span>
    </div>
    <div class="pf-dep-item" style="padding:10px 0">
      <div class="pf-dep-main">
        <strong class="mono">upload_image(image_base64[, mime_type])</strong>
        <span class="pf-chip gray">→ 临时 URL（30min）</span>
      </div>
      <span class="pf-chip ok"><span class="pf-dot ok"></span>可用</span>
    </div>
    <div class="pf-form-row" style="margin:4px 0 14px">
      <label for="vision-model">Vision 模型</label>
      <div>
        <div class="vision-controls">
          <select class="pf-input" id="vision-model"></select>
          <select class="pf-input" id="vision-catalog"></select>
          <button class="pf-btn primary" id="btn-save-vision" type="button">保存选择</button>
        </div>
        <div class="pf-desc" id="vision-note" style="margin-top:6px"></div>
      </div>
    </div>
    <div class="pf-kv" style="margin-top:10px">
      <div class="pf-kv-k">凭据边界</div><div class="pf-kv-v">网关以调用者自己的 Key 回调回环 <span class="mono">/v1/chat/completions</span>；私有上游无鉴权，出站不带任何 Key（C5）。</div>
      <div class="pf-kv-k">本地图片</div><div class="pf-kv-v">三种方式任选（issue #71）：① <span class="mono">analyze_image</span> 直接传 <span class="mono">image_base64</span>（+可选 <span class="mono">mime_type</span>，缺省按字节签名识别）一步识别；② <span class="mono">upload_image</span> 传 Base64 换 30 分钟临时 URL，可反复用于 <span class="mono">image_url</span>；③ <span class="mono">POST /mcp/upload</span>（multipart，同一 Key）换临时 URL。三条路径共用同一套校验（类型白名单、签名一致、≤10MB）与临时文件存储。</div>
      <div class="pf-kv-k">用量归属</div><div class="pf-kv-v">模型消耗计入调用者自己的 Key，与 API 通道共用同一账本（与 US-P10 口径一致）。</div>
      <div class="pf-kv-k">客户端兼容</div><div class="pf-kv-v">契约 = Streamable HTTP + 标准 <span class="mono">Authorization: Bearer</span>（与 API 使用同一密钥）+ 小写下划线工具名；Claude Code / Hermes / DeepSeek Harness / Pi（需先安装 pi-mcp-adapter 扩展）四类客户端均可接入，接入示例见 runbook。</div>
    </div>
  </div>
  </section>

  <section class="pf-tabpane mcp-main-pane" id="mcp-pane-external" role="tabpanel" aria-labelledby="mcp-tab-external" data-mcp-main-pane="external" hidden>
  <!-- 外部 MCP 注册表 -->
  <div class="pf-card flush">
    <div class="pf-card-head">
      <div class="pf-card-title">外部 MCP 注册（US-P12）</div>
      <div class="pf-card-extra"><span id="mcp-extra">加载中…</span><button class="pf-btn primary" data-modal="modal-newmcp" type="button">注册外部 MCP</button></div>
    </div>
    <table class="pf-table">
      <thead>
        <tr><th>名称</th><th>URL</th><th>凭据</th><th>工具前缀</th><th>绑定分组</th><th>操作</th></tr>
      </thead>
      <tbody id="mcp-rows"></tbody>
    </table>
  </div>
  <div class="pf-desc">凭据文件权限 0600、不入库；注册/移除后自动重启 mcp-hub 生效（<strong>进行中的工具调用会被中断</strong>，请避开使用高峰）；凭据失效或服务不可达时调用返回可判读的 MCP 结构化错误（透传上游状态码与摘要）。</div>

  <!-- tools/list 预览 -->
  <div class="pf-card">
    <div class="pf-card-head">
      <div class="pf-card-title">聚合 tools/list 预览</div>
      <div class="pf-card-extra"><button class="pf-link" id="btn-refresh-tools">刷新预览</button></div>
    </div>
    <div class="pf-code"><pre id="tools-preview">点击「刷新预览」连接各外部 MCP 获取实时工具清单</pre></div>
  </div>
  </section>

  <section class="pf-tabpane mcp-main-pane active" id="mcp-pane-usage" role="tabpanel" aria-labelledby="mcp-tab-usage" data-mcp-main-pane="usage">
  <!-- 按 Key 调用计数 -->
  <div class="pf-card" style="padding:0 14px">
    <div class="pf-toolbar mcp-usage-toolbar">
      <div class="pf-card-title" id="usage-title">按 Key 调用</div>
      <span class="mcp-usage-spacer"></span>
      <button class="pf-btn sm" id="btn-refresh-mcp-usage" type="button" title="只刷新数据，不刷新页面">↻ 刷新</button>
      <select class="pf-select" id="filter-mcp-usage-days" aria-label="MCP 用量范围" style="width:auto;margin:8px 0">
        <option value="1">今天</option>
        <option value="7">最近 7 天</option>
        <option value="30">最近 30 天</option>
      </select>
    </div>
    <div class="pf-desc" id="mcp-usage-status" role="status" aria-live="polite" style="padding-top:10px">等待加载</div>
    <div class="mcp-usage-stats" id="mcp-usage-stats" aria-live="polite"></div>
    <div class="mcp-usage-table-wrap" id="mcp-usage-table">
      <table class="pf-table">
        <thead><tr><th>Key</th><th>调用占比</th><th>主要工具</th><th>工具明细</th><th class="num">合计</th></tr></thead>
        <tbody id="mcp-usage-rows"></tbody>
      </table>
    </div>
  </div>
  <div class="pf-desc">范围按 Asia/Shanghai 自然日计算；Key 仅显示别名，不展示密钥内容。</div>
  </section>

  <section class="pf-tabpane mcp-main-pane" id="mcp-pane-config" role="tabpanel" aria-labelledby="mcp-tab-config" data-mcp-main-pane="config" hidden>
  <!-- 上传接口说明 -->
  <div class="pf-card">
    <div class="pf-card-head"><div class="pf-card-title">接入 MCP 网关</div><div class="pf-card-extra"><button class="pf-btn primary" id="btn-use-mcp" type="button">使用 MCP</button></div></div>
    <div class="pf-kv">
      <div class="pf-kv-k">Server URL</div><div class="pf-kv-v">在“使用 MCP”中按所选用户 Key 生成当前网关地址与客户端配置。</div>
      <div class="pf-kv-k">鉴权</div><div class="pf-kv-v">与模型 API 使用同一把用户 Key；Key 不会发送给上游 MCP 服务。</div>
      <div class="pf-kv-k">客户端</div><div class="pf-kv-v">提供 Codex CLI、Claude Code 和通用 Streamable HTTP 配置。</div>
    </div>
  </div>
  <div class="pf-card">
    <div class="pf-card-head"><div class="pf-card-title">本地图片上传接口</div></div>
    <div class="pf-kv" style="margin-bottom:12px">
      <div class="pf-kv-k">入口</div><div class="pf-kv-v mono">POST /mcp/upload</div>
      <div class="pf-kv-k">鉴权</div><div class="pf-kv-v">与 API 使用同一密钥；无效密钥拒绝</div>
      <div class="pf-kv-k">有效期</div><div class="pf-kv-v">临时 URL 随机不可猜路径，30 分钟 TTL 自动清理</div>
      <div class="pf-kv-k">限制</div><div class="pf-kv-v">类型 jpg / png / webp / gif；大小 ≤ 10MB；超限或类型非法返回 413 / 400</div>
    </div>
    <div class="pf-code"><pre>curl -X POST /mcp/upload \
  -H "Authorization: Bearer sk-…（你的 Key）" \
  -F "file=@screenshot.png"

# 响应
{ "url": "https://<域名>/mcp/files/<随机token>.png", "expires_in": 1800 }</pre></div>
  </div>
  </section>

  <!-- 注册外部 MCP 弹窗 -->
  <div class="pf-modal" id="modal-newmcp">
    <div class="pf-modal-head">
      <div class="pf-modal-title">注册外部 MCP</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">
      <div class="pf-desc" id="mcp-register-error" role="alert" aria-live="assertive" style="margin-bottom:8px"></div>
      <div class="pf-form-row">
        <label class="req">名称</label>
        <div><input class="pf-input" id="mcp-name" placeholder="例：zhipu"></div>
      </div>
      <div class="pf-form-row">
        <label class="req">URL</label>
        <div><input class="pf-input mono" id="mcp-url" placeholder="https://…"></div>
      </div>
      <div class="pf-form-row">
        <label>API Key</label>
        <div>
          <input class="pf-input" id="mcp-apikey" type="password" placeholder="该外部服务的访问凭据（无鉴权可留空）" autocomplete="off">
          <div class="pf-desc">保存后不再回显（仅尾 4 位）；文件权限 0600，不入库。</div>
        </div>
      </div>
      <div class="pf-form-row">
        <label class="req">工具前缀</label>
        <div>
          <input class="pf-input mono" id="mcp-prefix" placeholder="例：zhipu_">
          <div class="pf-desc">聚合 tools/list 时用前缀防止命名冲突；限小写字母/数字/下划线（<span class="mono">[a-z0-9_]</span>）。</div>
        </div>
      </div>
      <div class="pf-form-row">
        <label>绑定分组</label>
        <div>
          <div id="mcp-group-checks"></div>
          <div class="pf-desc">可多选；不绑定表示全局可用。受限 MCP 仅对所属分组 Key 可见、可调用。</div>
        </div>
      </div>
    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" data-close>取消</button>
      <button class="pf-btn primary" id="btn-create-mcp">保存并重载</button>
    </div>
  </div>

  <div class="pf-modal" id="modal-mcpgroups" style="width:460px">
    <div class="pf-modal-head">
      <div class="pf-modal-title">绑定分组 · <span id="edit-mcp-name" class="mono"></span></div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">
      <div class="pf-desc" id="mcp-groups-error" role="alert" aria-live="assertive" style="margin-bottom:8px"></div>
      <div id="edit-mcp-group-checks"></div>
      <div class="pf-desc" style="margin-top:8px">清空全部选项后，该 MCP 将对所有有效 Key 开放。</div>
    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" data-close>取消</button>
      <button class="pf-btn primary" id="btn-save-mcp-groups">保存并重载</button>
    </div>
  </div>

  <div class="pf-modal" id="modal-mcp-confirm" role="dialog" aria-modal="true"
       aria-labelledby="mcp-confirm-title" aria-describedby="mcp-confirm-message" style="width:460px">
    <div class="pf-modal-head">
      <div class="pf-modal-title" id="mcp-confirm-title">确认操作</div>
      <button class="pf-x" id="btn-mcp-confirm-close" type="button" aria-label="取消">×</button>
    </div>
    <div class="pf-modal-body">
      <div id="mcp-confirm-message"></div>
      <div class="pf-desc" id="mcp-confirm-error" role="alert" aria-live="assertive" style="margin-top:8px"></div>
      <div class="pf-banner" style="margin-top:12px">确认后将重启 mcp-hub 生效，进行中的工具调用会被中断。</div>
    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" id="btn-mcp-confirm-cancel" type="button">取消</button>
      <button class="pf-btn primary" id="btn-mcp-confirm-submit" type="button">确认并重载</button>
    </div>
  </div>

  <div class="pf-modal" id="modal-usemcp">
    <div class="pf-modal-head">
      <div class="pf-modal-title">使用 MCP 网关</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">
      <div class="pf-kv" style="margin-bottom:10px">
        <div class="pf-kv-k">Server URL</div><div class="pf-kv-v mono" id="mcp-use-url"></div>
        <div class="pf-kv-k">鉴权</div><div class="pf-kv-v">与模型 API 使用同一把用户 Key</div>
      </div>
      <div class="pf-form-row" style="margin-bottom:8px">
        <label>用户 Key</label>
        <div><select class="pf-select" id="mcp-use-key-select"></select></div>
      </div>
      <div class="mcp-use-key-row">
        <input class="pf-input mono mcp-use-key-masked" id="mcp-use-key" type="text"
               autocomplete="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-1p-ignore
               placeholder="选择用户 Key 后自动从保险库取回">
        <button class="pf-btn" id="btn-mcp-use-show" type="button" title="显示或隐藏密钥">显示</button>
        <button class="pf-btn primary" id="btn-mcp-use-import" type="button" hidden>校验并保存</button>
      </div>
      <div class="pf-desc" id="mcp-use-key-note" style="margin-top:-8px;margin-bottom:12px"></div>

      <div class="pf-tabs" data-pf-bound="1" role="tablist" aria-label="MCP 客户端配置">
        <button class="pf-tab active" id="mcp-client-tab-codex" role="tab" aria-selected="true" aria-controls="mcp-client-pane-codex" data-mcp-client-tab="codex" type="button">Codex CLI</button>
        <button class="pf-tab" id="mcp-client-tab-claude" role="tab" aria-selected="false" aria-controls="mcp-client-pane-claude" tabindex="-1" data-mcp-client-tab="claude" type="button">Claude Code</button>
        <button class="pf-tab" id="mcp-client-tab-generic" role="tab" aria-selected="false" aria-controls="mcp-client-pane-generic" tabindex="-1" data-mcp-client-tab="generic" type="button">通用配置</button>
      </div>
      <div class="pf-tabpane active" id="mcp-client-pane-codex" role="tabpanel" aria-labelledby="mcp-client-tab-codex" data-mcp-client-pane="codex">
        <div class="mcp-use-blk"><div class="mcp-use-blk-label">macOS · Linux</div>
          <div class="pf-code"><pre id="mcp-codex-nix"></pre></div></div>
        <div class="mcp-use-blk"><div class="mcp-use-blk-label">Windows PowerShell</div>
          <div class="pf-code"><pre id="mcp-codex-win"></pre></div></div>
      </div>
      <div class="pf-tabpane" id="mcp-client-pane-claude" role="tabpanel" aria-labelledby="mcp-client-tab-claude" data-mcp-client-pane="claude" hidden>
        <div class="mcp-use-blk"><div class="mcp-use-blk-label">用户级配置</div>
          <div class="pf-code"><pre id="mcp-claude-command"></pre></div></div>
      </div>
      <div class="pf-tabpane" id="mcp-client-pane-generic" role="tabpanel" aria-labelledby="mcp-client-tab-generic" data-mcp-client-pane="generic" hidden>
        <div class="mcp-use-blk"><div class="mcp-use-blk-label">支持 Streamable HTTP 的 MCP 客户端</div>
          <div class="pf-code"><pre id="mcp-generic-json"></pre></div></div>
      </div>
      <div class="pf-banner" style="margin-top:14px">配置包含用户 Key 明文时，请勿提交到代码仓库、截图外发或粘贴到不可信环境。</div>
    </div>
    <div class="pf-modal-foot"><button class="pf-btn" data-close>关闭</button></div>
  </div>

</template>
<script src="assets/portal.js"></script>
<script>
(function () {
  'use strict';
  var revealGeneration = 0;
  var visionCandidates = [];
  var pendingMcpAction = null;
  var mcpConfirmReturnFocus = null;
  var mcpConfirmSourceFocus = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmtN(n) { return Number(n || 0).toLocaleString('zh-CN'); }
  var availableGroups = [];

  function groupChecks(id, selected, cls) {
    var chosen = new Set(selected || []);
    document.getElementById(id).innerHTML = availableGroups.map(function (g) {
      return '<label style="display:block;margin:6px 0"><input type="checkbox" class="' + cls + '" value="' + esc(g) + '"' +
        (chosen.has(g) ? ' checked' : '') + '> <span class="mono">' + esc(g) + '</span></label>';
    }).join('') || '<div class="pf-desc">暂无可绑定的自定义分组</div>';
  }

  function selectedGroups(cls) {
    return Array.from(document.querySelectorAll('.' + cls + ':checked')).map(function (cb) { return cb.value; });
  }

  function openMcpConfirm(action) {
    pendingMcpAction = action;
    mcpConfirmReturnFocus = document.activeElement;
    mcpConfirmSourceFocus = document.activeElement;
    document.getElementById('mcp-confirm-title').textContent = action.title;
    document.getElementById('mcp-confirm-message').textContent = action.message;
    document.getElementById('mcp-confirm-error').textContent = '';
    if (action.sourceModal === 'modal-newmcp') document.getElementById('mcp-register-error').textContent = '';
    if (action.sourceModal === 'modal-mcpgroups') document.getElementById('mcp-groups-error').textContent = '';
    document.getElementById('btn-mcp-confirm-submit').textContent = action.confirmLabel || '确认并重载';
    document.getElementById('btn-mcp-confirm-submit').disabled = false;
    setMcpConfirmInert(true);
    window.pfModal('modal-mcp-confirm');
    var confirmButton = document.getElementById('btn-mcp-confirm-submit');
    requestAnimationFrame(function () { confirmButton.focus({ preventScroll: true }); });
    setTimeout(function () {
      if (pendingMcpAction) confirmButton.focus({ preventScroll: true });
    }, 220);
  }

  function setMcpConfirmInert(active) {
    var content = document.querySelector('.pf-content');
    if (!content) return;
    Array.from(content.children).forEach(function (child) {
      if (child.id === 'modal-mcp-confirm') return;
      child.inert = active;
      if (active) child.setAttribute('aria-hidden', 'true');
      else child.removeAttribute('aria-hidden');
    });
  }

  function restoreMcpFocus(target) {
    setTimeout(function () {
      if (target && target.isConnected && !target.disabled) target.focus();
      else document.getElementById('btn-create-mcp').focus();
    }, 50);
  }

  function cancelMcpConfirm() {
    var action = pendingMcpAction;
    pendingMcpAction = null;
    setMcpConfirmInert(false);
    if (action && action.sourceModal) {
      window.pfModal(action.sourceModal);
      restoreMcpFocus(mcpConfirmSourceFocus);
    } else {
      window.pfModalClose();
      restoreMcpFocus(mcpConfirmReturnFocus);
    }
  }

  function submitMcpConfirm() {
    var action = pendingMcpAction;
    if (!action) return;
    var submit = document.getElementById('btn-mcp-confirm-submit');
    submit.disabled = true;
    window.pfApi('POST', action.path, action.body()).then(function (d) {
      pendingMcpAction = null;
      setMcpConfirmInert(false);
      window.pfModalClose();
      restoreMcpFocus(mcpConfirmReturnFocus);
      action.success(d);
    }).catch(function (e) {
      document.getElementById('mcp-confirm-error').textContent = e.error || action.failure;
      if (action.sourceModal) {
        if (action.sourceModal === 'modal-newmcp') document.getElementById('mcp-register-error').textContent = e.error || action.failure;
        if (action.sourceModal === 'modal-mcpgroups') document.getElementById('mcp-groups-error').textContent = e.error || action.failure;
        setMcpConfirmInert(false);
        window.pfModal(action.sourceModal);
        restoreMcpFocus(mcpConfirmSourceFocus);
      } else {
        submit.disabled = false;
      }
      window.pfErr(e.error || action.failure);
    });
  }

  function mcpKeyValue() {
    return document.getElementById('mcp-use-key').value.trim();
  }

  function fillMcpUse() {
    var url = location.origin + '/mcp';
    var key = mcpKeyValue();
    var quote = function (s) { return '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"'; };
    document.getElementById('mcp-use-url').textContent = url;
    if (!key) {
      ['mcp-codex-nix', 'mcp-codex-win', 'mcp-claude-command', 'mcp-generic-json'].forEach(function (id) {
        document.getElementById(id).textContent = '';
      });
      return;
    }
    document.getElementById('mcp-codex-nix').textContent =
      'export LLM_PORTAL_KEY=' + quote(key) + '\n' +
      'codex mcp add llm-portal --url ' + quote(url) + ' --bearer-token-env-var LLM_PORTAL_KEY';
    document.getElementById('mcp-codex-win').textContent =
      '$env:LLM_PORTAL_KEY = ' + quote(key) + '\n' +
      'codex mcp add llm-portal --url ' + quote(url) + ' --bearer-token-env-var LLM_PORTAL_KEY';
    document.getElementById('mcp-claude-command').textContent =
      'claude mcp add --transport http --scope user llm-portal ' + quote(url) +
      ' --header ' + quote('Authorization: Bearer ' + key);
    document.getElementById('mcp-generic-json').textContent = JSON.stringify({
      mcpServers: {
        'llm-portal': { type: 'http', url: url, headers: { Authorization: 'Bearer ' + key } }
      }
    }, null, 2);
  }

  function revealMcpUseKey(token) {
    var generation = ++revealGeneration;
    var key = document.getElementById('mcp-use-key');
    var note = document.getElementById('mcp-use-key-note');
    var importBtn = document.getElementById('btn-mcp-use-import');
    key.value = '';
    key.readOnly = true;
    importBtn.hidden = true;
    key.placeholder = token ? '正在从保险库取回…' : '暂无启用的用户 Key';
    note.textContent = '';
    fillMcpUse();
    if (!token) return;
    window.pfApi('POST', '/keys/reveal', { key: token }).then(function (d) {
      if (generation !== revealGeneration || document.getElementById('mcp-use-key-select').value !== token) return;
      key.value = d.key || '';
      key.placeholder = '';
      note.textContent = '已从加密保险库取回；切换上方用户 Key 会同步刷新配置。';
      fillMcpUse();
    }).catch(function () {
      if (generation !== revealGeneration || document.getElementById('mcp-use-key-select').value !== token) return;
      key.readOnly = false;
      key.placeholder = '该 Key 明文不在保险库，请手动粘贴完整 Key';
      note.textContent = '这是保险库启用前创建的历史 Key；粘贴完整 Key 并校验保存后才会生成配置。';
      importBtn.hidden = false;
      key.focus();
      fillMcpUse();
    });
  }

  function loadMcpUseKeys() {
    var select = document.getElementById('mcp-use-key-select');
    select.innerHTML = '<option value="">加载中…</option>';
    window.pfApi('GET', '/keys').then(function (d) {
      var keys = (d.keys || []).filter(function (key) { return !key.blocked; })
        .sort(function (a, b) { return String(b.created_at || '').localeCompare(String(a.created_at || '')); });
      select.innerHTML = keys.map(function (key) {
        return '<option value="' + esc(key.token) + '">' + esc(key.alias) + ' · ' +
          esc(key.group) + ' · sk-' + esc(key.key_last4) + '</option>';
      }).join('') || '<option value="">暂无启用的用户 Key</option>';
      revealMcpUseKey(select.value);
    }).catch(function (e) {
      select.innerHTML = '<option value="">用户 Key 加载失败</option>';
      document.getElementById('mcp-use-key-note').textContent = e.error || '用户 Key 加载失败';
      revealMcpUseKey('');
    });
  }

  function renderMcp(d) {
    availableGroups = d.groups || [];
    groupChecks('mcp-group-checks', [], 'new-mcp-group');
    document.getElementById('builtin-sig').textContent = d.builtin.tool;
    document.getElementById('builtin-model').textContent = d.builtin.model;
    document.getElementById('mcp-extra').textContent = '共 ' + d.external.length + ' 个';
    document.getElementById('mcp-rows').innerHTML = d.external.map(function (e) {
      return '<tr>' +
        '<td>' + esc(e.name) + '</td>' +
        '<td class="mono">' + esc(e.url) + '</td>' +
        '<td><span class="pf-chip ok">已保存</span> <span class="pf-key">' + esc(e.api_key_last4) + '</span></td>' +
        '<td class="mono">' + esc(e.prefix) + '</td>' +
        '<td>' + ((e.groups || []).map(function (g) { return '<span class="pf-chip">' + esc(g) + '</span>'; }).join(' ') || '<span class="pf-chip ok">全局</span>') + '</td>' +
        '<td><button class="pf-link js-mcp-groups" data-name="' + esc(e.name) + '">编辑分组</button> ' +
        '<button class="pf-link danger js-mcp-remove" data-name="' + esc(e.name) + '">移除</button></td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="6" class="pf-desc" style="padding:10px">暂未注册外部 MCP（US-P12：注册后用户无需自备外部服务凭据）</td></tr>';
    document.querySelectorAll('.js-mcp-groups').forEach(function (btn) {
      btn.onclick = function () {
        var entry = d.external.find(function (e) { return e.name === btn.dataset.name; });
        document.getElementById('edit-mcp-name').textContent = btn.dataset.name;
        groupChecks('edit-mcp-group-checks', entry ? entry.groups : [], 'edit-mcp-group');
        window.pfModal('modal-mcpgroups');
      };
    });
    document.querySelectorAll('.js-mcp-remove').forEach(function (btn) {
      btn.onclick = function () {
        var name = btn.dataset.name;
        openMcpConfirm({
          title: '确认移除外部 MCP',
          message: '移除外部 MCP「' + name + '」？',
          path: '/mcp/remove',
          body: function () { return { name: name }; },
          success: function () { window.pfToast('已移除并重启 mcp-hub'); load(); },
          failure: '移除失败'
        });
      };
    });
  }

  function updateVisionCatalogOptions() {
    var model = document.getElementById('vision-model').value;
    var catalog = document.getElementById('vision-catalog');
    var candidate = visionCandidates.find(function (item) { return item.model === model; });
    var matches = candidate ? (candidate.catalog_matches || []).filter(function (item) {
      return (item.input_modalities || []).indexOf('image') !== -1;
    }) : [];
    if (matches.length) {
      catalog.disabled = false;
      catalog.innerHTML = matches.map(function (item) {
        return '<option value="' + esc(item.id) + '">' + esc(item.name) + ' · ' + esc(item.id) + '</option>';
      }).join('');
      document.getElementById('vision-note').textContent = '能力来源：models.dev · image input';
    } else {
      catalog.disabled = true;
      catalog.innerHTML = '<option value="">models.dev 未收录 · 保存时真实图片探测</option>';
      document.getElementById('vision-note').textContent = '私有或自定义模型将在保存前执行一次真实图片探测。';
    }
  }

  function renderVision(d) {
    visionCandidates = (d.candidates || []).filter(function (item) { return item.capability !== 'text_only'; });
    var selected = d.selected || {};
    var model = document.getElementById('vision-model');
    model.innerHTML = visionCandidates.map(function (item) {
      var suffix = item.capability === 'image' ? ' · 图片输入' : ' · 待实测';
      return '<option value="' + esc(item.model) + '">' + esc(item.model + suffix) + '</option>';
    }).join('') || '<option value="">没有可配置的模型</option>';
    if (selected.model && visionCandidates.some(function (item) { return item.model === selected.model; })) {
      model.value = selected.model;
    }
    updateVisionCatalogOptions();
    if (selected.catalog_id) document.getElementById('vision-catalog').value = selected.catalog_id;

    var status = document.getElementById('builtin-status');
    var configured = Boolean(selected.model);
    var valid = configured && selected.valid;
    status.className = 'pf-chip ' + (valid ? 'ok' : (configured ? 'warn' : 'gray'));
    status.innerHTML = '<span class="pf-dot ' + (valid ? 'ok' : (configured ? 'warn' : '')) + '"></span>' +
      (valid ? '可用' : (configured ? '配置失效' : '未配置'));
    document.getElementById('builtin-model').textContent = selected.model || '未配置';
    var catalogState = d.catalog || {};
    var note = document.getElementById('vision-note');
    if (catalogState.status === 'stale') note.textContent += ' · 当前使用本地缓存目录';
    if (catalogState.status === 'unavailable') note.textContent += ' · models.dev 暂不可用';
    document.getElementById('btn-save-vision').disabled = !model.value;
  }

  var mcpUsageDays = 1;
  var mcpUsageRequest = 0;
  var mcpUsageLabels = {1: '今天', 7: '最近 7 天', 30: '最近 30 天'};

  function renderUsageStats(total, activeKeys, toolCount) {
    document.getElementById('mcp-usage-stats').innerHTML = [
      ['总调用', fmtN(total)], ['活跃 Key', fmtN(activeKeys)], ['已调用工具', fmtN(toolCount)]
    ].map(function (item) {
      return '<div class="mcp-usage-stat"><div class="mcp-usage-stat-label">' + item[0] +
        '</div><div class="mcp-usage-stat-value">' + item[1] + '</div></div>';
    }).join('');
  }

  function setUsageState(state, message) {
    document.getElementById('mcp-usage-status').textContent = message;
    if (state !== 'data') {
      renderUsageStats(0, 0, 0);
      document.getElementById('mcp-usage-rows').innerHTML =
        '<tr><td colspan="5" class="pf-desc" style="padding:10px">' + esc(message) + '</td></tr>';
    }
  }

  function renderUsage(d) {
    var keys = Array.isArray(d.keys) ? d.keys : [];
    var total = keys.reduce(function (sum, key) { return sum + Number(key.total || 0); }, 0);
    var allTools = {};
    keys.forEach(function (key) { Object.keys(key.tools || {}).forEach(function (tool) { allTools[tool] = true; }); });
    renderUsageStats(total, keys.length, Object.keys(allTools).length);
    document.getElementById('mcp-usage-rows').innerHTML = keys.map(function (k) {
      var toolNames = Object.keys(k.tools || {});
      var tools = toolNames.map(function (t) {
        return '<span class="pf-chip">' + esc(t) + ' × ' + fmtN(k.tools[t]) + '</span>';
      }).join(' ');
      var primary = toolNames.sort(function (a, b) { return Number(k.tools[b]) - Number(k.tools[a]); })[0] || '—';
      var share = total ? Math.round(Number(k.total || 0) * 100 / total) : 0;
      return '<tr>' +
        '<td>' + esc(k.alias) + '</td>' +
        '<td><div class="mcp-share"><div class="mcp-share-track"><div class="mcp-share-bar" style="width:' + share + '%"></div></div><span>' + share + '%</span></div></td>' +
        '<td class="mono">' + esc(primary) + '</td>' +
        '<td><div class="mcp-tool-list">' + (tools || '<span class="pf-desc">—</span>') + '</div></td>' +
        '<td class="num" style="font-weight:600">' + fmtN(k.total) + '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="5" class="pf-desc" style="padding:10px">此范围内暂无 MCP 工具调用</td></tr>';
    document.getElementById('mcp-usage-status').textContent = keys.length ?
      mcpUsageLabels[mcpUsageDays] + '数据已刷新' : mcpUsageLabels[mcpUsageDays] + '暂无 MCP 工具调用';
  }

  function selectMcpMainTab(name) {
    document.querySelectorAll('[data-mcp-main-tab]').forEach(function (tab) {
      var active = tab.dataset.mcpMainTab === name;
      tab.classList.toggle('active', active);
      tab.setAttribute('aria-selected', String(active));
      tab.tabIndex = active ? 0 : -1;
    });
    document.querySelectorAll('[data-mcp-main-pane]').forEach(function (pane) {
      var active = pane.dataset.mcpMainPane === name;
      pane.classList.toggle('active', active);
      pane.hidden = !active;
    });
  }

  function selectMcpClientTab(name) {
    document.querySelectorAll('[data-mcp-client-tab]').forEach(function (tab) {
      var active = tab.dataset.mcpClientTab === name;
      tab.classList.toggle('active', active);
      tab.setAttribute('aria-selected', String(active));
      tab.tabIndex = active ? 0 : -1;
    });
    document.querySelectorAll('[data-mcp-client-pane]').forEach(function (pane) {
      var active = pane.dataset.mcpClientPane === name;
      pane.classList.toggle('active', active);
      pane.hidden = !active;
    });
  }

  function setUsageRefreshLoading(on) {
    var button = document.getElementById('btn-refresh-mcp-usage');
    button.disabled = on;
    button.textContent = on ? '↻ 刷新中…' : '↻ 刷新';
  }

  function loadUsage() {
    var request = ++mcpUsageRequest;
    setUsageState('loading', '正在加载' + mcpUsageLabels[mcpUsageDays] + ' MCP 工具调用…');
    setUsageRefreshLoading(true);
    window.pfApi('GET', '/mcp/usage?days=' + mcpUsageDays).then(function (d) {
      if (request !== mcpUsageRequest) return;
      renderUsage(d);
    }).catch(function (e) {
      if (request !== mcpUsageRequest) return;
      var message = 'MCP 工具调用加载失败：' + (e.error || '请求失败');
      setUsageState('error', message);
      window.pfErr(message);
    }).finally(function () {
      if (request === mcpUsageRequest) setUsageRefreshLoading(false);
    });
  }

  function load() {
    window.pfApi('GET', '/mcp').then(renderMcp).catch(function (e) { window.pfErr(e.error || 'MCP 注册加载失败'); });
    window.pfApi('GET', '/mcp/vision').then(renderVision).catch(function (e) { window.pfErr(e.error || 'Vision 模型加载失败'); });
    loadUsage();
  }

  window.pfReady.then(function () {
    load();
    document.querySelectorAll('[data-mcp-main-tab]').forEach(function (button) {
      button.addEventListener('click', function () { selectMcpMainTab(button.dataset.mcpMainTab); });
    });
    document.querySelectorAll('[data-mcp-client-tab]').forEach(function (button) {
      button.addEventListener('click', function () { selectMcpClientTab(button.dataset.mcpClientTab); });
    });
    document.getElementById('filter-mcp-usage-days').addEventListener('change', function () {
      mcpUsageDays = Number(this.value);
      loadUsage();
    });
    document.getElementById('btn-refresh-mcp-usage').addEventListener('click', loadUsage);
    document.getElementById('btn-use-mcp').addEventListener('click', function () {
      var key = document.getElementById('mcp-use-key');
      key.value = '';
      key.readOnly = true;
      key.classList.add('mcp-use-key-masked');
      document.getElementById('btn-mcp-use-import').hidden = true;
      document.getElementById('btn-mcp-use-show').textContent = '显示';
      fillMcpUse();
      window.pfModal('modal-usemcp');
      loadMcpUseKeys();
    });
    document.getElementById('mcp-use-key-select').addEventListener('change', function () {
      revealMcpUseKey(this.value);
    });
    document.getElementById('mcp-use-key').addEventListener('input', function () {
      fillMcpUse();
      var selected = document.getElementById('mcp-use-key-select').value;
      document.getElementById('btn-mcp-use-import').disabled = !selected || !this.value.trim();
    });
    document.getElementById('btn-mcp-use-import').addEventListener('click', function () {
      var selectedToken = document.getElementById('mcp-use-key-select').value;
      var key = document.getElementById('mcp-use-key');
      var generation = revealGeneration;
      this.disabled = true;
      window.pfApi('POST', '/keys/import', { key: selectedToken, plaintext: key.value.trim() }).then(function (d) {
        if (generation !== revealGeneration || document.getElementById('mcp-use-key-select').value !== selectedToken) return;
        key.value = d.key;
        key.readOnly = true;
        document.getElementById('btn-mcp-use-import').hidden = true;
        document.getElementById('mcp-use-key-note').textContent = '已校验并存入加密保险库。';
        fillMcpUse();
      }).catch(function (e) {
        document.getElementById('btn-mcp-use-import').disabled = false;
        window.pfErr(e.error || 'Key 校验失败');
      });
    });
    document.getElementById('btn-mcp-use-show').addEventListener('click', function () {
      var key = document.getElementById('mcp-use-key');
      var masked = key.classList.toggle('mcp-use-key-masked');
      this.textContent = masked ? '显示' : '隐藏';
    });
    document.getElementById('btn-refresh-tools').addEventListener('click', function () {
      document.getElementById('tools-preview').textContent = '拉取中…';
      window.pfApi('GET', '/mcp/tools').then(function (d) {
        document.getElementById('tools-preview').textContent = JSON.stringify(d, null, 2);
      }).catch(function (e) { window.pfErr(e.error || '预览失败'); });
    });
    document.getElementById('vision-model').addEventListener('change', updateVisionCatalogOptions);
    document.getElementById('btn-save-vision').addEventListener('click', function () {
      var button = this;
      var model = document.getElementById('vision-model').value;
      var catalog = document.getElementById('vision-catalog');
      if (!model) return;
      button.disabled = true;
      button.textContent = catalog.value ? '保存中…' : '验证中…';
      window.pfApi('POST', '/mcp/vision', { model: model, catalog_id: catalog.value }).then(function (d) {
        window.pfToast(d.selected.source === 'live_probe' ? '图片探测通过，Vision 模型已更新' : 'Vision 模型已更新');
        load();
      }).catch(function (e) {
        button.disabled = false;
        window.pfErr(e.error || 'Vision 模型更新失败');
      }).finally(function () { button.textContent = '保存选择'; });
    });
    document.getElementById('btn-mcp-confirm-cancel').addEventListener('click', cancelMcpConfirm);
    document.getElementById('btn-mcp-confirm-close').addEventListener('click', cancelMcpConfirm);
    document.getElementById('btn-mcp-confirm-submit').addEventListener('click', submitMcpConfirm);
    document.addEventListener('keydown', function (e) {
      var modal = document.getElementById('modal-mcp-confirm');
      if (!pendingMcpAction || !modal.classList.contains('open')) return;
      if (e.key === 'Escape') {
        e.preventDefault();
        e.stopImmediatePropagation();
        cancelMcpConfirm();
        return;
      }
      if (e.key !== 'Tab') return;
      var focusable = Array.from(modal.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled])'));
      var first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault(); first.focus();
      }
    }, true);
    document.addEventListener('click', function (e) {
      if (pendingMcpAction && e.target.classList && e.target.classList.contains('pf-mask')) {
        e.preventDefault();
        e.stopImmediatePropagation();
        cancelMcpConfirm();
      }
    }, true);
    document.getElementById('btn-create-mcp').addEventListener('click', function () {
      var credential = document.getElementById('mcp-apikey').value.trim();
      var body = {
        name: document.getElementById('mcp-name').value.trim(),
        url: document.getElementById('mcp-url').value.trim(),
        api_key: credential,
        prefix: document.getElementById('mcp-prefix').value.trim(),
        groups: selectedGroups('new-mcp-group')
      };
      if (!body.name || !body.url || !body.prefix) { window.pfErr('名称、URL、前缀必填'); return; }
      openMcpConfirm({
        title: '确认注册外部 MCP',
        message: '将注册外部 MCP「' + body.name + '」并验证其工具可用性。',
        sourceModal: 'modal-newmcp',
        path: '/mcp/register',
        body: function () { return body; },
        success: function (d) {
          document.getElementById('tools-preview').textContent = JSON.stringify({ tools: d.tools || [] }, null, 2);
          window.pfToast('已注册并验证 ' + (d.tools || []).length + ' 个工具，mcp-hub 已重启生效');
          load();
        },
        failure: '注册失败'
      });
    });
    document.getElementById('btn-save-mcp-groups').addEventListener('click', function () {
      var name = document.getElementById('edit-mcp-name').textContent;
      var groups = selectedGroups('edit-mcp-group');
      openMcpConfirm({
        title: '确认保存 MCP 分组',
        message: '保存外部 MCP「' + name + '」的分组绑定？',
        sourceModal: 'modal-mcpgroups',
        path: '/mcp/groups',
        body: function () { return { name: name, groups: groups }; },
        success: function () { window.pfToast('分组绑定已更新，mcp-hub 已重启生效'); load(); },
        failure: '分组绑定更新失败'
      });
    });
  });
})();
</script>
</body>
</html>
