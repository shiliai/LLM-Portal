<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM-Portal · 统一可观测性控制台（变体 B · 深色监控指挥中心）</title>
<style>
/* ================= 变体 B · 深色监控指挥中心 ================= */
:root{
  --bg:#0a0e14;
  --bg2:#0d1117;
  --panel:#111827;
  --panel2:#151b26;
  --panel3:#0f1520;
  --border:#1f2937;
  --border2:#263142;
  --text:#d1d5db;
  --text2:#9ca3af;
  --muted:#6b7280;
  --cyan:#22d3ee;
  --green:#34d399;
  --amber:#fbbf24;
  --red:#f87171;
  --blue:#60a5fa;
  --violet:#a78bfa;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:13px;
  min-width:1280px;
  overflow-x:auto;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#1f2937;border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- 布局骨架 ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:208px;flex:0 0 208px;
  background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:50;
}
#main{flex:1;margin-left:208px;min-width:1072px;display:flex;flex-direction:column;}
#topbar{
  height:48px;flex:0 0 48px;
  background:rgba(13,17,23,.92);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;
  padding:0 18px;
  position:sticky;top:0;z-index:40;
  backdrop-filter:blur(6px);
}
#views{flex:1;padding:14px 16px 28px;}
.view{display:none;}
.view.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

/* ---------- 侧栏 ---------- */
.logo{
  height:48px;display:flex;align-items:center;gap:9px;
  padding:0 14px;border-bottom:1px solid var(--border);
}
.logo .dot{
  width:10px;height:10px;border-radius:2px;background:var(--cyan);
  box-shadow:0 0 8px rgba(34,211,238,.8);
}
.logo b{font-size:13.5px;letter-spacing:.3px;color:#f3f4f6;}
.logo span{font-size:10px;color:var(--muted);font-family:var(--mono);}
#sidebar nav{flex:1;overflow-y:auto;padding:8px 0 12px;}
.nav-group{
  font-size:10px;letter-spacing:2px;color:var(--muted);
  padding:14px 14px 5px;text-transform:uppercase;
  font-family:var(--mono);
}
.nav-item{
  display:flex;align-items:center;gap:8px;
  padding:6.5px 14px 6.5px 12px;
  color:var(--text2);cursor:pointer;
  border-left:2px solid transparent;
  font-size:12.5px;user-select:none;
  transition:background .12s,color .12s;
}
.nav-item:hover{background:#151b26;color:var(--text);}
.nav-item.active{
  background:#111827;color:var(--cyan);
  border-left-color:var(--cyan);
}
.nav-item .ico{width:15px;text-align:center;font-size:12px;opacity:.85;}
.ver{
  border-top:1px solid var(--border);
  padding:10px 14px;font-family:var(--mono);
  font-size:10.5px;color:var(--muted);line-height:1.7;
}

/* ---------- 顶栏 ---------- */
#pageTitle{font-size:14px;font-weight:600;color:#f3f4f6;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:11.5px;color:var(--text2);}
.st{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 7px;}
.dot.green{background:var(--green);box-shadow:0 0 7px rgba(52,211,153,.9);}
.dot.cyan{background:var(--cyan);box-shadow:0 0 7px rgba(34,211,238,.9);}
.dot.amber{background:var(--amber);box-shadow:0 0 7px rgba(251,191,36,.9);}
.dot.red{background:var(--red);box-shadow:0 0 7px rgba(248,113,113,.9);}
.dot.gray{background:#4b5563;}

/* ---------- 面板通用 ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:12px 14px;
}
.panel h3{
  font-size:12px;font-weight:600;color:var(--text2);
  letter-spacing:.6px;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.panel h3 .tag{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400;}
.grid{display:grid;gap:12px;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}
.small{font-size:11px;}
.c-cyan{color:var(--cyan);}.c-green{color:var(--green);}.c-amber{color:var(--amber);}.c-red{color:var(--red);}.c-blue{color:var(--blue);}

/* ---------- KPI 卡片 ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.kpi{
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:10px 12px 8px;min-width:0;position:relative;overflow:hidden;
}
.kpi .k-label{font-size:10.5px;color:var(--muted);letter-spacing:.8px;display:flex;align-items:center;gap:6px;}
.kpi .k-val{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:24px;font-weight:600;color:#f3f4f6;margin-top:5px;line-height:1.15;
  white-space:nowrap;
}
.kpi .k-val .unit{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px;}
.kpi .k-sub{font-size:10.5px;color:var(--text2);margin-top:3px;font-family:var(--mono);white-space:nowrap;}
.kpi .k-spark{position:absolute;right:8px;bottom:6px;opacity:.9;}

/* ---------- 工具栏 ---------- */
.toolbar{
  background:var(--panel);border:1px solid var(--border);border-radius:6px;
  padding:8px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  margin-bottom:12px;
}
.tb-item{display:flex;align-items:center;gap:7px;}
.tb-item>label{font-size:11px;color:var(--muted);letter-spacing:.5px;white-space:nowrap;}
.seg{display:flex;border:1px solid var(--border2);border-radius:5px;overflow:hidden;}
.seg button{
  background:var(--panel3);border:none;color:var(--text2);
  font-size:11.5px;padding:4px 10px;cursor:pointer;font-family:var(--sans);
  border-right:1px solid var(--border2);white-space:nowrap;
}
.seg button:last-child{border-right:none;}
.seg button:hover{color:var(--text);}
.seg button.on{background:#164e63;color:var(--cyan);}
select,input[type=text],input[type=datetime-local]{
  background:var(--panel3);border:1px solid var(--border2);color:var(--text);
  border-radius:5px;padding:4px 8px;font-size:11.5px;outline:none;font-family:var(--sans);
}
input[type=datetime-local]{color-scheme:dark;}
select:focus,input[type=text]:focus,input[type=datetime-local]:focus{border-color:var(--cyan);}
.btn{
  background:var(--panel3);border:1px solid var(--border2);color:var(--text);
  border-radius:5px;padding:4.5px 12px;font-size:11.5px;cursor:pointer;white-space:nowrap;
}
.btn:hover{border-color:var(--cyan);color:var(--cyan);}
.btn.primary{background:#164e63;border-color:#155e75;color:var(--cyan);}
.btn.primary:hover{background:#155e75;}
.btn.danger:hover{border-color:var(--red);color:var(--red);}
.switch{position:relative;width:32px;height:17px;background:#1f2937;border-radius:9px;cursor:pointer;transition:background .15s;flex:0 0 32px;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#6b7280;transition:all .15s;}
.switch.on{background:#155e75;}
.switch.on::after{left:17px;background:var(--cyan);box-shadow:0 0 6px rgba(34,211,238,.8);}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;color:var(--text2);}

/* ---------- 表格 ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{
  text-align:left;padding:7px 10px;color:var(--muted);font-weight:500;
  font-size:10.5px;letter-spacing:.8px;border-bottom:1px solid var(--border2);
  white-space:nowrap;background:var(--panel3);
}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap;}
.tbl tr:hover td{background:#141b28;}
.tbl .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;}
.tbl th.num{text-align:right;}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-family:var(--mono);
  padding:1.5px 8px;border-radius:9px;border:1px solid;
}
.badge.green{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08);}
.badge.red{color:var(--red);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08);}
.badge.amber{color:var(--amber);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08);}
.badge.cyan{color:var(--cyan);border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.08);}
.badge.gray{color:var(--text2);border-color:var(--border2);background:var(--panel3);}
.link{color:var(--cyan);cursor:pointer;}
.link:hover{text-decoration:underline;}

/* ---------- 图表 ---------- */
.chart{width:100%;}
.h240{height:240px;}.h200{height:200px;}.h260{height:260px;}.h180{height:180px;}

/* ---------- 分页 ---------- */
.pager{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;}
.pager button{
  background:var(--panel3);border:1px solid var(--border2);color:var(--text2);
  min-width:26px;height:24px;border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:11px;padding:0 6px;
}
.pager button.on{background:#164e63;color:var(--cyan);border-color:#155e75;}
.pager button:disabled{opacity:.35;cursor:default;}

/* ---------- 错误展开行 ---------- */
.err-detail{
  background:#1a1113;border:1px solid rgba(248,113,113,.25);border-radius:5px;
  padding:9px 12px;margin:4px 0;font-size:11.5px;color:#fca5a5;
  font-family:var(--mono);line-height:1.7;white-space:pre-wrap;
}
tr.err-row td{background:#181215;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:22px;right:22px;z-index:99;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end;
}
.toast-item{
  background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--cyan);
  border-radius:6px;padding:9px 14px;font-size:12px;color:var(--text);
  box-shadow:0 6px 24px rgba(0,0,0,.5);animation:fadein .2s ease;max-width:360px;
}
.toast-item.warn{border-left-color:var(--amber);}
.toast-item.err{border-left-color:var(--red);}

/* ---------- 节点详情块 ---------- */
.node-block{margin-bottom:14px;}
.node-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.node-head .name{font-family:var(--mono);font-size:13.5px;font-weight:600;color:#f3f4f6;}
.metric-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:10px;}
.metric{
  background:var(--panel3);border:1px solid var(--border);border-radius:5px;padding:8px 10px;position:relative;
}
.metric .m-label{font-size:10px;color:var(--muted);letter-spacing:.6px;}
.metric .m-val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;color:#f3f4f6;margin-top:3px;}
.metric .m-val .unit{font-size:10px;color:var(--muted);font-weight:400;}
.metric .m-sub{font-size:10px;color:var(--text2);font-family:var(--mono);margin-top:2px;}

/* ---------- Tab ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border2);margin-bottom:12px;}
.tabs button{
  background:none;border:none;color:var(--text2);font-size:12px;
  padding:7px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button.on{color:var(--cyan);border-bottom-color:var(--cyan);}
.tabs button:hover{color:var(--text);}

/* ---------- 进度条 ---------- */
.bar{height:5px;background:#1f2937;border-radius:3px;overflow:hidden;margin-top:5px;}
.bar>i{display:block;height:100%;border-radius:3px;}

.section-gap{margin-bottom:12px;}
.two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.kv-row{display:flex;gap:8px;font-size:11.5px;padding:4px 0;border-bottom:1px dashed var(--border);}
.kv-row .k{color:var(--muted);width:96px;flex:0 0 96px;}
.kv-row .v{font-family:var(--mono);color:var(--text);}
.card-list{display:flex;flex-direction:column;gap:8px;}
.mini-card{background:var(--panel3);border:1px solid var(--border);border-radius:5px;padding:9px 11px;}
</style>
</head>
<body>
<div id="app">
  <!-- ============ 侧栏 ============ -->
  <aside id="sidebar">
    <div class="logo">
      <span class="dot"></span>
      <div><b>LLM-Portal</b><br><span>OBSERVABILITY</span></div>

<script>

  'qwen3-32b-instruct':1.0,'deepseek-v3.1':0.58,'qwen3-coder-30b':0.42,'glm-4.5-air':1.0

const ENDPOINTS = ['/v1/chat/completions','/v1/completions','/v1/embeddings'];
const FAIL_ERRORS = [
  {code:'context_length_exceeded', http:400, msg:'context length exceeded: prompt 131072 tokens > model context 131072 (slots exhausted)'},

/* ---------------- 工具函数 ---------------- */
function rnd(a,b){ return a + Math.random()*(b-a); }
function rndi(a,b){ return Math.floor(rnd(a, b+1)); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function walk(v,step,a,b){ return clamp(v + rnd(-step,step), a, b); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function fmtK(n){
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return ''+Math.round(n);
}
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function fmtHM(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dash(v){ return (v===null||v===undefined) ? '<span class="muted">—</span>' : v; }
function toast(msg, type){
  const box = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-item' + (type ? ' '+type : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 320); }, 2600);
}
/* SVG 迷你 sparkline（KPI 卡 / 表格行内） */
function spark(data, w, h, color, fill){
  w = w||110; h = h||26;
  if(!data || data.length < 2) return '';
  const min = Math.min.apply(null,data), max = Math.max.apply(null,data);
  const span = (max-min) || 1;
  const pts = data.map(function(v,i){
    return [ (i/(data.length-1))*w, h-2-((v-min)/span)*(h-4) ];
  });
  const line = pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
  let area = '';
  if(fill){
    area = '<polygon points="0,'+h+' '+line+' '+w+','+h+'" fill="'+color+'" opacity="0.10"/>';
  }
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+area+
    '<polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.4"/></svg>';

function tickNodes(){
  NODES.forEach(function(n){
    const s = n.state, b = n.base;
    s.out    = walk(s.out, b.out*0.06, b.out*0.55, b.out*1.5);
    s.pre    = walk(s.pre, b.pre*0.07, b.pre*0.5,  b.pre*1.6);
    s.active = clamp(Math.round(walk(s.active, 1.2, 0, n.cap)), 0, n.cap);
    s.queued = s.active >= n.cap ? rndi(0,3) : clamp(Math.round(walk(s.queued,0.8,0,2)),0,4);
    s.kv     = walk(s.kv, 2.2, 30, 92);
    if(s.kvHit !== null) s.kvHit = walk(s.kvHit, 0.02, 0.45, 0.85);
    if(s.mtp   !== null) s.mtp   = walk(s.mtp,   0.015, 0.52, 0.71);
    s.gpu    = walk(s.gpu, 3, 35, 98);
    s.mem    = walk(s.mem, 0.8, n.memTotal*0.45, n.memTotal*0.82);
    s.scrapeAgo = rndi(1, 9);
  });
}

/* ---------------- 总览筛选 / 自动刷新状态 ---------------- */
const WINDOWS = {'15m':{label:'15分钟',sec:900,pts:30},'1h':{label:'1小时',sec:3600,pts:60},
  '6h':{label:'6小时',sec:21600,pts:72},'24h':{label:'24小时',sec:86400,pts:96},'7d':{label:'7天',sec:604800,pts:84}};
const ov = {

};
function genLabels(winKey){
  const w = WINDOWS[winKey], now = Date.now();
  const step = w.sec*1000 / w.pts, arr = [];
  for(let i=w.pts-1;i>=0;i--){
    const d = new Date(now - i*step);
    arr.push(winKey==='7d' ? (pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+'时')
         : winKey==='24h'||winKey==='6h' ? fmtHM(d) : fmtTime(d).slice(0,5));
  }
  return arr;
}
function genNodeSeries(pts, base){
  const arr = []; let v = base;
  for(let i=0;i<pts;i++){ v = walk(v, base*0.09, base*0.5, base*1.6); arr.push(Math.round(v*10)/10); }
  return arr;
}
function rebuildOvSeries(){
  const pts = WINDOWS[ov.win].pts;
  ov.series = { labels: genLabels(ov.win), perNode:{}, cap:[] };
  NODES.forEach(function(n){ ov.series.perNode[n.id] = genNodeSeries(pts, n.base.out); });
  let c = 12;
  for(let i=0;i<pts;i++){ c = walk(c, 1.4, 5, 17); ov.series.cap.push(Math.round(c*10)/10); }
}
rebuildOvSeries();
function slideOvSeries(){
  const s = ov.series; if(!s) return;
  s.labels.push(fmtTime(new Date()).slice(0,5)); s.labels.shift();
  NODES.forEach(function(n){
    s.perNode[n.id].push(Math.round(n.state.out*10)/10); s.perNode[n.id].shift();
  });
  const tot = NODES.reduce(function(a,n){return a+n.state.active+n.state.queued;},0);
  s.cap.push(Math.round(tot*10)/10); s.cap.shift();
}
/* 筛选缩放因子：选中单模型/单 Key 时按比例缩放（mock 一致性） */
function ovScale(){
  let f = 1;
  if(ov.model !== 'all') f *= MODEL_SHARE[ov.model] * (ov.node==='all' ? 1 : 1);
  if(ov.key !== 'all') f *= KEY_SHARE[ov.key] * 2.2; // 单 Key 约占总量比例放大到可视范围
  return f;
}
function ovActiveNodes(){
  if(ov.node !== 'all') return NODES.filter(function(n){return n.id===ov.node;});
  if(ov.model !== 'all') return NODES.filter(function(n){return n.id===MODEL_NODE[ov.model];});

}

/* KPI 定义：值函数 + 格式化 */
function ovKpiData(){
  const nodes = ovActiveNodes();
  const f = ovScale();
  const agg = function(fn){ return nodes.reduce(function(a,n){return a+fn(n);},0) * f; };
  const out = agg(function(n){return n.state.out;});
  const act = agg(function(n){return n.state.active;});
  const que = agg(function(n){return n.state.queued;});
  const scopeF = (ov.node==='all' && ov.model==='all' && ov.key==='all') ? 1 :
    (ov.key!=='all' ? KEY_SHARE[ov.key] : (ov.model!=='all' ? MODEL_SHARE[ov.model]*0.42 : 0.4));
  const sparkData = ov.series.perNode[nodes[0].id].map(function(v,i){
    return nodes.reduce(function(a,n){return a+ov.series.perNode[n.id][i];},0) * f;
  });
  const succ = TODAY.requests - TODAY.fail;
  return [
    {label:'综合输出速度', val:out.toFixed(1), unit:'tok/s', sub:'跨节点聚合 · 实时', spark:sparkData, color:'#22d3ee'},
    {label:'活动请求', val:fmt(Math.round(act)), unit:'', sub:'排队 '+fmt(Math.round(que))+' · 容量 '+nodes.reduce(function(a,n){return a+n.cap;},0), color:'#34d399'},
    {label:'今日请求', val:fmt(Math.round(TODAY.requests*scopeF)), unit:'', sub:'较昨日 +6.2%', color:'#60a5fa'},
    {label:'成功率', val:(succ/TODAY.requests*100).toFixed(1), unit:'%', sub:'失败 '+fmt(Math.round(TODAY.fail*scopeF))+' 次', color:'#34d399'},
    {label:'输入 Token（今日）', val:fmtK(TODAY.inTok*scopeF), unit:'tok', sub:'含预填充 Prompt', color:'#a78bfa'},
    {label:'输出 Token（今日）', val:fmtK(TODAY.outTok*scopeF), unit:'tok', sub:'解码生成', color:'#22d3ee'},
    {label:'缓存读取 Token', val:fmtK(TODAY.cacheTok*scopeF), unit:'tok', sub:'KV Cache 命中复用', color:'#fbbf24'}
  ];
}

function genNdSeries(n){
  const pts = 60, b = n.base;
  const mk = function(base, lo, hi, step){
    const a=[]; let v=base;
    for(let i=0;i<pts;i++){ v=walk(v,step,lo,hi); a.push(Math.round(v*10)/10); }
    return a;
  };
  const labels=[]; const now=Date.now(); const stepMs = ({'1h':60000,'6h':360000,'24h':1440000})[nd.win];
  for(let i=pts-1;i>=0;i--){ labels.push(fmtHM(new Date(now-i*stepMs))); }
  return {
    labels:labels,
    out: mk(b.out, b.out*0.5, b.out*1.6, b.out*0.08),
    pre: mk(b.pre, b.pre*0.5, b.pre*1.6, b.pre*0.08),
    kv:  mk(b.kv, 30, 92, 2.4),
    gpu: mk(b.gpu, 35, 98, 3),
    mem: mk(b.mem/n.memTotal*100, 40, 85, 1)
  };
}

const RECS = [];
function genRecords(){
  RECS.length = 0;
  const now = Date.now();
  for(let i=0;i<360;i++){
    const model = pick(MODELS);
    const nodeId = MODEL_NODE[model];
    const node = NODES.find(function(n){return n.id===nodeId;});
    const key = pick(KEYS);
    const ep = pick(ENDPOINTS);
    const fail = Math.random() < 0.04;
    const err = fail ? pick(FAIL_ERRORS) : null;
    const isEmb = ep === '/v1/embeddings';
    const inTok = isEmb ? rndi(40,900) : rndi(120,9000);
    const outTok = fail ? rndi(0,40) : (isEmb ? 0 : rndi(30,2200));
    const cacheTok = fail ? 0 : Math.round(inTok * (nodeId==='m2s2' ? rnd(0.05,0.2) : rnd(0.3,0.75)));
    const ttft = fail ? null : (isEmb ? rndi(20,120) : rndi(90,2400));
    const lat = fail ? rndi(2000,120000) : (ttft + (isEmb ? rndi(5,60) : Math.round(outTok*rnd(8,40))));
    /* 时间分布偏向近期、覆盖近 7 天（供明细时间过滤器使用） */
    const t = new Date(now - Math.pow(Math.random(), 1.8) * 7 * 86400000 - rndi(0,999));
    RECS.push({id:200000+i, t:t, key:key, model:model, node:node, ep:ep,
      inTok:inTok, outTok:outTok, cacheTok:cacheTok, ttft:ttft, lat:lat, fail:fail, err:err});
  }
  RECS.sort(function(a,b){ return b.t - a.t; });
}

  model:{'qwen3-32b-instruct':'#22d3ee','deepseek-v3.1':'#34d399','qwen3-coder-30b':'#a78bfa','glm-4.5-air':'#fbbf24'},
  group:{'研发':'#22d3ee','数据分析':'#fbbf24','default':'#6b7280'},
  key:{'3f2a':'#22d3ee','9c1b':'#34d399','77e0':'#fbbf24','key':'#a78bfa'},
  ep:{'/v1/chat/completions':'#22d3ee','/v1/completions':'#34d399','/v1/embeddings':'#a78bfa'}
};
const RANGE_LABEL = {'1h':'近1小时','today':'今天','24h':'近24小时','7d':'近7天'};
function ugRangeFrom(){
  const now = new Date();
  if(ug.range==='1h') return new Date(now.getTime()-3600000);
  if(ug.range==='today'){ const d=new Date(now); d.setHours(0,0,0,0); return d; }
  if(ug.range==='24h') return new Date(now.getTime()-86400000);
  return new Date(now.getTime()-7*86400000);
}
function ugScopedRecs(){
  const from = ugRangeFrom();
  return RECS.filter(function(r){ return r.t>=from; });
}
function aggBy(recs, keyFn){
  const m = {};
  recs.forEach(function(r){
    const k = keyFn(r);
    if(!m[k]) m[k] = {req:0, inTok:0, outTok:0, cacheTok:0};
    const o = m[k]; o.req++; o.inTok+=r.inTok; o.outTok+=r.outTok; o.cacheTok+=r.cacheTok;
  });
  return m;
}
function donutOption(items, centerLabel){
  const total = items.reduce(function(a,x){return a+x.value;},0);
  return {
    backgroundColor:'transparent',
    tooltip:{trigger:'item', backgroundColor:'#151b26', borderColor:'#263142',
      textStyle:{color:'#d1d5db',fontSize:11,fontFamily:'ui-monospace,Menlo,monospace'},
      formatter:function(p){ return esc(p.name)+'<br/>'+fmt(p.value)+'（'+p.percent+'%）'; }},
    title:{text: total ? fmtK(total) : '0', subtext:centerLabel, left:'center', top:'38%',
      textStyle:{color:'#f3f4f6',fontSize:16,fontFamily:'ui-monospace,Menlo,monospace'},
      subtextStyle:{color:'#6b7280',fontSize:9}},
    series:[{type:'pie', radius:['56%','80%'], center:['50%','50%'],
      label:{show:false}, labelLine:{show:false},
      itemStyle:{borderColor:'#111827', borderWidth:2},
      emphasis:{scale:true, scaleSize:4},
      data:items}]
  };
}
function updateUsageSummary(){
  const recs = ugScopedRecs();
  const ok = recs.filter(function(r){return !r.fail;});
  const inT = recs.reduce(function(a,r){return a+r.inTok;},0);
  const outT = recs.reduce(function(a,r){return a+r.outTok;},0);
  const cacheT = recs.reduce(function(a,r){return a+r.cacheTok;},0);
  const avgTtft = ok.length ? Math.round(ok.reduce(function(a,r){return a+(r.ttft||0);},0)/ok.length) : null;
  const sr = recs.length ? ok.length/recs.length*100 : null;
  const kpis = [
    {label:'总请求', val:fmt(recs.length), unit:'次', sub:'范围 · '+RANGE_LABEL[ug.range], color:'#60a5fa'},
    {label:'总 Token', val:fmtK(inT+outT), unit:'tok', sub:'读 '+fmtK(inT)+' / 写 '+fmtK(outT), color:'#22d3ee'},
    {label:'成功率', val: sr===null?'—':sr.toFixed(1), unit: sr===null?'':'%',
     sub:'失败 '+fmt(recs.length-ok.length)+' 次', color:'#34d399'},
    {label:'平均首字延迟', val: avgTtft===null?'—':fmt(avgTtft), unit: avgTtft===null?'':'ms',
     sub:'成功请求 TTFT', color:'#fbbf24'},
    {label:'缓存读取 Token', val:fmtK(cacheT), unit:'tok',
     sub:'命中率 '+(inT? (cacheT/inT*100).toFixed(0) : '0')+'%（占输入）', color:'#a78bfa'}
  ];
  document.getElementById('ugKpis').innerHTML = kpis.map(function(k){
    return '<div class="kpi"><div class="k-label"><i class="dot" style="background:'+k.color+';box-shadow:0 0 6px '+k.color+'"></i>'+k.label+'</div>'+
      '<div class="k-val">'+k.val+'<span class="unit">'+k.unit+'</span></div><div class="k-sub">'+k.sub+'</div></div>';
  }).join('');
  renderDistModel();
  renderDistKey();
  renderDistEp();
  updateUgTrend();
}
/* 1 · 模型分布（行可展开按节点拆分） */
function renderDistModel(){
  const recs = ugScopedRecs();
  const m = aggBy(recs, function(r){return r.model;});
  const byTok = ug.distModelTab==='tok';
  const val = function(k){ return byTok ? m[k].inTok+m[k].outTok : m[k].req; };
  const keys = Object.keys(m).sort(function(a,b){return val(b)-val(a);});
  const ch = getChart('chDistModel');
  if(ch) ch.setOption(donutOption(keys.map(function(k){
    return {name:k, value:val(k), itemStyle:{color:DIST_COLORS.model[k]}};
  }), byTok?'Tokens':'请求'), {notMerge:true});
  const body = document.getElementById('ugDistModelBody');
  body.innerHTML = keys.map(function(k){
    const o = m[k], exp = ug.distExpand['m:'+k];
    let html = '<tr data-dx="m:'+k+'" style="cursor:pointer">'+
      '<td class="muted small">'+(exp?'▾':'▸')+'</td>'+
      '<td class="mono small"><i class="dot" style="background:'+DIST_COLORS.model[k]+';box-shadow:0 0 5px '+DIST_COLORS.model[k]+'"></i> '+k+'</td>'+
      '<td class="num">'+fmt(o.req)+'</td>'+
      '<td class="num c-cyan">'+fmtK(o.inTok+o.outTok)+'</td>'+
      '<td class="num">'+fmtK(o.inTok)+'</td>'+
      '<td class="num">'+fmtK(o.outTok)+'</td>'+
      '<td class="num">'+(o.cacheTok?fmtK(o.cacheTok):'<span class="muted">—</span>')+'</td></tr>';
    if(exp){
      const byNode = aggBy(recs.filter(function(r){return r.model===k;}), function(r){return r.node.id;});
      html += Object.keys(byNode).map(function(nid){
        const n = NODES.find(function(x){return x.id===nid;});
        const no = byNode[nid];
        return '<tr style="background:#0f1520;">'+
          '<td></td><td class="mono small" style="color:'+n.color+';padding-left:22px;">└ '+n.name+'</td>'+
          '<td class="num muted">'+fmt(no.req)+'</td>'+
          '<td class="num muted">'+fmtK(no.inTok+no.outTok)+'</td>'+
          '<td class="num muted">'+fmtK(no.inTok)+'</td>'+
          '<td class="num muted">'+fmtK(no.outTok)+'</td>'+
          '<td class="num muted">'+(no.cacheTok?fmtK(no.cacheTok):'—')+'</td></tr>';
      }).join('');
    }
    return html;
  }).join('');
}

      '<td class="num">'+(o.cacheTok?fmtK(o.cacheTok):'<span class="muted">—</span>')+'</td></tr>';

/* 4 · Token 用量趋势：输入/输出/缓存读取（左轴）+ 缓存命中率虚线（右轴 %） */
function updateUgTrend(){
  const ch = getChart('chUgTrend'); if(!ch) return;
  const recs = ugScopedRecs();
  const from = ugRangeFrom(), now = new Date();
  const byHour = ug.gran==='hour';
  let step = byHour ? 3600000 : 86400000;
  if(ug.range==='1h' && byHour) step = 300000; /* 近1小时 → 5min×12 */
  const t0 = Math.floor(from.getTime()/step)*step;
  const n = Math.max(1, Math.ceil((now.getTime()-t0)/step));
  const labels=[], inD=[], outD=[], cacheD=[], hitD=[];
  for(let i=0;i<n;i++){
    const b0 = new Date(t0+i*step), b1 = new Date(t0+(i+1)*step);
    labels.push(byHour ? fmtHM(b0) : pad(b0.getMonth()+1)+'-'+pad(b0.getDate()));
    let a=0,b=0,c=0;
    recs.forEach(function(r){ if(r.t>=b0 && r.t<b1){ a+=r.inTok; b+=r.outTok; c+=r.cacheTok; } });
    inD.push(a); outD.push(b); cacheD.push(c);
    hitD.push(a ? Math.round(c/a*1000)/10 : 0);
  }
  document.getElementById('ugTrendTag').textContent = '粒度 · '+(byHour?'小时':'天')+' · '+RANGE_LABEL[ug.range];
  ch.setOption({
    backgroundColor:'transparent', tooltip:baseTooltip(),
    legend:{textStyle:{color:'#9ca3af',fontSize:10}, top:0, icon:'roundRect', itemWidth:10, itemHeight:3},
    grid:{left:46,right:46,top:28,bottom:24},
    xAxis:Object.assign({type:'category',boundaryGap:false,data:labels},AXIS_STYLE),
    yAxis:[
      Object.assign({type:'value',name:'Token',nameTextStyle:{color:'#6b7280',fontSize:10},
        axisLabel:{color:'#6b7280',fontSize:10,fontFamily:'ui-monospace,Menlo,monospace',
          formatter:function(v){return fmtK(v);}},
        splitLine:{lineStyle:{color:'#151b26'}}},{axisLine:{lineStyle:{color:'#1f2937'}}}),
      Object.assign({type:'value',name:'命中率 %',max:100,nameTextStyle:{color:'#6b7280',fontSize:10},
        splitLine:{show:false}},AXIS_STYLE)
    ],
    series:[
      {name:'输入 Token',type:'line',stack:'tk',smooth:true,symbol:'none',data:inD,
       lineStyle:{width:1.3,color:'#a78bfa'},itemStyle:{color:'#a78bfa'},areaStyle:{color:'#a78bfa',opacity:0.14}},
      {name:'输出 Token',type:'line',stack:'tk',smooth:true,symbol:'none',data:outD,
       lineStyle:{width:1.3,color:'#22d3ee'},itemStyle:{color:'#22d3ee'},areaStyle:{color:'#22d3ee',opacity:0.14}},
      {name:'缓存读取',type:'line',stack:'tk',smooth:true,symbol:'none',data:cacheD,
       lineStyle:{width:1.3,color:'#fbbf24'},itemStyle:{color:'#fbbf24'},areaStyle:{color:'#fbbf24',opacity:0.12}},
      {name:'缓存命中率',type:'line',yAxisIndex:1,smooth:true,symbol:'none',data:hitD,
       lineStyle:{width:1.4,color:'#34d399',type:'dashed'},itemStyle:{color:'#34d399'}}
    ]
  },{notMerge:true});
}
/* ---- 明细表 ---- */
function filteredRecs(){
  return RECS.filter(function(r){
    if(ug.tFrom && r.t < ug.tFrom) return false;
    if(ug.tTo && r.t > ug.tTo) return false;
    if(ug.key!=='all' && r.key.last4!==ug.key) return false;
    if(ug.node!=='all' && r.node.id!==ug.node) return false;
    if(ug.status==='ok' && r.fail) return false;
    if(ug.status==='fail' && !r.fail) return false;
    if(ug.model!=='all' && r.model!==ug.model) return false;
    if(ug.ep!=='all' && r.ep!==ug.ep) return false;
    if(ug.search){
      const hay = (r.key.mask+' '+r.key.owner+' '+r.model+' '+r.node.name+' '+r.ep+' '+r.id).toLowerCase();
      if(hay.indexOf(ug.search)<0) return false;
    }
    return true;
  });
}
/* 统计仪表盘条：随筛选/搜索实时联动 */
function renderRecStats(){
  const bar = document.getElementById('ugStatBar'); if(!bar) return;
  const rows = filteredRecs();
  const ok = rows.filter(function(r){return !r.fail;});
  const inT = rows.reduce(function(a,r){return a+r.inTok;},0);
  const outT = rows.reduce(function(a,r){return a+r.outTok;},0);
  const cacheT = rows.reduce(function(a,r){return a+r.cacheTok;},0);
  const avgTtft = ok.length ? Math.round(ok.reduce(function(a,r){return a+(r.ttft||0);},0)/ok.length) : null;
  const avgLat = ok.length ? Math.round(ok.reduce(function(a,r){return a+r.lat;},0)/ok.length) : null;
  const sr = rows.length ? ok.length/rows.length*100 : null;
  const cards = [
    {label:'筛选结果请求数', val:fmt(rows.length), unit:'次', sub:'当前过滤条件命中', color:'#60a5fa'},
    {label:'成功率', val: sr===null?'—':sr.toFixed(1), unit: sr===null?'':'%',
     sub:'失败 '+fmt(rows.length-ok.length)+' 次', color: (sr!==null && sr<95) ? '#f87171' : '#34d399'},
    {label:'读 TOKEN 合计', val:fmtK(inT), unit:'tok', sub:'输入 / Prompt', color:'#22d3ee'},
    {label:'写 TOKEN 合计', val:fmtK(outT), unit:'tok', sub:'输出 / 解码生成', color:'#34d399'},
    {label:'缓存 TOKEN 合计', val:fmtK(cacheT), unit:'tok', sub:'KV Cache 命中复用', color:'#fbbf24'},
    {label:'平均延迟', val: avgTtft===null?'—':fmt(avgTtft), unit: avgTtft===null?'':'ms',
     sub:'首字 TTFT · 总时延 '+(avgLat===null?'—':fmt(avgLat)+' ms'), color:'#a78bfa'}
  ];
  bar.innerHTML = cards.map(function(k){
    return '<div class="kpi"><div class="k-label"><i class="dot" style="background:'+k.color+';box-shadow:0 0 6px '+k.color+'"></i>'+k.label+'</div>'+
      '<div class="k-val" style="font-size:20px;">'+k.val+'<span class="unit">'+k.unit+'</span></div>'+
      '<div class="k-sub">'+k.sub+'</div></div>';
  }).join('');
}
function renderRecTable(){
  renderRecStats();
  const rows = filteredRecs();
  const pages = Math.max(1, Math.ceil(rows.length/ug.per));
  if(ug.page>pages) ug.page=pages;
  const start = (ug.page-1)*ug.per;
  const slice = rows.slice(start, start+ug.per);
  const tbody = document.getElementById('ugTbody');
  tbody.innerHTML = slice.map(function(r){
    const exp = ug.expanded[''+r.id];
    let tr = '<tr data-rid="'+r.id+'" class="'+(r.fail?'err-row':'')+'" style="cursor:'+(r.fail?'pointer':'default')+'">'+
      '<td class="mono small">'+fmtDate(r.t)+' '+fmtTime(r.t)+'</td>'+
      '<td><span class="mono small">'+r.key.mask+'</span><div class="small muted">'+r.key.owner+' · '+r.key.group+'</div></td>'+
      '<td class="mono small">'+r.model+'</td>'+
      '<td class="mono small" style="color:'+r.node.color+'">'+r.node.name+'</td>'+
      '<td class="mono small muted">'+r.ep+'</td>'+
      '<td class="num">'+fmt(r.inTok)+'</td>'+
      '<td class="num">'+fmt(r.outTok)+'</td>'+
      '<td class="num">'+(r.cacheTok? fmt(r.cacheTok) : '<span class="muted">—</span>')+'</td>'+
      '<td class="num">'+(r.ttft===null?'<span class="muted">—</span>':fmt(r.ttft)+' ms')+'</td>'+
      '<td class="num">'+fmt(r.lat)+' ms</td>'+
      '<td>'+(r.fail
        ? '<span class="badge red"><i class="dot red"></i>失败 · '+r.err.code+'</span> <span class="small muted">'+(exp?'▾':'▸')+'</span>'
        : '<span class="badge green"><i class="dot green"></i>成功</span>')+'</td>'+
    '</tr>';
    if(r.fail && exp){
      tr += '<tr class="err-row"><td colspan="11"><div class="err-detail">'+
        'request_id: req_'+r.id+'\nHTTP '+r.err.http+' · '+r.err.code+'\n'+r.err.msg+'\n'+
        'node: '+r.node.name+' ('+r.node.addr+') · model: '+r.model+' · retryable: true\n'+
        'trace: gateway → wireguard('+r.node.wgIp+') → llama.cpp '+r.node.runtime+' · 已记录至审计日志'+
        '</div></td></tr>';
    }
    return tr;
  }).join('');
  document.getElementById('ugCount').textContent = '共 '+rows.length+' 条 · 第 '+ug.page+'/'+pages+' 页';
  /* 分页 */
  const pager = document.getElementById('ugPager');
  let btns = '<button data-pg="prev"'+(ug.page<=1?' disabled':'')+'>‹</button>';
  const win = [];
  for(let p=1;p<=pages;p++){
    if(p===1||p===pages||Math.abs(p-ug.page)<=2) win.push(p);
  }
  let last=0;
  win.forEach(function(p){
    if(p-last>1) btns += '<button disabled>…</button>';
    btns += '<button data-pg="'+p+'" class="'+(p===ug.page?'on':'')+'">'+p+'</button>';
    last=p;
  });
  btns += '<button data-pg="next"'+(ug.page>=pages?' disabled':'')+'>›</button>';
  pager.innerHTML = btns;
  pager.querySelectorAll('button[data-pg]').forEach(function(b){
    b.addEventListener('click', function(){
      const g = b.dataset.pg;
      if(g==='prev') ug.page = Math.max(1, ug.page-1);
      else if(g==='next') ug.page = Math.min(pages, ug.page+1);
      else ug.page = parseInt(g,10);
      renderRecTable();
    });
  });
}
function csvCell(s){
  s = String(s);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportCsv(){
  const rows = filteredRecs();
  const head = ['时间','请求ID','Key','用户','分组','模型','节点','节点地址','端点','读Token','写Token','缓存Token','首字延迟ms','总时延ms','状态','错误码','错误详情'];
  const lines = [head.join(',')];
  rows.forEach(function(r){
    lines.push([
      fmtDate(r.t)+' '+fmtTime(r.t), 'req_'+r.id, r.key.mask, r.key.owner, r.key.group,
      r.model, r.node.name, r.node.addr, r.ep,
      r.inTok, r.outTok, r.cacheTok,
      r.ttft===null?'':r.ttft, r.lat,
      r.fail?'失败':'成功', r.fail?r.err.code:'', r.fail?r.err.msg:''
    ].map(csvCell).join(','));
  });
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'llm-portal-requests-'+fmtDate(new Date())+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 100);
  toast('已导出当前筛选结果集 '+rows.length+' 条 CSV');
}

function buildMyUsage(){
  const v = document.getElementById('view-myusage');

  const myRecs = RECS.filter(function(r){ return r.key.last4==='3f2a'; });
  const inT = myRecs.reduce(function(a,r){return a+r.inTok;},0);
  const outT = myRecs.reduce(function(a,r){return a+r.outTok;},0);
  v.innerHTML =
  '<div class="kpi-row section-gap" style="grid-template-columns:repeat(4,1fr);">'+
    '<div class="kpi"><div class="k-label"><i class="dot cyan"></i>我的 KEY</div>'+
      '<div class="k-val" style="font-size:17px;">'+me.mask+'</div>'+
      '<div class="k-sub">'+me.owner+' · '+me.group+' · '+me.created+' 创建</div></div>'+
    '<div class="kpi"><div class="k-label"><i class="dot green"></i>今日 TOKEN</div>'+
      '<div class="k-val">'+fmtK(inT+outT)+'<span class="unit">tok</span></div>'+
      '<div class="k-sub">入 '+fmtK(inT)+' / 出 '+fmtK(outT)+'</div></div>'+
    '<div class="kpi"><div class="k-label"><i class="dot green"></i>本月 TOKEN</div>'+
      '<div class="k-val">41.6M<span class="unit">tok</span></div>'+
      '<div class="k-sub">限额 120M · 已用 35%</div>'+pctBar(35,'var(--cyan)')+'</div>'+
    '<div class="kpi"><div class="k-label"><i class="dot cyan"></i>今日请求</div>'+
      '<div class="k-val">'+fmt(myRecs.length*14)+'<span class="unit">次</span></div>'+
      '<div class="k-sub">成功率 98.6% · 限额 RPM 240</div></div>'+
  '</div>'+
  '<div class="grid" style="grid-template-columns:1.6fr 1fr;">'+
    '<div class="panel"><h3>逐日 Token 趋势 · 近 30 天</h3><div id="chMy" class="chart h240"></div></div>'+
    '<div class="panel"><h3>模型使用分布</h3><table class="tbl"><thead><tr><th>模型</th><th class="num">请求</th><th class="num">Token</th></tr></thead><tbody>'+
      MODELS.map(function(m){
        const rs = myRecs.filter(function(r){return r.model===m;});
        if(!rs.length) return '';
        return '<tr><td class="mono small">'+m+'</td><td class="num">'+rs.length+'</td>'+
          '<td class="num">'+fmtK(rs.reduce(function(a,r){return a+r.inTok+r.outTok;},0))+'</td></tr>';
      }).join('')+'</tbody></table>'+
      '<p class="small muted" style="margin-top:10px;line-height:1.8;">近 7 天明细可在「请求与用量 → 请求明细」中按 Key <span class="mono">sk-…3f2a</span> 搜索。配额问题请联系管理员（企业微信 · 运维群）。</p></div>'+
  '</div>';
  const ch = getChart('chMy');
  const labels=[], inD=[], outD=[];
  for(let i=29;i>=0;i--){
    const d=new Date(Date.now()-i*86400000);
    labels.push(pad(d.getMonth()+1)+'-'+pad(d.getDate()));
    inD.push(i===0?Math.round(inT/100):rndi(80,220));
    outD.push(i===0?Math.round(outT/100):rndi(20,70));
  }
  ch.setOption({
    backgroundColor:'transparent', tooltip:baseTooltip(),
    legend:{textStyle:{color:'#9ca3af',fontSize:10.5},top:0},
    grid:baseGrid(),
    xAxis:Object.assign({type:'category',data:labels},AXIS_STYLE),
    yAxis:Object.assign({type:'value',name:'×100 tok',nameTextStyle:{color:'#6b7280',fontSize:10},
      splitLine:{lineStyle:{color:'#151b26'}}},AXIS_STYLE),
    series:[
      {name:'输入',type:'bar',stack:'t',barWidth:'60%',itemStyle:{color:'#164e63'},data:inD},
      {name:'输出',type:'bar',stack:'t',itemStyle:{color:'#22d3ee',borderRadius:[2,2,0,0]},data:outD}
    ]
  },{notMerge:true});
}

  nodes:       {title:'节点性能',   group:'监控', icon:'◉', build:buildNodes,       update:updateNodesView},

  groups:      {title:'分组',       group:'资源', icon:'▥', build:buildGroups,      update:null},
  aliases:     {title:'模型与别名', group:'资源', icon:'⇄', build:buildAliases,     update:null},
  keys:        {title:'用户 Key',   group:'资源', icon:'⚿', build:buildKeys,        update:null},
  mcp:         {title:'MCP 管理',   group:'资源', icon:'⧉', build:buildMcp,         update:null},
  alerts:      {title:'告警与设置', group:'系统', icon:'⚠', build:buildAlerts,      update:null},
  security:    {title:'安全设置',   group:'系统', icon:'🛡', build:buildSecurity,    update:null},
  myusage:     {title:'我的用量',   group:'个人', icon:'◔', build:buildMyUsage,     update:null}
};
let currentRoute = 'overview';
function buildNav(){
  const nav = document.getElementById('nav');
  const groups = ['监控','资源','系统','个人'];
  nav.innerHTML = groups.map(function(g){
    const items = Object.keys(ROUTES).filter(function(k){return ROUTES[k].group===g;});
    return '<div class="nav-group">'+g+'</div>'+items.map(function(k){
      return '<div class="nav-item" data-route="'+k+'"><span class="ico">'+ROUTES[k].icon+'</span>'+ROUTES[k].title+'</div>';
    }).join('');
  }).join('');
  nav.addEventListener('click', function(e){
    const it = e.target.closest('.nav-item'); if(!it) return;
    location.hash = '#/'+it.dataset.route;
  });
}
function showRoute(name){
  if(!ROUTES[name]) name = 'overview';
  currentRoute = name;
  document.querySelectorAll('.view').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.classList.toggle('active', el.dataset.route===name);
  });
  document.getElementById('pageTitle').textContent = ROUTES[name].title;
  ROUTES[name].build();
  if(ROUTES[name].update) ROUTES[name].update(true);
  requestAnimationFrame(resizeVisibleCharts);
}
window.addEventListener('hashchange', function(){
  showRoute(location.hash.replace('#/','') || 'overview');
});

/* 全局刷新：推进 mock 数据 + 就地更新当前视图（setOption，不动 DOM） */
function doRefresh(manual){
  tickNodes();
  tickToday();
  slideOvSeries();
  ov.lastUpdate = new Date();
  const r = ROUTES[currentRoute];
  if(r && r.update) r.update(false);
  updateOvClock();
  if(manual) ov.left = ov.interval;
}
setInterval(function(){
  if(ov.auto){
    ov.left -= 1;
    if(ov.left <= 0){ doRefresh(false); ov.left = ov.interval; }
    else updateOvClock();
  } else {
    updateOvClock();
  }
}, 1000);

/* ---------------- 启动 ---------------- */
buildNav();
showRoute(location.hash.replace('#/','') || 'overview');
updateOvClock();
</script>
