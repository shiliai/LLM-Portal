<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM-Portal · 远程模型网关控制台</title>
<script src="vendor/echarts.min.js"></script>
<style>
:root{
  --sidebar:#0f172a; --sidebar-hover:#1e293b; --sidebar-active:#4f46e5;
  --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0;
  --text:#0f172a; --text2:#475569; --text3:#94a3b8;
  --accent:#4f46e5; --accent-light:#eef2ff;
  --ok:#16a34a; --ok-bg:#f0fdf4; --warn:#d97706; --warn-bg:#fffbeb; --danger:#dc2626; --danger-bg:#fef2f2;
  --info:#0284c7; --info-bg:#f0f9ff;
  --radius:10px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"PingFang SC","Helvetica Neue",-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}::-webkit-scrollbar-track{background:transparent}

/* ---- Layout ---- */
.app{display:flex;min-height:100vh}
.sidebar{width:232px;background:var(--sidebar);color:#cbd5e1;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50}
.main{flex:1;margin-left:232px;min-width:0;padding:18px 24px 40px}

/* ---- Sidebar ---- */
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand-logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#4f46e5,#818cf8);display:flex;align-items:center;justify-content:center;flex:none}
.brand-logo svg{width:18px;height:18px;stroke:#fff}
.brand-name{font-size:14px;font-weight:600;color:#f1f5f9;letter-spacing:.2px}
.brand-sub{font-size:11px;color:#64748b;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:10px 10px 12px}
.nav-group{margin-top:14px}
.nav-group:first-child{margin-top:4px}
.nav-title{font-size:11px;color:#64748b;letter-spacing:1.5px;padding:0 10px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#cbd5e1;font-size:13px;transition:background .12s,color .12s;position:relative}
.nav-item svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:var(--sidebar-hover);color:#f1f5f9}
.nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:500}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:#a5b4fc}
.sidebar-foot{border-top:1px solid rgba(255,255,255,.07);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.ver-badge{font-size:11px;color:#64748b}
.ver-badge b{color:#94a3b8;font-weight:600}
.status-dot-inline{width:7px;height:7px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:5px;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.sidebar-foot .sys{font-size:11px;color:#64748b}

/* ---- Page chrome ---- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;gap:16px;flex-wrap:wrap}
.page-title{font-size:19px;font-weight:700;letter-spacing:.2px}
.page-desc{font-size:12px;color:var(--text3);margin-top:3px}
.page-head .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---- Cards ---- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:14px 16px}
.card-title{font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-title .sub{font-size:11px;color:var(--text3);font-weight:400}
.section{margin-bottom:16px}

/* ---- KPI cards ---- */
.kpi-row{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;min-width:0}
.kpi-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kpi-chip{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.kpi-chip svg{width:15px;height:15px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi-label{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-value{font-size:21px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
.kpi-value small{font-size:11px;font-weight:500;color:var(--text3);margin-left:3px}
.kpi-foot{font-size:11px;color:var(--text3);margin-top:5px;display:flex;align-items:center;gap:6px;min-height:16px}
.kpi-spark{width:100%;height:26px;margin-top:6px}
.delta-up{color:var(--ok)} .delta-down{color:var(--danger)}
.trend-tag{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.trend-tag.down{background:var(--danger-bg);color:var(--danger)}

/* ---- Toolbar ---- */
.toolbar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .group{display:flex;align-items:center;gap:7px}
.toolbar .glabel{font-size:12px;color:var(--text3);white-space:nowrap}
.toolbar .sep{width:1px;height:22px;background:var(--border)}
.seg{display:inline-flex;background:#f1f5f9;border:1px solid var(--border);border-radius:8px;padding:2px;gap:1px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:#fff;font-weight:500;box-shadow:0 1px 2px rgba(79,70,229,.3)}
select,.text-in{border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:12px;background:#fff;color:var(--text);font-family:inherit;outline:none}
select:focus,.text-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.text-in{width:180px}
.btn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all .12s}
.btn:hover{border-color:#cbd5e1;color:var(--text);background:#f8fafc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#4338ca;border-color:#4338ca}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.danger:hover{background:var(--danger-bg)}
.btn.sm{padding:3px 9px;font-size:11px}
.btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.switch{position:relative;width:34px;height:19px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:#cbd5e1;border-radius:20px;transition:.15s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(15px)}
.countdown{font-size:12px;color:var(--text3)}
.countdown b{color:var(--accent);font-weight:600}
.muted{color:var(--text3);font-size:12px}

/* ---- Charts ---- */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-21{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.chart{width:100%;height:260px}
.chart.tall{height:300px}
.chart.sm{height:210px}

/* ---- Tables ---- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f8fafc;color:var(--text2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:11.5px;letter-spacing:.2px}
td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:#f8fafc}
tr.row-fail{background:#fffbfb}
tr.row-fail:hover{background:#fef5f5}
tr.expand-row td{background:#f8fafc;padding:10px 14px}
.err-box{background:var(--danger-bg);border:1px solid #fecaca;border-radius:7px;padding:9px 12px;font-size:12px;color:#991b1b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.6;max-width:760px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}

/* ---- Pills & badges ---- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.gray{background:#f1f5f9;color:var(--text2)}
.pill.indigo{background:var(--accent-light);color:var(--accent)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;background:#f1f5f9;color:var(--text2);border:1px solid var(--border);margin:1px 2px 1px 0}

/* ---- Progress bars ---- */
.bar{height:6px;border-radius:3px;background:#f1f5f9;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.bar>i.ok{background:var(--ok)} .bar>i.warn{background:var(--warn)} .bar>i.danger{background:var(--danger)}
.bar-cell{display:flex;align-items:center;gap:8px}
.bar-cell .v{font-size:11.5px;min-width:38px;text-align:right}

/* ---- Node blocks ---- */
.node-block{margin-bottom:16px}
.node-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.node-head h3{font-size:14px;font-weight:700}
.node-head .meta{font-size:11.5px;color:var(--text3)}
.node-metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:0}
.metric-cell{padding:12px 14px;border-right:1px solid #f1f5f9;border-bottom:1px solid #f1f5f9}
.metric-cell .l{font-size:11.5px;color:var(--text3);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.metric-cell .v{font-size:17px;font-weight:700}
.metric-cell .v small{font-size:11px;color:var(--text3);font-weight:500}
.metric-cell .d{font-size:11px;color:var(--text3);margin-top:3px}
.dash{font-size:17px;color:#cbd5e1;font-weight:600}

/* ---- Tabs ---- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--text2);font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ---- Pagination ---- */
.pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:10px 12px;flex-wrap:wrap}
.pager button{border:1px solid var(--border);background:#fff;min-width:28px;height:26px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;padding:0 8px}
.pager button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .total{font-size:12px;color:var(--text3);margin-right:auto}

/* ---- Misc ---- */
.list-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid #f1f5f9}
.list-row:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:120px 1fr;row-gap:8px;column-gap:12px;font-size:12.5px;padding:14px 16px}
.kv dt{color:var(--text3)} .kv dd{color:var(--text)}
.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;box-shadow:0 6px 20px rgba(15,23,42,.3);z-index:999;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
@media (max-width:1100px){.kpi-row{grid-template-columns:repeat(4,1fr)}.grid-2,.grid-3,.grid-21{grid-template-columns:1fr}.node-metrics{grid-template-columns:repeat(3,1fr)}#reqStats{grid-template-columns:repeat(3,1fr)!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 22V12"/><path d="M3 7l9 5 9-5"/></svg></div>
      <div><div class="brand-name">LLM-Portal</div><div class="brand-sub">远程模型网关控制台</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span class="ver-badge"><b>v1.4.2</b> · build bb8a6e2</span>
      <span class="sys"><span class="status-dot-inline"></span>网关正常</span>
    </div>
  </aside>
  <main class="main"><div id="page"></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= Mock 数据层 ================= */
const ICON = (p)=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const ICONS = {
  overview: ICON('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
  nodes: ICON('<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="1.6"/><circle cx="14" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/>'),
  usage: ICON('<path d="M3 17l5-6 4 3 6-8 3 4"/><path d="M3 21h18"/>'),
  deploy: ICON('<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>'),
  site: ICON('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/>'),
  group: ICON('<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.2.3 3.6 1.8 4 4.3"/>'),
  alias: ICON('<path d="M9 12h6M12 9v6"/><rect x="3" y="5" width="18" height="14" rx="2"/>'),
  key: ICON('<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M15 5l2.5 2.5M12.5 7.5L15 10"/>'),
  mcp: ICON('<path d="M14 5l-8 8a3.5 3.5 0 105 5l8-8"/><path d="M13 4l7 7M10 7l7 7"/>'),
  alert: ICON('<path d="M12 4a6 6 0 016 6c0 3 1 4.5 2 5.5H4c1-1 2-2.5 2-5.5a6 6 0 016-6z"/><path d="M10 19a2 2 0 004 0"/>'),
  shield: ICON('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>'),
  me: ICON('<circle cx="12" cy="8" r="4"/><path d="M5 20c.8-3.5 3.5-5.5 7-5.5s6.2 2 7 5.5"/>')
};
const NAV = [
  {group:'监控', items:[['overview','总览'],['nodes','节点性能'],['usage','请求与用量']]},
  {group:'资源', items:[['deploy','模型部署'],['sites','站点与公钥'],['groups','分组'],['models','模型与别名'],['keys','用户 Key'],['mcp','MCP 管理']]},
  {group:'系统', items:[['alerts','告警与设置'],['security','安全设置']]},
  {group:'个人', items:[['me','我的用量']]}
];

const NODES = [
  {id:'gb10', name:'gb10-llm', runtime:'llama.cpp b6345', addr:'http://10.77.0.11:8080', ip:'10.77.0.11',
   hw:'NVIDIA GB10 (Grace Blackwell, 128GB 统一内存)', unified:true, models:['qwen3-32b-instruct'],
   full:true, kvHit:0.68, mtp:null, base:{tps:46, prefill:380, active:3, queue:0, kv:0.54, gpu:0.71, memUsed:62, memTotal:128, mtpa:null}},
  {id:'dell', name:'dell-shili-7960-llm', runtime:'llama.cpp b6345', addr:'http://10.77.0.12:8080', ip:'10.77.0.12',
   hw:'Dell Precision 7960 (RTX 6000 Ada 48GB)', unified:false, models:['deepseek-v3.1','qwen3-coder-30b'],
   full:true, kvHit:0.61, mtp:0.62, base:{tps:38, prefill:295, active:4, queue:1, kv:0.63, gpu:0.78, memUsed:31, memTotal:48, mtpa:0.62}},
  {id:'m2s2', name:'m2s2NasUbuntuVM-shili-dev-llm', runtime:'llama.cpp b6180', addr:'http://10.77.0.13:8080', ip:'10.77.0.13',
   hw:'Mac NAS 上的 Ubuntu VM (M 系列, 32GB)', unified:true, models:['glm-4.5-air'],
   full:false, kvHit:null, mtp:null, base:{tps:21, prefill:150, active:2, queue:0, kv:0.47, gpu:0.52, memUsed:19, memTotal:32, mtpa:null}}
];
const MODELS = ['qwen3-32b-instruct','deepseek-v3.1','qwen3-coder-30b','glm-4.5-air'];
const MODEL_NODE = {'qwen3-32b-instruct':'gb10','deepseek-v3.1':'dell','qwen3-coder-30b':'dell','glm-4.5-air':'m2s2'};
const KEYS = [
  {name:'研发主力 Key', owner:'张三', group:'研发', last4:'3f2a', status:'启用', created:'2024-11-08', today:{req:1240,tok:3820000}},
  {name:'研发备用 Key', owner:'李四', group:'研发', last4:'9c1b', status:'启用', created:'2024-11-08', today:{req:486,tok:1450000}},
  {name:'数据分析 Key', owner:'王五', group:'数据分析', last4:'77e0', status:'启用', created:'2025-01-19', today:{req:312,tok:960000}},
  {name:'管理员 master key', owner:'admin', group:'default', last4:'…master', raw:'litellm_proxy_master_key', status:'启用', created:'2024-10-02', today:{req:58,tok:210000}}
];
const ENDPOINTS = ['/v1/chat/completions','/v1/completions','/v1/embeddings'];
const DASH = '<span class="dash">—</span>';

/* ------- 工具函数 ------- */
let seed = 20240517;
function rnd(){ seed = (seed*1664525+0x3c6ef35f)>>>0; return seed/4294967296; }
function rr(a,b){ return a + rnd()*(b-a); }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function walk(v, amp, min, max){ let n = v + (rnd()-0.5)*2*amp; if(n<min)n=min; if(n>max)n=max; return n; }
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function fmt1(n){ return n.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function fmtTok(n){ if(n>=1e6)return (n/1e6).toFixed(2)+'M'; if(n>=1e3)return (n/1e3).toFixed(1)+'K'; return fmt(n); }
function pad(n){ return String(n).padStart(2,'0'); }
function nowStr(d){ d=d||new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function timeAgo(sec){ return sec<60?`${Math.round(sec)} 秒前`:`${Math.round(sec/60)} 分钟前`; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function pct(x){ return (x*100).toFixed(1)+'%'; }
function barColor(x){ return x>=0.9?'danger':(x>=0.75?'warn':'ok'); }
function segHtml(opts, cur, onpick){ return `<div class="seg">${opts.map(o=>`<button class="${o.v===cur?'on':''}" data-v="${o.v}" onclick="${onpick}">${o.t}</button>`).join('')}</div>`; }

/* ------- 节点实时状态（随机游走） ------- */
const nodeState = {};
NODES.forEach(n=>{
  const b = n.base;
  nodeState[n.id] = {
    tps:b.tps, prefill:b.prefill, active:b.active, queue:b.queue,
    kv:b.kv, gpu:b.gpu, memUsed:b.memUsed, mtpa:b.mtp,
    lastScrape: rr(2,8),
    tpsHist: mkSeries(b.tps, b.tps*0.18, 60),
    prefillHist: mkSeries(b.prefill, b.prefill*0.15, 60),
    reqHist: mkSeries(b.active, 1.2, 60),
    gpuHist: mkSeries(b.gpu, 0.05, 60),
    kvHist: mkSeries(b.kv, 0.03, 60)
  };

function mkSeries(base, amp, len){ const a=[]; let v=base; for(let i=0;i<len;i++){ v=walk(v,amp,Math.max(0,base*0.3),base*1.8); a.push(+v.toFixed(2)); } return a; }
function tickNodes(){
  NODES.forEach(n=>{
    const s = nodeState[n.id], b = n.base;
    s.tps = walk(s.tps, b.tps*0.06, b.tps*0.4, b.tps*1.6);
    s.prefill = walk(s.prefill, b.prefill*0.06, b.prefill*0.4, b.prefill*1.6);
    s.active = Math.max(0, Math.round(walk(s.active, 0.9, 0, 12)));
    s.queue = rnd()<0.82?Math.max(0,Math.round(walk(s.queue,0.6,0,3))):Math.round(rr(2,6));
    s.kv = walk(s.kv, 0.02, 0.1, 0.97);
    s.gpu = walk(s.gpu, 0.04, 0.1, 0.99);
    s.memUsed = walk(s.memUsed, 0.4, b.memTotal*0.3, b.memTotal*0.92);
    if(b.mtpa!=null) s.mtpa = walk(s.mtpa, 0.015, 0.5, 0.74);
    s.lastScrape = rr(2,9);
    s.tpsHist.push(+s.tps.toFixed(2)); s.tpsHist.shift();
    s.prefillHist.push(+s.prefill.toFixed(2)); s.prefillHist.shift();
    s.reqHist.push(s.active); s.reqHist.shift();
    s.gpuHist.push(+s.gpu.toFixed(3)); s.gpuHist.shift();
    s.kvHist.push(+s.kv.toFixed(3)); s.kvHist.shift();
  });
}

}

const ERRORS = ['context length exceeded','upstream timeout','model overloaded'];
const req = { tab:'sum', q:'', status:'all', model:'all', ep:'all', key:'all', node:'all',
  range:'24h', tStart:'', tEnd:'', page:1, per:20, grain:'hour',
  sumRange:'24h', sumTab:{model:'tok', gk:'group', ep:'tok'}, sumCharts:{} };
let REQ_ROWS = [];
function genRequests(){
  REQ_ROWS = [];
  const now = Date.now();
  for(let i=0;i<360;i++){
    const key = pick(KEYS);
    const model = pick(MODELS);
    const node = NODES.find(n=>n.id===MODEL_NODE[model]);
    const ep = model==='glm-4.5-air'&&rnd()<0.3 ? '/v1/embeddings' : pick(['/v1/chat/completions','/v1/chat/completions','/v1/chat/completions','/v1/completions']);
    const fail = rnd()<0.04;
    const err = fail? pick(ERRORS) : null;
    const inTok = Math.round(rr(120, 4200));
    const cacheTok = (ep==='/v1/embeddings'||node.kvHit==null)? 0 : Math.round(inTok*rr(0.15,0.75));
    const outTok = ep==='/v1/embeddings'?0:Math.round(rr(60,1800));
    const tps = node.base.tps*rr(0.6,1.3);
    const ttft = fail?0:Math.round(rr(80, 900));
    const total = fail? Math.round(rr(800,30000)) : Math.round(ttft + outTok/ (tps/1000));
    REQ_ROWS.push({
      id:'req_'+(10000+i), t:new Date(now - Math.pow(rnd(),0.6)*6.8*24*60*60000),
      key:`sk-…${key.last4}`, owner:key.owner, group:key.group,
      model, node:node.name, nodeId:node.id, ep,
      inTok, outTok, cacheTok, ttft, total,
      ok:!fail, err,
      errDetail: fail? `${err} — upstream ${node.addr} 返回 503/400；trace_id=${(Math.random()*1e16).toString(16).slice(0,12)}；已自动重试 1 次${err==='upstream timeout'?'，最终失败':'，重试成功前已计入失败'}` : null
    });
  }
  REQ_ROWS.sort((a,b)=>b.t-a.t);
}
genRequests();

function donutOpt(entries, metric){
  const data = entries.map(([k,v])=>({name:k.length>20?k.slice(0,19)+'…':k, value:Math.round(metric==='tok'? v.inTok+v.outTok : v.req)}));
  return {
    tooltip:{trigger:'item', formatter:p=>`${p.name}<br>${fmt(p.value)} ${metric==='tok'?'Tokens':'次'} · ${p.percent}%`},
    color: SUM_COLORS,
    series:[{type:'pie', radius:['50%','74%'], center:['50%','50%'], avoidLabelOverlap:true,
      label:{show:false}, emphasis:{label:{show:true, fontSize:11, color:'#0f172a', formatter:'{b}\n{d}%'}},
      itemStyle:{borderColor:'#fff', borderWidth:2, borderRadius:4},
      data}]
  };
}
function sumTableHtml(entries, opt){
  const sortKey = opt.metric==='tok'? (v=>v.inTok+v.outTok) : (v=>v.req);
  entries = entries.slice().sort((a,b)=>sortKey(b[1])-sortKey(a[1]));
  const tot = entries.reduce((a,[,v])=>a+sortKey(v),0)||1;
  let body = entries.map(([k,v],i)=>{
    const tok = v.inTok+v.outTok;
    let main = `<td class="mono" style="font-size:11.5px"><b>${k}</b></td>
      <td class="num" style="text-align:right">${fmt(v.req)}</td>
      <td class="num" style="text-align:right">${fmtTok(tok)}</td>
      <td class="num" style="text-align:right">${fmtTok(v.inTok)}</td>
      <td class="num" style="text-align:right">${v.outTok?fmtTok(v.outTok):'—'}</td>
      <td class="num" style="text-align:right">${v.cache?fmtTok(v.cache):'—'}</td>
      <td><div class="bar-cell"><div class="bar" style="width:56px"><i style="width:${(sortKey(v)/tot*100).toFixed(1)}%"></i></div><span class="v num" style="font-size:10.5px">${(sortKey(v)/tot*100).toFixed(0)}%</span></div></td>`;
    if(opt.expand){
      const id = opt.prefix+'_'+i;
      main = `<td style="width:20px;padding-right:0"><span id="car_${id}" style="display:inline-block;transition:transform .15s;color:#94a3b8;font-size:13px">›</span></td>` + main;
      const subs = Object.entries(opt.childFn(k)).sort((a,b)=>(b[1].inTok+b[1].outTok)-(a[1].inTok+a[1].outTok));
      const subRows = subs.map(([sk,sv])=>`<tr style="background:#f8fafc">
        <td></td><td style="font-size:11px;color:var(--text2);padding-left:8px">└ ${sk.length>22?sk.slice(0,21)+'…':sk}</td>
        <td class="num" style="text-align:right;font-size:11px">${fmt(sv.req)}</td>
        <td class="num" style="text-align:right;font-size:11px">${fmtTok(sv.inTok+sv.outTok)}</td>
        <td class="num" style="text-align:right;font-size:11px">${fmtTok(sv.inTok)}</td>
        <td class="num" style="text-align:right;font-size:11px">${sv.outTok?fmtTok(sv.outTok):'—'}</td>
        <td class="num" style="text-align:right;font-size:11px">${sv.cache?fmtTok(sv.cache):'—'}</td><td></td></tr>`).join('');
      return `<tr style="cursor:pointer" onclick="sumToggle('${id}')">${main}</tr>
        <tbody id="sub_${id}" style="display:none">${subRows}</tbody>`;
    }
    return `<tr>${main}</tr>`;
  }).join('');
  const caret = opt.expand?'<th style="width:20px"></th>':'';
  return `<table><thead><tr>${caret}<th>${opt.nameCol}</th><th style="text-align:right">请求数</th><th style="text-align:right">Tokens</th><th style="text-align:right">读</th><th style="text-align:right">写</th><th style="text-align:right">缓存</th><th>占比</th></tr></thead>
  <tbody>${body}</tbody></table>`;
}
function sumPanelUpdate(panel){
  const rows = sumFiltered();
  if(panel==='model'){
    const metric = req.sumTab.model;
    const m = aggBy(rows, r=>r.model);
    const entries = Object.entries(m);
    const ch = sumChart('sumChartModel'); if(ch) ch.setOption(donutOpt(entries, metric), true);
    document.getElementById('sumTblModel').innerHTML = sumTableHtml(entries, {
      metric, nameCol:'模型', expand:true, prefix:'m',
      childFn:k=>aggBy(rows.filter(r=>r.model===k), r=>r.node)
    });
  } else if(panel==='gk'){
    const byKey = req.sumTab.gk==='key';
    const m = aggBy(rows, byKey? (r=>`${r.owner} · ${r.key}`) : (r=>r.group));
    const entries = Object.entries(m);
    const ch = sumChart('sumChartGk'); if(ch) ch.setOption(donutOpt(entries, 'tok'), true);
    document.getElementById('sumTblGk').innerHTML = sumTableHtml(entries, {metric:'tok', nameCol: byKey?'Key / 用户':'分组'});
  } else if(panel==='ep'){
    const metric = req.sumTab.ep;
    const m = aggBy(rows, r=>r.ep);
    const entries = Object.entries(m);
    const ch = sumChart('sumChartEp'); if(ch) ch.setOption(donutOpt(entries, metric), true);
    document.getElementById('sumTblEp').innerHTML = sumTableHtml(entries, {metric, nameCol:'端点'});
  }
}
function sumTrendUpdate(){
  const ch = sumChart('sumChartTrend'); if(!ch) return;
  const rows = sumFiltered();
  const [s,e] = sumBounds();
  let n;
  if(req.grain==='hour') n = req.sumRange==='1h'?12 : req.sumRange==='7d'?28 : 24;
  else n = req.sumRange==='7d'?7 : req.sumRange==='24h'?2 : 1;
  const step = (e-s)/n;
  const bins = Array.from({length:n},()=>({i:0,o:0,c:0}));
  rows.forEach(r=>{ let i=Math.floor((r.t.getTime()-s)/step); if(i<0)i=0; if(i>=n)i=n-1;
    bins[i].i+=r.inTok; bins[i].o+=r.outTok; bins[i].c+=r.cacheTok; });
  const labels = Array.from({length:n},(_,i)=>{
    const d = new Date(s+i*step);
    if(req.grain==='day') return `${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    return step<3600e3? `${pad(d.getHours())}:${pad(d.getMinutes())}` : `${pad(d.getHours())}:00`;
  });
  const hit = bins.map(b=> b.i? +(b.c/b.i*100).toFixed(1) : 0);
  ch.setOption({
    grid:{left:52,right:44,top:28,bottom:22},
    tooltip:{trigger:'axis'},
    legend:{top:0,right:0,itemWidth:14,itemHeight:8,textStyle:{fontSize:10.5}},

    yAxis:[{type:'value',splitLine:{lineStyle:{color:'#f1f5f9'}},axisLabel:{color:'#94a3b8',fontSize:10,formatter:v=>v>=1000?(v/1000)+'K':v}},
           {type:'value',max:100,splitLine:{show:false},axisLabel:{color:'#94a3b8',fontSize:10,formatter:'{value}%'}}],
    series:[
      {name:'输入 Token',type:'line',smooth:true,symbol:'none',stack:'tk',data:bins.map(b=>b.i),lineStyle:{width:1.4,color:'#0891b2'},areaStyle:{opacity:.22,color:'#0891b2'}},
      {name:'输出 Token',type:'line',smooth:true,symbol:'none',stack:'tk',data:bins.map(b=>b.o),lineStyle:{width:1.4,color:'#d97706'},areaStyle:{opacity:.22,color:'#d97706'}},
      {name:'缓存读取 Token',type:'line',smooth:true,symbol:'none',stack:'tk',data:bins.map(b=>b.c),lineStyle:{width:1.4,color:'#db2777'},areaStyle:{opacity:.22,color:'#db2777'}},
      {name:'缓存命中率',type:'line',smooth:true,symbol:'none',yAxisIndex:1,data:hit,lineStyle:{width:1.5,type:'dashed',color:'#4f46e5'},itemStyle:{color:'#4f46e5'}}
    ]
  }, true);
}

function reqRangeBounds(){

  if(req.range==='today'){ const d=new Date(); d.setHours(0,0,0,0); return [d.getTime(), now]; }
  const back = {'1h':1,'24h':24,'7d':168}[req.range]||24;
  return [now-back*3600e3, now];
}

  const [rs, re] = reqRangeBounds();

    (req.node==='all'||r.nodeId===req.node) &&

    (!req.q || [r.key,r.owner,r.model,r.node,r.ep,r.err||''].some(x=>x.toLowerCase().includes(req.q.toLowerCase())))
  );
}

function reqReset(){
  req.q=''; req.status='all'; req.model='all'; req.key='all'; req.node='all'; req.ep='all'; req.range='24h'; req.page=1;
  reqListRender(); toast('筛选条件已重置');

function reqF(k,v){ req[k]=v; req.page=1; reqListPaint(); }
function reqPer(v){ req.per=+v; req.page=1; reqListPaint(); }
function reqPage(p){ req.page=p; reqListPaint(); }
function reqListPaint(){
  const rows = reqFiltered();
  /* 统计仪表盘条（随筛选实时联动） */
  const ok = rows.filter(r=>r.ok), failN = rows.length-ok.length;
  const inT = rows.reduce((a,r)=>a+r.inTok,0), outT = rows.reduce((a,r)=>a+r.outTok,0), cT = rows.reduce((a,r)=>a+r.cacheTok,0);
  const avgTtft = ok.length? Math.round(ok.reduce((a,r)=>a+r.ttft,0)/ok.length):0;
  const avgTotal = ok.length? Math.round(ok.reduce((a,r)=>a+r.total,0)/ok.length):0;
  const statCell = (l,v,s)=>`<div style="padding:10px 12px;border-right:1px solid #f1f5f9">
    <div style="font-size:11px;color:var(--text3);margin-bottom:4px">${l}</div>
    <div class="num" style="font-size:16px;font-weight:700">${v}</div>
    <div style="font-size:10.5px;color:var(--text3);margin-top:2px">${s}</div></div>`;
  const statsEl = document.getElementById('reqStats');
  if(statsEl) statsEl.innerHTML =
    statCell('当前结果请求数', fmt(rows.length), '当前筛选范围') +
    statCell('成功率', rows.length? (ok.length/rows.length*100).toFixed(1)+'%' : '—', `失败 ${failN} 次`) +
    statCell('读 Token 合计', fmtTok(inT), '输入（含缓存命中）') +
    statCell('写 Token 合计', fmtTok(outT), '输出生成') +
    statCell('缓存 Token 合计', fmtTok(cT), `命中率 ${inT?(cT/inT*100).toFixed(1):'0.0'}%`) +
    statCell('平均首字延迟', ok.length? avgTtft+' ms':'—', 'TTFT · 成功请求') +
    statCell('平均总时延', ok.length? avgTotal+' ms':'—', '成功请求端到端');
  const pages = Math.max(1, Math.ceil(rows.length/req.per));
  if(req.page>pages) req.page=pages;
  const start=(req.page-1)*req.per, page=rows.slice(start,start+req.per);
  document.getElementById('reqTblWrap').innerHTML = `<table><thead><tr>
    <th>时间</th><th>Key / 用户</th><th>模型</th><th>节点</th><th>端点</th><th style="text-align:right">读 Token</th><th style="text-align:right">写 Token</th><th style="text-align:right">缓存</th><th style="text-align:right">首字延迟</th><th style="text-align:right">总时延</th><th>状态</th>
  </tr></thead><tbody>
  ${page.map(r=>`
    <tr class="${r.ok?'':'row-fail'}" ${r.ok?'':`style="cursor:pointer" onclick="reqExpand('${r.id}')"`}>
      <td class="num mono">${pad(r.t.getMonth()+1)}-${pad(r.t.getDate())} ${nowStr(r.t)}</td>
      <td><span class="mono">${r.key}</span> <span class="muted">${r.owner}</span></td>
      <td class="mono">${r.model}</td>
      <td style="font-size:11.5px">${r.node.length>16?r.node.slice(0,15)+'…':r.node}</td>
      <td class="mono" style="font-size:11px">${r.ep}</td>
      <td class="num" style="text-align:right">${fmt(r.inTok)}</td>
      <td class="num" style="text-align:right">${r.outTok?fmt(r.outTok):'—'}</td>
      <td class="num" style="text-align:right">${r.cacheTok?fmt(r.cacheTok):'—'}</td>
      <td class="num" style="text-align:right">${r.ok?r.ttft+' ms':'—'}</td>
      <td class="num" style="text-align:right">${fmt(r.total)} ms</td>
      <td>${r.ok?'<span class="pill ok">成功</span>':`<span class="pill danger">失败</span> <span class="muted" style="font-size:11px">${r.err}</span>`}</td>
    </tr>
    <tr class="expand-row" id="exp_${r.id}" style="display:none"><td colspan="11"><div class="err-box"><b>错误详情</b> · ${r.err||''}<br>${r.errDetail||''}<br>请求 ID：<span class="mono">${r.id}</span> · 分组 ${r.group}</div></td></tr>`).join('')}
  </tbody></table>`;
  let nums=[];
  const p=req.page;
  for(let i=Math.max(1,p-2);i<=Math.min(pages,p+2);i++) nums.push(i);
  document.getElementById('reqPager').innerHTML = `
    <span class="total">共 ${rows.length} 条 · 每页 ${segHtml([10,20,50].map(n=>({v:n,t:String(n)})), req.per, "reqPer(this.dataset.v)")}</span>
    <button ${p<=1?'disabled':''} onclick="reqPage(${p-1})">‹</button>
    ${nums[0]>1?'<button onclick="reqPage(1)">1</button>'+(nums[0]>2?'<span class="muted">…</span>':''):''}
    ${nums.map(i=>`<button class="${i===p?'on':''}" onclick="reqPage(${i})">${i}</button>`).join('')}
    ${nums[nums.length-1]<pages?'<span class="muted">…</span>'+`<button onclick="reqPage(${pages})">${pages}</button>`:''}
    <button ${p>=pages?'disabled':''} onclick="reqPage(${p+1})">›</button>`;
}
function reqExpand(id){ const tr=document.getElementById('exp_'+id); tr.style.display = tr.style.display==='none'?'':'none'; }
function reqExportCsv(){
  const rows = reqFiltered();
  const head = ['时间','Key','用户','模型','节点','端点','读Token','写Token','缓存Token','首字延迟ms','总时延ms','状态','错误'];
  const csv = '﻿'+[head.join(',')].concat(rows.map(r=>[
    r.t.toISOString(), r.key, r.owner, r.model, r.node, r.ep, r.inTok, r.outTok, r.cacheTok, r.ok?r.ttft:'', r.total, r.ok?'成功':'失败', r.err||''
  ].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','))).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `llm-portal-requests-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast(`已导出 ${rows.length} 条明细 CSV`);
}

function buildNav(){
  document.getElementById('nav').innerHTML = NAV.map(g=>`
    <div class="nav-group"><div class="nav-title">${g.group}</div>
    ${g.items.map(([id,label])=>`<div class="nav-item" data-page="${id}" onclick="go('${id}')">${ICONS[id]}<span>${label}</span></div>`).join('')}
    </div>`).join('');
}
let currentPage = null;
function go(page){ if(location.hash==='#/'+page){ route(); } else location.hash = '#/'+page; }
function route(){
  let page = (location.hash||'#/overview').replace('#/','');
  if(!PAGES[page]) page='overview';
  /* 销毁旧图表实例，避免泄漏 */
  if(window.echarts){
    document.querySelectorAll('#page [id]').forEach(el=>{ const inst = echarts.getInstanceByDom(el); if(inst) inst.dispose(); });
  }
  ov.charts = {}; np.charts = {}; req.sumCharts = {};
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===page));
  PAGES[page].r();
  document.title = PAGES[page].t+' · LLM-Portal';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
window.addEventListener('resize', ()=>{
  document.querySelectorAll('#page [id]').forEach(el=>{ const inst = window.echarts && echarts.getInstanceByDom(el); if(inst) inst.resize(); });
});

/* 初始化 */
buildNav();
if(!location.hash) location.hash = '#/overview';
route();
/* 全局 1s 心跳：总览页倒计时 + 数据游走 */
setInterval(()=>{
  if(currentPage==='overview'){
    if(ov.auto){ ov.remain--; if(ov.remain<=0){ ovRefresh(false); } const cd=document.getElementById('ovCd'); if(cd) cd.textContent=ov.remain; }
    else { const cd=document.getElementById('ovCd'); if(cd) cd.textContent='—'; }
  }
}, 1000);
</script>
