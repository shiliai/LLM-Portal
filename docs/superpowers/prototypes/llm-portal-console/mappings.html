<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型映射 · LLM-portal</title>
<link rel="stylesheet" href="assets/portal.css">
</head>
<body data-page="mappings">
<template id="page">

  <div class="pf-page-head">
    <div class="pf-desc">对外暴露统一模型名，映射到上游 Provider 的具体模型；fallback 链在主目标故障时按顺序切换。</div>
    <button class="pf-btn primary" data-modal="mapping-modal">＋ 新建映射</button>
  </div>

  <div class="pf-card flush">
    <table class="pf-table">
      <thead>
        <tr>
          <th>对外模型名</th><th>主目标</th><th>fallback 链</th><th>入口可路由</th><th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="mono" style="font-weight:600">gpt-4o</td>
          <td>openai-main / <span class="mono">gpt-4o</span></td>
          <td><span class="pf-muted">→</span> deepseek-backup / <span class="mono">deepseek-chat</span></td>
          <td>
            <span class="pf-chip ok">OpenAI ✓</span>
            <span class="pf-chip ok">Anthropic ✓</span>
            <span class="pf-chip ok">Responses ✓</span>
          </td>
          <td>
            <button class="pf-link" data-modal="mapping-modal">编辑</button>
            <button class="pf-link danger" data-toast="原型演示：不执行删除">删除</button>
          </td>
        </tr>
        <tr>
          <td class="mono" style="font-weight:600">claude-sonnet</td>
          <td>anthropic-main / <span class="mono">claude-sonnet-4-5</span></td>
          <td class="pf-muted">无</td>
          <td>
            <span class="pf-chip ok">OpenAI ✓</span>
            <span class="pf-chip ok">Anthropic ✓</span>
            <span class="pf-chip gray">Responses ✗</span>
          </td>
          <td>
            <button class="pf-link" data-modal="mapping-modal">编辑</button>
            <button class="pf-link danger" data-toast="原型演示：不执行删除">删除</button>
          </td>
        </tr>
        <tr>
          <td class="mono" style="font-weight:600">deepseek-chat</td>
          <td>deepseek-backup / <span class="mono">deepseek-chat</span></td>
          <td class="pf-muted">无</td>
          <td>
            <span class="pf-chip ok">OpenAI ✓</span>
            <span class="pf-chip ok">Anthropic ✓</span>
            <span class="pf-chip gray">Responses ✗</span>
          </td>
          <td>
            <button class="pf-link" data-modal="mapping-modal">编辑</button>
            <button class="pf-link danger" data-toast="原型演示：不执行删除">删除</button>
          </td>
        </tr>
        <tr>
          <td class="mono" style="font-weight:600">qwen-local</td>
          <td>vllm-internal / <span class="mono">Qwen2.5-72B-Instruct</span></td>
          <td class="pf-muted">无</td>
          <td>
            <span class="pf-chip ok">OpenAI ✓</span>
            <span class="pf-chip ok">Anthropic ✓</span>
            <span class="pf-chip gray">Responses ✗</span>
          </td>
          <td>
            <button class="pf-link" data-modal="mapping-modal">编辑</button>
            <button class="pf-link danger" data-toast="原型演示：不执行删除">删除</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 新建 / 编辑映射弹窗 -->
  <div class="pf-modal" id="mapping-modal">
    <div class="pf-modal-head">
      <div class="pf-modal-title">新建 / 编辑映射</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">
      <div class="pf-form-row">
        <label class="req">对外模型名</label>
        <div>
          <input class="pf-input mono" value="gpt-4o" placeholder="对外暴露的统一模型名">
          <div class="pf-desc">调用方使用该名称请求，网关按本条映射路由。</div>
        </div>
      </div>
      <div class="pf-form-row">
        <label class="req">主目标</label>
        <div>
          <div style="display:flex;gap:8px">
            <select class="pf-select">
              <option selected>openai-main</option>
              <option>anthropic-main</option>
              <option>deepseek-backup</option>
              <option>vllm-internal</option>
            </select>
            <select class="pf-select">
              <option selected>gpt-4o</option>
              <option>gpt-4o-mini</option>
            </select>
          </div>
          <div class="pf-desc">先选 Provider，再选该上游的模型名。</div>
        </div>
      </div>
      <div class="pf-form-row">
        <label>fallback 链</label>
        <div>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="pf-muted" style="flex:none">1.</span>
            <select class="pf-select">
              <option>openai-main</option>
              <option>anthropic-main</option>
              <option selected>deepseek-backup</option>
              <option>vllm-internal</option>
            </select>
            <select class="pf-select">
              <option selected>deepseek-chat</option>
            </select>
            <button class="pf-link danger" style="flex:none" data-toast="原型演示：静态示意，不移除行">删除</button>
          </div>
          <div style="margin-top:8px">
            <button class="pf-link" data-toast="原型演示：静态示意，不新增行">＋ 添加 fallback</button>
          </div>
          <div class="pf-desc">按顺序尝试；仅连接失败/超时/5xx/429 触发切换，流式仅首事件前可切换。</div>
        </div>
      </div>
      <div class="pf-form-row">
        <label>入口可路由预览</label>
        <div>
          <div style="background:#fafafa;border:1px solid #f0f0f0;border-radius:4px;padding:9px 12px;display:flex;gap:6px;flex-wrap:wrap">
            <span class="pf-chip ok">OpenAI ✓</span>
            <span class="pf-chip ok">Anthropic ✓</span>
            <span class="pf-chip ok">Responses ✓</span>
          </div>
          <div class="pf-desc">由主目标与 fallback 的协议能力交集推导，保存后自动生效。</div>
        </div>
      </div>
    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" data-close>取消</button>
      <button class="pf-btn primary" onclick="pfModalClose();pfToast('已保存')">保存</button>
    </div>
  </div>

</template>
<script src="assets/portal.js"></script>
</body>
</html>
