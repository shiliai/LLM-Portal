<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>事件 · LLM-portal</title>
<link rel="stylesheet" href="assets/portal.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body data-page="events">
<template id="page">

  <div class="pf-page-head">
    <div class="pf-desc">Typed 事件流是缓存失效、上游切换等运维事实的唯一宣告渠道；事件只追加，不修改历史。</div>
  </div>

  <!-- 筛选栏 -->
  <div class="pf-card">
    <div class="pf-toolbar">
      <select class="pf-select">
        <option>全部类型</option>
        <option>上游切换</option>
        <option>缓存失效宣告</option>
        <option>入口规范化</option>
        <option>持久化失败</option>
      </select>
      <button class="pf-btn primary" data-toast="已按当前筛选查询">查询</button>
    </div>
  </div>

  <!-- 事件表 -->
  <div class="pf-card flush">
    <table class="pf-table">
      <thead>
        <tr>
          <th>时间</th><th>类型</th><th>详情摘要</th><th>关联</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="mono">14:31:42</td>
          <td><span class="pf-chip violet">上游切换</span></td>
          <td>gpt-4o: openai-main 连接超时(10.2s) → deepseek-backup 成功</td>
          <td><a href="logs.html">查看日志</a></td>
        </tr>
        <tr>
          <td class="mono">14:05:37</td>
          <td><span class="pf-chip gray">入口规范化</span></td>
          <td>今日累计 312 次变换（内联 system 提升 287 / 空 content 规范化 25），明细已脱敏</td>
          <td class="pf-muted">—</td>
        </tr>
        <tr>
          <td class="mono">11:58:24</td>
          <td><span class="pf-chip err">持久化失败</span></td>
          <td>bodies 写入超时（磁盘 IO），失败计数 +1，客户端响应未受影响</td>
          <td><a href="logs.html">查看日志</a></td>
        </tr>
        <tr>
          <td class="mono">10:12:09</td>
          <td><span class="pf-chip info">缓存失效宣告</span></td>
          <td>us09-v1 → us09-v2 版本变更，影响已启用密钥 2 把，上游缓存预计冷启动</td>
          <td><a href="keys.html">查看密钥</a></td>
        </tr>
        <tr>
          <td class="mono">09:26:51</td>
          <td><span class="pf-chip violet">上游切换</span></td>
          <td>gpt-4o: openai-main 429 rate_limit_exceeded → deepseek-backup 成功</td>
          <td><a href="logs.html">查看日志</a></td>
        </tr>
        <tr>
          <td class="mono">08-12 23:59:59</td>
          <td><span class="pf-chip gray">入口规范化</span></td>
          <td>8/12 累计 289 次变换（内联 system 提升 271 / 空 content 规范化 18），明细已脱敏</td>
          <td class="pf-muted">—</td>
        </tr>
        <tr>
          <td class="mono">08-12 18:03:12</td>
          <td><span class="pf-chip info">缓存失效宣告</span></td>
          <td>policy-v2 → policy-v3 策略版本变更（system prompt 注入「品牌口径 v3」），影响已启用密钥 1 把</td>
          <td><a href="keys.html">查看密钥</a></td>
        </tr>
        <tr>
          <td class="mono">08-12 16:22:05</td>
          <td><span class="pf-chip violet">上游切换</span></td>
          <td>gpt-4o: openai-main 首字节超时(60s) → deepseek-backup 成功</td>
          <td><a href="logs.html">查看日志</a></td>
        </tr>
      </tbody>
    </table>
  </div>

</template>
<script src="assets/portal.js"></script>
</body>
</html>
