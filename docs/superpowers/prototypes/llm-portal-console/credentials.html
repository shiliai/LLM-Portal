<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据凭据 · LLM-portal</title>
<link rel="stylesheet" href="assets/portal.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body data-page="credentials">
<template id="page">

  <!-- 页头 -->
  <div class="pf-page-head">
    <div class="pf-desc">数据访问凭据独立于虚拟密钥与管理员会话（C9 三鉴权域），仅可读取已保存的对话数据，不能调用模型、不能进入管理面。</div>
    <button class="pf-btn primary" id="btn-open-newdk" data-modal="modal-newdk">新建数据凭据</button>
  </div>

  <!-- 凭据列表 -->
  <div class="pf-card flush">
    <div class="pf-card-head">
      <div class="pf-card-title">凭据列表</div>
      <div class="pf-card-extra">共 1 个</div>
    </div>
    <table class="pf-table">
      <thead>
        <tr><th>凭据</th><th>备注名</th><th>连接状态</th><th class="num">已消费事件</th><th>操作</th></tr>
      </thead>
      <tbody>
        <tr>
          <td><span class="pf-key">dk-portal-5h8s…p3q9</span></td>
          <td>数据分析管道</td>
          <td><span class="pf-chip ok"><span class="pf-dot ok"></span>SSE 连接活跃 · 3 分钟前</span></td>
          <td class="num">1,204 条</td>
          <td><button class="pf-link danger" data-toast="演示环境：吊销未实际执行">吊销</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 接口文档卡 ×2 -->
  <div class="pf-grid cols-2">
    <div class="pf-card">
      <div class="pf-card-head">
        <div class="pf-card-title mono">GET /data/v1/stream</div>
        <div class="pf-card-extra"><span class="pf-chip info">SSE 实时流</span></div>
      </div>
      <div class="pf-desc">
        SSE 实时推送 conversation.saved 事件，长连接每 15s 发送一次心跳。<br>
        事件 id 单调递增；断线重连时携带 Last-Event-ID，自动回放错过的事件（回放窗口 = 正文保留期）。
      </div>
      <div class="pf-code"><pre>curl -N "http://&lt;网关&gt;:8080/data/v1/stream?key=a3f4&amp;include_body=true" \
  -H "Authorization: Bearer dk-portal-..."</pre></div>
      <div class="pf-desc">示例事件：</div>
      <div class="pf-code"><pre>id: 1205
event: conversation.saved
data: {"id":"conv_9f2a","key":"sk-portal-a3f4…9k2e","model":"claude-sonnet",
data:  "usage":{"input":2847,"output":512},"body":{…}}</pre></div>
    </div>

    <div class="pf-card">
      <div class="pf-card-head">
        <div class="pf-card-title mono">GET /data/v1/conversations</div>
        <div class="pf-card-extra"><span class="pf-chip gray">历史查询</span></div>
      </div>
      <div class="pf-desc">
        历史查询，keyset 分页（after=序列号），支持时间 / 密钥 / 模型过滤。<br>
        单条 GET /data/v1/conversations/:id 返回解压后的完整正文。
      </div>
      <div class="pf-code"><pre>curl "http://&lt;网关&gt;:8080/data/v1/conversations?after=1180&amp;limit=50" \
  -H "Authorization: Bearer dk-portal-..."</pre></div>
      <div class="pf-desc">示例响应：</div>
      <div class="pf-code"><pre>{
  "items": [
    { "seq": 1181, "id": "conv_9f2a",
      "key": "sk-portal-a3f4…9k2e",
      "model": "claude-sonnet",
      "saved_at": "2026-08-13T14:32:08+08:00" }
  ],
  "next_after": 1181
}</pre></div>
    </div>
  </div>

  <!-- 新建数据凭据弹窗（两态：表单 → 仅显示一次） -->
  <div class="pf-modal" id="modal-newdk">
    <div class="pf-modal-head">
      <div class="pf-modal-title" id="newdk-title">新建数据凭据</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">
      <div id="newdk-form">
        <div class="pf-form-row">
          <label class="req">备注名</label>
          <div>
            <input class="pf-input" placeholder="例：数据分析管道">
            <div class="pf-desc">凭据仅可访问 /data/v1/* 只读接口，属于独立鉴权域（C9）。</div>
          </div>
        </div>
      </div>
      <div id="newdk-result" style="display:none">
        <div class="pf-banner">凭据全文仅此一次展示，关闭后只能看到前缀预览。</div>
        <div class="pf-code"><pre>dk-portal-5h8s2k9d3f7a1b6cp3q9</pre></div>
        <div class="pf-desc">请立即复制并妥善保存；网关不存储明文，丢失后只能吊销重发。</div>
      </div>
    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" id="newdk-cancel" data-close>取消</button>
      <button class="pf-btn primary" id="btn-gendk">生成凭据</button>
      <button class="pf-btn primary" id="btn-dk-saved" style="display:none">我已保存</button>
    </div>
  </div>

</template>
<script src="assets/portal.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  function state(showResult) {
    document.getElementById('newdk-form').style.display   = showResult ? 'none' : '';
    document.getElementById('newdk-cancel').style.display = showResult ? 'none' : '';
    document.getElementById('btn-gendk').style.display    = showResult ? 'none' : '';
    document.getElementById('newdk-result').style.display = showResult ? '' : 'none';
    document.getElementById('btn-dk-saved').style.display = showResult ? '' : 'none';
    document.getElementById('newdk-title').textContent    = showResult ? '凭据已生成（仅显示一次）' : '新建数据凭据';
  }
  document.getElementById('btn-open-newdk').addEventListener('click', function () { state(false); });
  document.getElementById('btn-gendk').addEventListener('click', function () { state(true); });
  document.getElementById('btn-dk-saved').addEventListener('click', function () {
    pfModalClose(); pfToast('数据凭据已创建'); state(false);
  });
});
</script>
</body>
</html>
