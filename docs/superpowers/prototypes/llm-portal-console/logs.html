<!doctype html>

<style>

<body data-page="logs">
<template id="page">

  <!-- 筛选栏 -->

    <div class="pf-toolbar">
      <select class="pf-select">
        <option>全部密钥</option>
        <option>研发部-Claude Code</option>

        <option>gpt-4o</option>
        <option>claude-sonnet</option>
        <option>deepseek-chat</option>
        <option>qwen-local</option>

      <select class="pf-select">
        <option>全部状态</option>
        <option>成功</option>
        <option>429 限流</option>
        <option>429 限额</option>
        <option>400</option>
        <option>5xx</option>
        <option>部分完成</option>

      <select class="pf-select">
        <option>近 1 小时</option>

        <option>近 7 天</option>

        <tr class="clickable" data-drawer="logDetail">

        </tr>
        <tr class="clickable" data-drawer="logDetail">
          <td class="mono">14:26:51</td>
          <td><span class="pf-key">sk-portal-a3f4…9k2e</span></td>
          <td><span class="pf-chip">Anthropic</span></td>
          <td>claude-sonnet</td><td>anthropic-main</td>
          <td><span class="pf-chip ok">200</span></td>

        </tr>

        </tr>
        <tr class="clickable" data-drawer="logDetail">
          <td class="mono">14:23:48</td>

        </tr>
        <tr class="clickable" data-drawer="logDetail">
          <td class="mono">14:22:04</td>
          <td><span class="pf-key">sk-portal-a3f4…9k2e</span></td>

          <td><span class="pf-chip">OpenAI</span></td>

          <td class="num pf-muted">—</td><td class="num">0.1s</td><td class="num pf-muted">—</td>
        </tr>
        <tr class="clickable" data-drawer="logDetail">
          <td class="mono">08-01 08:52:19</td>
          <td>
            <span class="pf-key" title="快照冻结，密钥吊销不影响历史归因">sk-portal-f2e8…w4hj</span>
            <span class="pf-chip gray" title="快照冻结，密钥吊销不影响历史归因">已吊销</span>
          </td>
          <td><span class="pf-chip">OpenAI</span></td>
          <td>gpt-4o</td><td>openai-main</td>
          <td><span class="pf-chip ok">200</span></td>
          <td class="num mono">1,203 / 288</td><td class="num">3.1s</td><td class="num mono">¥0.042</td>

      </tbody>
    </table>
    <div class="pf-pager">
      <span class="pf-pager-total">共 12,847 条 · 每页 20 条 · 1/643 页</span>
      <button disabled>‹</button>
      <button class="cur">1</button>
      <button>2</button>
      <button>3</button>
      <button disabled>…</button>
      <button>643</button>
      <button>›</button>
    </div>
  </div>

  <!-- 调用详情抽屉（示例：gpt-4o 已切换那条） -->
  <div class="pf-drawer" id="logDetail">
    <div class="pf-drawer-head">
      <div class="pf-drawer-title">调用详情</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-drawer-body">

      <div id="logDetailView">
        <div class="pf-card-title" style="margin-top:0">概要</div>
        <div class="pf-kv">
          <div class="pf-kv-k">时间</div><div class="pf-kv-v mono">2026-08-13 14:31:42</div>
          <div class="pf-kv-k">密钥</div><div class="pf-kv-v"><span class="pf-key">sk-portal-7bc2…m1qf</span> 市场部-内容组</div>
          <div class="pf-kv-k">入口</div><div class="pf-kv-v">OpenAI <span class="mono">/v1/chat/completions</span></div>
          <div class="pf-kv-k">对外模型</div><div class="pf-kv-v mono">gpt-4o</div>
          <div class="pf-kv-k">流式</div><div class="pf-kv-v">是</div>
          <div class="pf-kv-k">TTFB</div><div class="pf-kv-v">420ms</div>
          <div class="pf-kv-k">总耗时</div><div class="pf-kv-v">8.1s</div>
          <div class="pf-kv-k">状态</div><div class="pf-kv-v"><span class="pf-chip ok">200</span> <span class="pf-chip violet">已切换 deepseek-backup</span></div>
        </div>

        <div class="pf-card-title">尝试链</div>
        <div style="border:1px solid #f0f0f0;border-radius:4px;padding:9px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="pf-chip gray">①</span>
          <span class="pf-key">openai-main / gpt-4o</span>
          <span class="pf-chip warn">连接超时 10.2s</span>
          <span class="pf-chip violet">已切换 →</span>
        </div>
        <div style="border:1px solid #f0f0f0;border-radius:4px;padding:9px 12px;margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="pf-chip gray">②</span>
          <span class="pf-key">deepseek-backup / deepseek-chat</span>
          <span class="pf-chip ok">成功</span>
        </div>
        <div class="pf-desc" style="margin-top:6px">连接超时归为可重试错误，按映射 fallback 链自动切换（US-04）。</div>

        <div class="pf-card-title">版本三元组</div>
        <div>
          <span class="pf-key">us13-v1</span> · <span class="pf-key">policy-v3</span> · <span class="pf-key">us09-v1</span>
        </div>
        <div class="pf-desc" style="margin-top:6px">版本变更＝缓存失效宣告事件（C4/C5）。</div>

        <div class="pf-card-title">用量</div>
        <div class="pf-kv">
          <div class="pf-kv-k">input</div><div class="pf-kv-v mono">3,204</div>
          <div class="pf-kv-k">output</div><div class="pf-kv-v mono">812</div>
          <div class="pf-kv-k">cache_read</div><div class="pf-kv-v mono">1,024</div>
          <div class="pf-kv-k">cache_write</div><div class="pf-kv-v mono">0</div>
          <div class="pf-kv-k">usage_estimated</div><div class="pf-kv-v mono">false</div>
        </div>

        <div class="pf-card-title">成本</div>
        <div class="mono" style="font-size:16px;font-weight:600">¥0.087</div>
        <div class="pf-desc" style="margin-top:4px">价格版本 v3，请求时冻结，不随价格表变动重算。</div>

        <div style="margin-top:18px;display:flex;align-items:center;gap:8px">
          <button class="pf-btn primary sm" data-logview="conv">查看对话</button>
          <span class="pf-desc">该密钥已开启对话保存（US-12）</span>
        </div>
      </div>

      <div id="logConvView" hidden>
        <button class="pf-link" data-logview="detail">‹ 返回详情</button>
        <div class="pf-desc" style="margin:10px 0 14px">该密钥已开启对话保存（US-12），正文 gzip 存储，保留 7 天。</div>

        <div style="margin-bottom:12px">
          <div class="pf-desc" style="margin-bottom:4px">system · 注入「品牌口径 v3」</div>
          <div style="background:#fafafa;border:1px solid #f0f0f0;border-radius:4px;padding:8px 12px;color:#595959">
            你是市场部品牌文案助手，遵循「品牌口径 v3」：语气专业克制，不承诺未发布功能，不与竞品直接比较。
          </div>
        </div>
        <div style="margin-bottom:12px">
          <div class="pf-desc" style="margin-bottom:4px">user</div>
          <div style="background:#e6f4ff;border:1px solid #91caff;border-radius:4px;padding:8px 12px">
            帮我为数据看板 8 月更新写一段 80 字以内的产品公告，突出实时刷新能力。
          </div>
        </div>
        <div style="margin-bottom:12px">
          <div class="pf-desc" style="margin-bottom:4px">assistant · deepseek-backup / deepseek-chat</div>
          <div style="background:#fff;border:1px solid #f0f0f0;border-radius:4px;padding:8px 12px">
            【8 月更新】数据看板现已支持核心指标实时刷新，秒级同步业务变化；新增自定义布局与团队共享。欢迎升级体验，期待你的反馈。
          </div>
        </div>
        <div class="pf-desc">共 3 条消息 · 正文 gzip 压缩后 1.4 KB</div>
      </div>

    </div>
    <div class="pf-drawer-foot">
      <button class="pf-btn" data-close>关闭</button>
    </div>
  </div>

</template>
<script src="assets/portal.js"></script>
<script>
  /* 抽屉正文视图切换：详情 ↔ 只读对话（US-12） */
  document.addEventListener('click', function (e) {
    var d = document.getElementById('logDetailView');
    var c = document.getElementById('logConvView');
    if (!d || !c) return;
    var v = e.target.closest('[data-logview]');
    if (v) {
      d.hidden = v.dataset.logview === 'conv';
      c.hidden = v.dataset.logview !== 'conv';
    } else if (e.target.closest('[data-drawer="logDetail"]')) {
      d.hidden = false;
      c.hidden = true;
    }
  });
</script>
</body>
</html>
