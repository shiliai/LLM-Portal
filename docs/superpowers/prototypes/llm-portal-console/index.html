<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仪表盘 · LLM-portal</title>
<link rel="stylesheet" href="assets/portal.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">

<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">

<body data-page="dashboard">
<template id="page">

  <!-- 统计卡行 -->
  <div class="pf-grid cols-4">
    <div class="pf-stat">
      <div class="pf-stat-label">今日请求</div>
      <div class="pf-stat-value">12,847</div>
      <div class="pf-stat-sub"><span class="up">↑ 18%</span> 较昨日</div>
    </div>
    <div class="pf-stat">
      <div class="pf-stat-label">Token 消耗（今日）</div>
      <div class="pf-stat-value">8.4<small>M</small></div>
      <div class="pf-stat-sub">输入 6.1M · 输出 2.3M</div>
    </div>
    <div class="pf-stat">
      <div class="pf-stat-label">估算成本（今日）</div>
      <div class="pf-stat-value">¥214.60</div>
      <div class="pf-stat-sub">按请求时冻结的价格版本计费</div>
    </div>
    <div class="pf-stat">
      <div class="pf-stat-label">缓存命中率</div>
      <div class="pf-stat-value">37.2<small>%</small></div>
      <div class="pf-stat-sub">已节省 <span class="up">¥58.21</span></div>
    </div>
  </div>

  <!-- 趋势 + 系统健康 -->

          <span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#595959"><i style="width:8px;height:8px;border-radius:2px;background:#389e0d;display:inline-block"></i>估算成本（¥）</span>
        </div>
      </div>

          <linearGradient id="gradReq" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1677ff" stop-opacity=".18"/>
            <stop offset="1" stop-color="#1677ff" stop-opacity=".02"/>
          </linearGradient>
        </defs>

        <!-- 面板一：请求数 -->
        <text x="46" y="12" font-size="11" fill="#8c8c8c">请求数（次）</text>
        <line x1="46" y1="18"  x2="608" y2="18"  stroke="#f0f0f0" stroke-dasharray="3 3"/>
        <line x1="46" y1="73"  x2="608" y2="73"  stroke="#f0f0f0" stroke-dasharray="3 3"/>
        <line x1="46" y1="128" x2="608" y2="128" stroke="#f0f0f0"/>
        <text x="40" y="21.5"  font-size="10.5" fill="#8c8c8c" text-anchor="end">14k</text>
        <text x="40" y="76.5"  font-size="10.5" fill="#8c8c8c" text-anchor="end">7k</text>
        <text x="40" y="131.5" font-size="10.5" fill="#8c8c8c" text-anchor="end">0</text>

        <path d="M46 63.3 L139.7 56.5 L233.3 66.5 L327 46.2 L420.7 40.8 L514.3 42.6 L608 27.1 V128 H46 Z" fill="url(#gradReq)"/>
        <path d="M46 63.3 L139.7 56.5 L233.3 66.5 L327 46.2 L420.7 40.8 L514.3 42.6 L608 27.1" fill="none" stroke="#1677ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="#fff" stroke="#1677ff" stroke-width="1.6">
          <circle cx="46" cy="63.3" r="3"/><circle cx="139.7" cy="56.5" r="3"/>
          <circle cx="233.3" cy="66.5" r="3"/><circle cx="327" cy="46.2" r="3"/>
          <circle cx="420.7" cy="40.8" r="3"/><circle cx="514.3" cy="42.6" r="3"/>
          <circle cx="608" cy="27.1" r="3"/>

        <text x="606" y="20" font-size="11" font-weight="600" fill="#595959" text-anchor="end">12,847</text>

        <text x="46" y="156" font-size="11" fill="#8c8c8c">估算成本（¥）</text>
        <line x1="46" y1="162" x2="608" y2="162" stroke="#f0f0f0" stroke-dasharray="3 3"/>
        <line x1="46" y1="188" x2="608" y2="188" stroke="#f0f0f0" stroke-dasharray="3 3"/>
        <line x1="46" y1="214" x2="608" y2="214" stroke="#f0f0f0"/>
        <text x="40" y="165.5" font-size="10.5" fill="#8c8c8c" text-anchor="end">¥250</text>
        <text x="40" y="217.5" font-size="10.5" fill="#8c8c8c" text-anchor="end">¥100</text>

        <path d="M46 202.8 L139.7 196.2 L233.3 207.6 L327 187.4 L420.7 183 L514.3 185.7 L608 174.3" fill="none" stroke="#389e0d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="#fff" stroke="#389e0d" stroke-width="1.6">
          <circle cx="46" cy="202.8" r="2.6"/><circle cx="139.7" cy="196.2" r="2.6"/>
          <circle cx="233.3" cy="207.6" r="2.6"/><circle cx="327" cy="187.4" r="2.6"/>
          <circle cx="420.7" cy="183" r="2.6"/><circle cx="514.3" cy="185.7" r="2.6"/>
          <circle cx="608" cy="174.3" r="2.6"/>

        <!-- 日期标签 -->
        <g font-size="10.5" fill="#8c8c8c" text-anchor="middle">
          <text x="46" y="234">8/7</text><text x="139.7" y="234">8/8</text>
          <text x="233.3" y="234">8/9</text><text x="327" y="234">8/10</text>
          <text x="420.7" y="234">8/11</text><text x="514.3" y="234">8/12</text>
          <text x="608" y="234">8/13</text>

        <g fill="transparent">
          <rect x="0"     y="10" width="93.6" height="226"><title>8/7 · 请求 8,240 次 · 成本 ¥132.40</title></rect>
          <rect x="92.9"  y="10" width="93.6" height="226"><title>8/8 · 请求 9,105 次 · 成本 ¥151.20</title></rect>
          <rect x="186.5" y="10" width="93.6" height="226"><title>8/9 · 请求 7,832 次 · 成本 ¥118.60</title></rect>
          <rect x="280.2" y="10" width="93.6" height="226"><title>8/10 · 请求 10,412 次 · 成本 ¥176.80</title></rect>

        </g>
      </svg>
    </div>

    <div class="pf-card">
      <div class="pf-card-head">
        <div class="pf-card-title">系统健康</div>
        <div class="pf-card-extra"><a href="events.html">查看事件 ›</a></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f5f5f5">
        <div>
          <div style="font-size:12.5px">计量队列积压</div>
          <div class="pf-desc">实时计量写入正常</div>
        </div>
        <div style="font-size:18px;font-weight:600;font-variant-numeric:tabular-nums"><span class="pf-dot ok"></span>0</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f5f5f5">
        <div>
          <div style="font-size:12.5px">持久化失败（今日）</div>
          <div class="pf-desc">US-12 对话保存 · 磁盘写入超时</div>
        </div>
        <a href="events.html" style="font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:#cf1322"><span class="pf-dot err"></span>1</a>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0">
        <div>
          <div style="font-size:12.5px">上游可用</div>
          <div class="pf-desc">最近探测 2 分钟前</div>
        </div>
        <div style="font-size:18px;font-weight:600;font-variant-numeric:tabular-nums"><span class="pf-dot ok"></span>4/4</div>
      </div>
      <div class="pf-desc" style="border-top:1px solid #f0f0f0;padding-top:10px;margin-top:2px">
        openai-main、anthropic-main、deepseek-backup、vllm-internal 均正常。
      </div>
    </div>
  </div>

  <!-- 最近调用 -->

      <div class="pf-card-title">最近调用</div>

      <tbody>
