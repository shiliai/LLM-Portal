<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>虚拟密钥 · LLM-portal</title>
<link rel="stylesheet" href="assets/portal.css">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body data-page="keys">
<template id="page">

  <!-- 页头 -->
  <div class="pf-page-head">
    <div class="pf-desc">虚拟密钥是客户端调用网关的唯一凭据；限流、限额与内容策略均按密钥挂载，修改即时生效。</div>
    <button class="pf-btn primary" id="btn-open-newkey" data-modal="modal-newkey">新建密钥</button>
  </div>

  <!-- 密钥列表 -->
  <div class="pf-card flush">
    <div class="pf-card-head">
      <div class="pf-card-title">密钥列表</div>
      <div class="pf-card-extra">共 4 把 · 3 把启用</div>
    </div>
    <table class="pf-table">
      <thead>
        <tr>
          <th>密钥</th><th>备注名</th><th>授权模型</th><th>关键策略</th>
          <th class="num">本月用量</th><th>状态</th><th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr class="clickable" data-drawer="drawer-key">
          <td><span class="pf-key">sk-portal-a3f4…9k2e</span></td>
          <td>研发部-Claude Code</td>
          <td><span class="pf-chip">claude-sonnet</span> <span class="pf-chip">qwen-local</span></td>
          <td><span class="pf-chip gray">US-13 兼容模式</span> <span class="pf-chip info">对话保存</span> <span class="pf-chip gray">60 RPM</span></td>
          <td class="num mono">¥86.40</td>
          <td><span class="pf-chip ok">启用</span></td>
          <td><button class="pf-link">详情</button></td>
        </tr>
        <tr class="clickable" data-drawer="drawer-key">
          <td><span class="pf-key">sk-portal-7bc2…m1qf</span></td>
          <td>市场部-内容组</td>
          <td><span class="pf-chip">gpt-4o</span></td>
          <td><span class="pf-chip info">注入「品牌口径 v3」</span> <span class="pf-chip gray">限额 ¥500 · 已用 42.9%</span></td>
          <td class="num mono">¥214.60</td>
          <td><span class="pf-chip ok">启用</span></td>
          <td><button class="pf-link">详情</button></td>
        </tr>
        <tr class="clickable" data-drawer="drawer-key">
          <td><span class="pf-key">sk-portal-c9d1…t7x2</span></td>
          <td>测试-Codex</td>
          <td><span class="pf-chip">gpt-4o</span></td>
          <td><span class="pf-chip info">Responses 受管透传</span> <span class="pf-chip gray">us09-v1 观察模式</span></td>
          <td class="num mono">¥12.75</td>
          <td><span class="pf-chip ok">启用</span></td>
          <td><button class="pf-link">详情</button></td>
        </tr>
        <tr class="clickable" data-drawer="drawer-key" style="opacity:.55">
          <td><span class="pf-key">sk-portal-f2e8…w4hj</span></td>
          <td>旧-临时排查</td>
          <td><span class="pf-muted">—</span></td>
          <td><span class="pf-muted">—</span></td>
          <td class="num mono">¥0.00</td>
          <td><span class="pf-chip gray">已吊销（2026-08-01）</span></td>
          <td><button class="pf-link">详情</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 新建密钥弹窗（两态：表单 → 仅显示一次） -->
  <div class="pf-modal" id="modal-newkey">
    <div class="pf-modal-head">
      <div class="pf-modal-title" id="newkey-title">新建密钥</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">
      <div id="newkey-form">
        <div class="pf-form-row">
          <label class="req">备注名</label>
          <div><input class="pf-input" placeholder="例：研发部-Claude Code"></div>
        </div>
        <div class="pf-form-row">
          <label class="req">授权模型</label>
          <div>
            <div style="margin-bottom:6px"><label class="pf-checkbox"><input type="checkbox">gpt-4o</label></div>
            <div style="margin-bottom:6px"><label class="pf-checkbox"><input type="checkbox">claude-sonnet</label></div>
            <div style="margin-bottom:6px"><label class="pf-checkbox"><input type="checkbox">deepseek-chat</label></div>
            <div style="margin-bottom:6px"><label class="pf-checkbox"><input type="checkbox">qwen-local</label></div>
            <div class="pf-desc">对应「模型映射」中的对外模型名；未勾选的模型该密钥无权调用。</div>
          </div>
        </div>
      </div>
      <div id="newkey-result" style="display:none">
        <div class="pf-banner">密钥全文仅此一次展示，关闭后只能看到前缀预览。</div>
        <div class="pf-code"><pre>sk-portal-a3f4b8c1d2e9f7a6b5c4d3e2f1a09k2e</pre></div>
        <div class="pf-desc">请立即复制并妥善保存到密钥管理工具；网关不存储明文，丢失后只能吊销重发。</div>
      </div>
    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" id="newkey-cancel" data-close>取消</button>
      <button class="pf-btn primary" id="btn-genkey">生成密钥</button>
      <button class="pf-btn primary" id="btn-key-saved" style="display:none">我已保存</button>
    </div>
  </div>

  <!-- 密钥详情抽屉（展示 研发部-Claude Code） -->
  <div class="pf-drawer" id="drawer-key">
    <div class="pf-drawer-head">
      <div class="pf-drawer-title">密钥详情 · 研发部-Claude Code</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-drawer-body">
      <div class="pf-tabs">
        <button class="pf-tab active" data-tab="base">基础</button>
        <button class="pf-tab" data-tab="limits">限额与限流</button>
        <button class="pf-tab" data-tab="policy">内容策略</button>
        <button class="pf-tab" data-tab="data">数据</button>
      </div>

      <!-- Tab 基础 -->
      <div class="pf-tabpane active" data-tab="base">
        <div class="pf-kv">
          <div class="pf-kv-k">前缀预览</div><div class="pf-kv-v"><span class="pf-key">sk-portal-a3f4…9k2e</span></div>
          <div class="pf-kv-k">备注名</div><div class="pf-kv-v">研发部-Claude Code</div>
          <div class="pf-kv-k">创建时间</div><div class="pf-kv-v">2026-07-12</div>
          <div class="pf-kv-k">状态</div><div class="pf-kv-v"><span class="pf-chip ok">启用</span></div>
          <div class="pf-kv-k">授权模型</div><div class="pf-kv-v"><span class="pf-chip">claude-sonnet</span> <span class="pf-chip">qwen-local</span></div>
        </div>
        <div style="border-top:1px solid #f0f0f0;margin:16px 0"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <div>
            <div style="font-weight:600">吊销密钥</div>
            <div class="pf-desc">吊销立即生效，历史日志与计量保留。</div>
          </div>
          <button class="pf-btn danger" data-toast="演示环境：吊销未实际执行">吊销密钥</button>
        </div>
        <div style="margin-top:20px"><button class="pf-btn primary" data-toast="已保存，策略即时生效">保存</button></div>
      </div>

      <!-- Tab 限额与限流 -->
      <div class="pf-tabpane" data-tab="limits">
        <div class="pf-form-row">
          <label>RPM 限流</label>
          <div>
            <input class="pf-input" value="60" style="width:140px">
            <div class="pf-desc">超出后返回 429，错误码 rate_limit_exceeded。</div>
          </div>
        </div>
        <div class="pf-form-row">
          <label>月度金额限额</label>
          <div>
            <input class="pf-input" placeholder="留空 = 不限" style="width:140px">
            <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
              <div class="pf-progress" style="flex:1;max-width:200px"><i style="width:8%"></i></div>
              <span class="pf-desc mono">本月已用 ¥86.40 / 不限</span>
            </div>
            <div class="pf-desc" style="margin-top:6px">超限返回 429，错误码 insufficient_quota，与限流可区分（US-06）；限额按累计值预检，最后一笔请求可能小幅超额（已文档化）。</div>
          </div>
        </div>
        <div style="margin-top:4px"><button class="pf-btn primary" data-toast="已保存，策略即时生效">保存</button></div>
      </div>

      <!-- Tab 内容策略 -->
      <div class="pf-tabpane" data-tab="policy">
        <div style="font-weight:600;margin-bottom:10px">System Prompt 策略（US-05）</div>
        <div style="margin-bottom:10px">
          <label class="pf-radio"><input type="radio" name="us05" checked>不修改</label>
          <label class="pf-radio"><input type="radio" name="us05">注入（前置）</label>
          <label class="pf-radio"><input type="radio" name="us05">追加（尾部）</label>
          <label class="pf-radio"><input type="radio" name="us05">替换</label>
        </div>
        <textarea class="pf-input" placeholder="例：你是「XX 科技」官方智能助手，回答遵循品牌口径 v3：称呼用户为『您』，不承诺未发布的功能，不评价竞品。"></textarea>
        <div class="pf-desc" style="margin-top:6px">密钥策略优先于模型路由策略，取最具体的一个生效，不叠加；当前策略版本 policy-v3，修改后自动升版并向缓存宣告失效。</div>

        <div style="border-top:1px solid #f0f0f0;margin:16px 0"></div>

        <div style="font-weight:600;margin-bottom:10px">工具输出优化（US-09）</div>
        <div style="margin-bottom:6px">
          <label class="pf-radio"><input type="radio" name="us09">关闭</label>
          <label class="pf-radio"><input type="radio" name="us09" checked>观察模式</label>
          <label class="pf-radio"><input type="radio" name="us09">开启</label>
        </div>
        <div class="pf-desc">观察模式仅统计工具输出的体积构成，不修改任何内容；开启后应用 us09-v1 规则（确定性、幂等）。</div>

        <div style="border-top:1px solid #f0f0f0;margin:16px 0"></div>

        <div style="font-weight:600;margin-bottom:10px">缓存自动注入（US-08）</div>
        <div style="margin-bottom:6px">
          <label class="pf-radio"><input type="radio" name="us08" checked>off（默认）</label>
          <label class="pf-radio"><input type="radio" name="us08">system</label>
          <label class="pf-radio"><input type="radio" name="us08">system+tail</label>
        </div>
        <div class="pf-desc">仅对 Anthropic 原生上游生效，自动注入 cache_control 断点，最多 4 个。</div>

        <div style="border-top:1px solid #f0f0f0;margin:16px 0"></div>

        <div style="font-weight:600;margin-bottom:10px">Anthropic 入口规范化（US-13）</div>
        <div style="margin-bottom:4px"><label class="pf-radio"><input type="radio" name="us13" checked>兼容模式（默认，自动规范化不合规请求）</label></div>
        <div style="margin-bottom:6px"><label class="pf-radio"><input type="radio" name="us13">严格模式（不符合规范即 400 拒绝）</label></div>
        <div class="pf-desc">兼容模式下发生的每次变换计入事件（内容脱敏）。</div>

        <div style="margin-top:16px"><button class="pf-btn primary" data-toast="已保存，策略即时生效">保存</button></div>
      </div>

      <!-- Tab 数据 -->
      <div class="pf-tabpane" data-tab="data">
        <div style="display:flex;align-items:center;gap:10px">
          <label class="pf-switch"><input type="checkbox" checked><span></span></label>
          <span style="font-weight:600">对话保存（US-12）</span>
        </div>
        <div class="pf-desc" style="margin-top:8px">开启后保存聚合后的完整请求/响应正文，gzip 压缩，保留 7 天（全局设置）；关闭时正文一个字节不落，仅保留调用元数据。</div>
        <div style="margin-top:16px"><button class="pf-btn primary" data-toast="已保存，策略即时生效">保存</button></div>
      </div>
    </div>
  </div>

</template>
<script src="assets/portal.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  function state(showResult) {
    document.getElementById('newkey-form').style.display   = showResult ? 'none' : '';
    document.getElementById('newkey-cancel').style.display = showResult ? 'none' : '';
    document.getElementById('btn-genkey').style.display    = showResult ? 'none' : '';
    document.getElementById('newkey-result').style.display = showResult ? '' : 'none';
    document.getElementById('btn-key-saved').style.display = showResult ? '' : 'none';
    document.getElementById('newkey-title').textContent    = showResult ? '密钥已生成（仅显示一次）' : '新建密钥';
  }
  document.getElementById('btn-open-newkey').addEventListener('click', function () { state(false); });
  document.getElementById('btn-genkey').addEventListener('click', function () { state(true); });
  document.getElementById('btn-key-saved').addEventListener('click', function () {
    pfModalClose(); pfToast('新密钥已创建并启用'); state(false);
  });
});
</script>
</body>
</html>
