<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上游 Provider · LLM-portal</title>
<link rel="stylesheet" href="assets/portal.css">
</head>
<body data-page="providers">
<template id="page">

  <div class="pf-page-head">
    <div class="pf-desc">管理上游模型服务的接入端点、协议能力与访问凭据；协议能力决定该上游可承接哪些入口请求。</div>
    <button class="pf-btn primary" data-modal="provider-modal">＋ 新建 Provider</button>
  </div>

  <div class="pf-card flush">
    <table class="pf-table">
      <thead>
        <tr>
          <th>名称</th><th>base_url</th><th>协议能力</th><th>安全标记</th><th>状态</th><th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="font-weight:600">openai-main</td>
          <td class="mono">https://api.openai.com</td>
          <td><span class="pf-chip mono">chat_completions</span> <span class="pf-chip mono">responses</span></td>
          <td class="pf-muted">—</td>
          <td><span class="pf-chip ok">正常</span> <span class="pf-desc">上次测试 2 分钟前</span></td>
          <td>
            <button class="pf-link" data-toast="连接成功 · 186ms">测试连接</button>
            <button class="pf-link" data-modal="provider-modal">编辑</button>
            <button class="pf-link danger" data-toast="原型演示：不执行删除">删除</button>
          </td>
        </tr>
        <tr>
          <td style="font-weight:600">anthropic-main</td>
          <td class="mono">https://api.anthropic.com</td>
          <td><span class="pf-chip mono">anthropic_messages</span></td>
          <td class="pf-muted">—</td>
          <td><span class="pf-chip ok">正常</span></td>
          <td>
            <button class="pf-link" data-toast="连接成功 · 186ms">测试连接</button>
            <button class="pf-link" data-modal="provider-modal">编辑</button>
            <button class="pf-link danger" data-toast="原型演示：不执行删除">删除</button>
          </td>
        </tr>
        <tr>
          <td style="font-weight:600">deepseek-backup</td>
          <td class="mono">https://api.deepseek.com</td>
          <td><span class="pf-chip mono">chat_completions</span></td>
          <td class="pf-muted">—</td>
          <td><span class="pf-chip ok">正常</span></td>
          <td>
            <button class="pf-link" data-toast="连接成功 · 186ms">测试连接</button>
            <button class="pf-link" data-modal="provider-modal">编辑</button>
            <button class="pf-link danger" data-toast="原型演示：不执行删除">删除</button>
          </td>
        </tr>
        <tr>
          <td style="font-weight:600">vllm-internal</td>
          <td class="mono">http://192.168.1.50:8000/v1</td>
          <td><span class="pf-chip mono">chat_completions</span></td>
          <td><span class="pf-chip warn">允许私网/回环</span> <span class="pf-chip warn">明文 HTTP</span></td>
          <td><span class="pf-chip ok">正常</span></td>
          <td>
            <button class="pf-link" data-toast="连接成功 · 186ms">测试连接</button>
            <button class="pf-link" data-modal="provider-modal">编辑</button>
            <button class="pf-link danger" data-toast="原型演示：不执行删除">删除</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 新建 / 编辑 Provider 弹窗 -->
  <div class="pf-modal" id="provider-modal">
    <div class="pf-modal-head">
      <div class="pf-modal-title">新建 / 编辑 Provider</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">
      <div class="pf-form-row">
        <label class="req">名称</label>
        <div>
          <input class="pf-input" placeholder="如 openai-main">
        </div>
      </div>
      <div class="pf-form-row">
        <label class="req">base_url</label>
        <div>
          <input class="pf-input mono" placeholder="https://api.example.com">
          <div class="pf-desc">默认拒绝私网/回环地址，如需连接内网上游请显式勾选下方允许项；保存与请求时均校验解析后 IP。</div>
        </div>
      </div>
      <div class="pf-form-row">
        <label class="req">协议能力</label>
        <div>
          <div><label class="pf-checkbox"><input type="checkbox" checked><span class="mono">chat_completions</span></label></div>
          <div style="margin-top:6px"><label class="pf-checkbox"><input type="checkbox"><span class="mono">anthropic_messages</span></label></div>
          <div style="margin-top:6px"><label class="pf-checkbox"><input type="checkbox"><span class="mono">responses</span></label></div>
          <div class="pf-desc">能力决定该上游可承接哪些入口。</div>
        </div>
      </div>
      <div class="pf-form-row">
        <label class="req">凭据</label>
        <div>
          <input class="pf-input" type="password" placeholder="sk-…" autocomplete="new-password">
          <div class="pf-desc">保存后加密存储，不再回显。</div>
        </div>
      </div>
      <div class="pf-form-row">
        <label>安全允许项</label>
        <div>
          <div>
            <label class="pf-checkbox"><input type="checkbox">允许私网/回环地址</label>
            <div class="pf-desc" style="color:#d46b08">警示：放开后 base_url 可解析到私网/回环 IP，仅用于自建内网上游。</div>
          </div>
          <div style="margin-top:8px">
            <label class="pf-checkbox"><input type="checkbox">允许明文 HTTP</label>
            <div class="pf-desc" style="color:#d46b08">警示：请求与凭据将以明文传输，仅限可信内网环境使用。</div>
          </div>
        </div>
      </div>
    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" style="margin-right:auto" data-toast="连接成功 · 186ms">测试连接</button>
      <button class="pf-btn" data-close>取消</button>
      <button class="pf-btn primary" onclick="pfModalClose();pfToast('已保存')">保存</button>
    </div>
  </div>

</template>
<script src="assets/portal.js"></script>
</body>
</html>
