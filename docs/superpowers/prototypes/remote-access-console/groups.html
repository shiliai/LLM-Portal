<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分组 · 远程模型网关</title>
<link rel="stylesheet" href="assets/portal.css">
</head>
<body data-page="groups">
<template id="page">

  <!-- 页头 -->
  <div class="pf-page-head">
    <div class="pf-desc">把上游 provider（本期即站点）归入命名分组，再把每把用户 Key 绑定到一个分组，使不同 Key 的请求只在授权 provider 范围内分流（US-P13，分层语义同 sub2api 的 group）。分组与按 Key 模型白名单正交；也可在「站点与公钥」页按 provider 调整归属。</div>
    <button class="pf-btn primary" data-modal="modal-newgroup" id="btn-open-newgroup">新建分组</button>
  </div>

  <!-- 分组列表 -->
  <div class="pf-card flush">
    <div class="pf-card-head">
      <div class="pf-card-title">分组列表</div>
      <div class="pf-card-extra">共 2 个分组</div>
    </div>
    <table class="pf-table">
      <thead>
        <tr><th>分组名</th><th>说明</th><th>成员站点</th><th class="num">绑定 Key 数</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody>
        <tr data-group-row="default">
          <td><span class="pf-chip">default</span></td>
          <td>系统组：等同于全部在线 provider，新接入站点自动并入</td>
          <td>
            <span class="pf-chip">hq-office</span>
            <span class="pf-chip">lab-2f</span>
          </td>
          <td class="num">2</td>
          <td><span class="pf-chip ok">系统组</span></td>
          <td><button class="pf-link" disabled>不可删除</button></td>
        </tr>
        <tr data-group-row="home">
          <td><span class="pf-chip">home</span></td>
          <td>仅家庭站点，给「家人共用」Key 使用</td>
          <td><span class="pf-chip">hq-office</span></td>
          <td class="num">1</td>
          <td><span class="pf-chip ok">启用</span></td>
          <td>
            <button class="pf-link js-rename-group" data-group="home">改名</button>
            <button class="pf-link danger js-delete-group" data-group="home">删除</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pf-desc">Key 的可用模型 = 其分组内 provider 部署的模型 ∩ 模型白名单（未设白名单即不裁剪）；分组对 API 与网关托管 MCP 同时生效。「绑定 Key 数」为只读统计，改某 Key 的分组请到「用户 Key」页。</div>

  <!-- 新建分组弹窗 -->
  <div class="pf-modal" id="modal-newgroup" style="width:480px">
    <div class="pf-modal-head">
      <div class="pf-modal-title">新建分组</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">
      <div class="pf-form-row">
        <label class="req">分组名</label>
        <div>
          <input class="pf-input mono" id="newgroup-name" placeholder="例：team-alpha" value="team-alpha">
          <div class="pf-desc">用于在 Key 绑定与日志中标识该分组。</div>
        </div>
      </div>
      <div class="pf-form-row">
        <label>成员站点</label>
        <div>
          <div class="pf-desc" style="margin-bottom:8px">勾选该分组包含的 provider（站点）；一个站点可属于 0 个或多个分组。</div>
          <label style="display:block;margin:6px 0"><input type="checkbox" class="ng-cb" value="hq-office" checked> <span class="mono">hq-office</span> · 10.77.0.11</label>
          <label style="display:block;margin:6px 0"><input type="checkbox" class="ng-cb" value="lab-2f"> <span class="mono">lab-2f</span> · 10.77.0.12</label>
        </div>
      </div>
    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" data-close>取消</button>
      <button class="pf-btn primary" id="btn-newgroup-ok">创建</button>
    </div>
  </div>

</template>
<script src="assets/portal.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {

  /* ---------- 新建分组：关闭并提示（原型不真实写表） ---------- */
  document.getElementById('btn-newgroup-ok').addEventListener('click', function () {
    var name = (document.getElementById('newgroup-name').value || '').trim() || 'team-alpha';
    pfModalClose();
    pfToast('分组「' + name + '」已创建');
  });

  /* ---------- 改名 / 删除：原型仅提示 ---------- */
  document.querySelectorAll('.js-delete-group').forEach(function (btn) {
    btn.addEventListener('click', function () { pfToast('分组「' + btn.dataset.group + '」已删除'); });
  });
  document.querySelectorAll('.js-rename-group').forEach(function (btn) {
    btn.addEventListener('click', function () { pfToast('改名入口（原型占位）'); });
  });
});
</script>
</body>
</html>
