<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型与别名 · 远程模型网关</title>
<link rel="stylesheet" href="assets/portal.css">
</head>
<body data-page="models">
<template id="page">

  <!-- 页头 -->
  <div class="pf-page-head">
    <div class="pf-desc">对外模型名 = 直选名或别名；同一对外名在多个站点有部署时按 <span class="mono">least-busy</span> 按在途请求数分流，站点故障自动熔断切流（US-P6/US-P11）。</div>
    <button class="pf-btn primary" data-modal="modal-newalias">新建别名</button>
  </div>

  <!-- 模型列表（可展开 deployment） -->
  <div class="pf-card flush">
    <div class="pf-card-head">
      <div class="pf-card-title">对外模型名</div>
      <div class="pf-card-extra">2 个直选 · 2 个别名 · 共 3 个物理 deployment</div>
    </div>
    <table class="pf-table">
      <thead>
        <tr>
          <th style="width:28px"></th>
          <th>对外模型名</th><th>类型</th><th class="num">Deployment</th><th>路由策略</th><th>状态摘要</th>
        </tr>
      </thead>
      <tbody>

        <!-- deepseek-v4-flash-0731（直选） -->
        <tr class="clickable js-model-toggle" data-target="dep-deepseek">
          <td><button class="pf-btn-icon expanded" aria-label="展开"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5 11 8l-6 5.5"/></svg></button></td>
          <td class="mono">deepseek-v4-flash-0731</td>
          <td><span class="pf-chip info">直选</span></td>
          <td class="num">2</td>
          <td class="mono">least-busy</td>
          <td><span class="pf-chip ok">1 健康</span> <span class="pf-chip warn">1 冷却中</span></td>
        </tr>
        <tr class="pf-collapse-row" id="dep-deepseek">
          <td colspan="6">
            <div class="pf-collapse-body">
              <div class="pf-dep-item">
                <div class="pf-dep-main">
                  <strong>hq-office</strong>
                  <span class="mono pf-muted">api_base=10.77.0.11:8890</span>
                  <span class="pf-chip gray">rpm 120 / tpm 300,000</span>
                </div>
                <span class="pf-chip ok"><span class="pf-dot ok"></span>健康</span>
              </div>
              <div class="pf-dep-item">
                <div class="pf-dep-main">
                  <strong>lab-2f</strong>
                  <span class="mono pf-muted">api_base=10.77.0.12:8890</span>
                  <span class="pf-chip gray">rpm 60 / tpm 150,000</span>
                </div>
                <span class="pf-chip warn"><span class="pf-dot warn"></span>冷却中（剩余 43s）</span>
              </div>
            </div>
          </td>
        </tr>

        <!-- qwen3.6-35b-a3（直选） -->
        <tr class="clickable js-model-toggle" data-target="dep-qwen">
          <td><button class="pf-btn-icon" aria-label="展开"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5 11 8l-6 5.5"/></svg></button></td>
          <td class="mono">qwen3.6-35b-a3</td>
          <td><span class="pf-chip info">直选</span></td>
          <td class="num">1</td>
          <td class="mono">least-busy</td>
          <td><span class="pf-chip ok">1 健康</span></td>
        </tr>
        <tr class="pf-collapse-row" id="dep-qwen" style="display:none">
          <td colspan="6">
            <div class="pf-collapse-body">
              <div class="pf-dep-item">
                <div class="pf-dep-main">
                  <strong>hq-office</strong>
                  <span class="mono pf-muted">api_base=10.77.0.11:8004</span>
                  <span class="pf-chip gray">rpm 60 / tpm 120,000</span>
                </div>
                <span class="pf-chip ok"><span class="pf-dot ok"></span>健康</span>
              </div>
            </div>
          </td>
        </tr>

        <!-- claude-opus-5（别名） -->
        <tr class="clickable js-model-toggle" data-target="dep-opus">
          <td><button class="pf-btn-icon" aria-label="展开"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5 11 8l-6 5.5"/></svg></button></td>
          <td class="mono">claude-opus-5 <span class="pf-chip violet">别名 → deepseek-v4-flash-0731</span></td>
          <td><span class="pf-chip violet">别名</span></td>
          <td class="num">2</td>
          <td class="mono">least-busy</td>
          <td><span class="pf-chip ok">1 健康</span> <span class="pf-chip warn">1 冷却中</span></td>
        </tr>
        <tr class="pf-collapse-row" id="dep-opus" style="display:none">
          <td colspan="6">
            <div class="pf-collapse-body">
              <div class="pf-desc" style="margin-bottom:8px">别名共用其上游 <span class="mono">deepseek-v4-flash-0731</span> 的全部 deployment：</div>
              <div class="pf-dep-item">
                <div class="pf-dep-main">
                  <strong>hq-office</strong>
                  <span class="mono pf-muted">api_base=10.77.0.11:8890</span>
                  <span class="pf-chip gray">rpm 120 / tpm 300,000</span>
                </div>
                <span class="pf-chip ok"><span class="pf-dot ok"></span>健康</span>
              </div>
              <div class="pf-dep-item">
                <div class="pf-dep-main">
                  <strong>lab-2f</strong>
                  <span class="mono pf-muted">api_base=10.77.0.12:8890</span>
                  <span class="pf-chip gray">rpm 60 / tpm 150,000</span>
                </div>
                <span class="pf-chip warn"><span class="pf-dot warn"></span>冷却中（剩余 43s）</span>
              </div>
            </div>
          </td>
        </tr>

        <!-- gpt-4o（别名） -->
        <tr class="clickable js-model-toggle" data-target="dep-gpt4o">
          <td><button class="pf-btn-icon" aria-label="展开"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5 11 8l-6 5.5"/></svg></button></td>
          <td class="mono">gpt-4o <span class="pf-chip violet">别名 → deepseek-v4-flash-0731</span></td>
          <td><span class="pf-chip violet">别名</span></td>
          <td class="num">2</td>
          <td class="mono">least-busy</td>
          <td><span class="pf-chip ok">1 健康</span> <span class="pf-chip warn">1 冷却中</span></td>
        </tr>
        <tr class="pf-collapse-row" id="dep-gpt4o" style="display:none">
          <td colspan="6">
            <div class="pf-collapse-body">
              <div class="pf-desc" style="margin-bottom:8px">别名共用其上游 <span class="mono">deepseek-v4-flash-0731</span> 的全部 deployment：</div>
              <div class="pf-dep-item">
                <div class="pf-dep-main">
                  <strong>hq-office</strong>
                  <span class="mono pf-muted">api_base=10.77.0.11:8890</span>
                  <span class="pf-chip gray">rpm 120 / tpm 300,000</span>
                </div>
                <span class="pf-chip ok"><span class="pf-dot ok"></span>健康</span>
              </div>
              <div class="pf-dep-item">
                <div class="pf-dep-main">
                  <strong>lab-2f</strong>
                  <span class="mono pf-muted">api_base=10.77.0.12:8890</span>
                  <span class="pf-chip gray">rpm 60 / tpm 150,000</span>
                </div>
                <span class="pf-chip warn"><span class="pf-dot warn"></span>冷却中（剩余 43s）</span>
              </div>
            </div>
          </td>
        </tr>

      </tbody>
    </table>
  </div>

  <!-- 路由与解析说明 -->
  <div class="pf-card">
    <div class="pf-card-head"><div class="pf-card-title">路由与解析说明</div></div>
    <div class="pf-kv">
      <div class="pf-kv-k">路由策略</div><div class="pf-kv-v"><span class="mono">least-busy</span>：按各 deployment 在途请求数分流，非加权随机；低并发下近似轮询，属预期行为。</div>
      <div class="pf-kv-k">故障熔断</div><div class="pf-kv-v">单 deployment 连续失败后冷却 60 秒（<span class="mono">cooldown_time=60</span>），期间不参与分流；全部 deployment 不可用时返回可判读 503，不无限挂起。</div>
      <div class="pf-kv-k">别名解析</div><div class="pf-kv-v">别名与直选名并存；同一上游可挂多个对外名（US-P11）。请求未映射且不存在的模型名返回 400/404「模型不存在」，不误路由。</div>
      <div class="pf-kv-k">可见性</div><div class="pf-kv-v"><span class="mono">/v1/models</span> 返回全部对外名：deepseek-v4-flash-0731、qwen3.6-35b-a3、claude-opus-5、gpt-4o。</div>
    </div>
  </div>

  <!-- 新建别名弹窗 -->
  <div class="pf-modal" id="modal-newalias">
    <div class="pf-modal-head">
      <div class="pf-modal-title">新建别名</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">
      <div class="pf-form-row">
        <label class="req">对外模型名（别名）</label>
        <div>
          <input class="pf-input mono" placeholder="例：gpt-4o-mini">
          <div class="pf-desc">客户端将用此名称直接调用；不得与已存在的对外模型名冲突。</div>
        </div>
      </div>
      <div class="pf-form-row">
        <label class="req">指向的直选模型</label>
        <div>
          <select class="pf-select">
            <option>deepseek-v4-flash-0731</option>
            <option>qwen3.6-35b-a3</option>
          </select>
          <div class="pf-desc">别名继承其指向模型的全部站点 deployment 与路由策略。</div>
        </div>
      </div>
    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" data-close>取消</button>
      <button class="pf-btn primary" id="btn-create-alias">创建</button>
    </div>
  </div>

</template>
<script src="assets/portal.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.js-model-toggle').forEach(function (row) {
    row.addEventListener('click', function (e) {
      if (e.target.closest('a')) return;
      var target = document.getElementById(row.dataset.target);
      var icon = row.querySelector('.pf-btn-icon');
      var open = target.style.display !== 'none';
      target.style.display = open ? 'none' : '';
      icon.classList.toggle('expanded', !open);
    });
  });
  document.getElementById('btn-create-alias').addEventListener('click', function () {
    pfModalClose();
    pfToast('别名已创建（原型不做持久化）');
  });
});
</script>
</body>
</html>
