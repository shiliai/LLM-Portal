<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 远程模型网关</title>
<link rel="stylesheet" href="assets/portal.css">
<style>
  /* 页面级布局（无壳居中）：仅排版尺寸，颜色全部复用 portal.css 令牌 */
  .lg-page {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  .lg-card {
    width: 380px; max-width: 100%;
    background: #fff; border: 1px solid #f0f0f0; border-radius: 6px;
    padding: 36px 32px 26px;
  }
  .lg-logo {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 6px;
  }
  .lg-logo .pf-logo-mark { width: 36px; height: 36px; border-radius: 8px; }
  .lg-title { font-size: 19px; font-weight: 600; letter-spacing: .2px; }
  .lg-sub { text-align: center; font-size: 12.5px; color: #8c8c8c; margin-bottom: 24px; }
  .lg-label {
    display: block; font-size: 12.5px; color: #1f1f1f; margin-bottom: 6px;
  }
  .lg-card .pf-input { height: 34px; }
  .lg-btn { width: 100%; height: 34px; margin-top: 18px; font-size: 13px; }
  .lg-note { text-align: center; margin-top: 16px; }
  .lg-foot { margin-top: 24px; font-size: 12px; color: #8c8c8c; text-align: center; }
  .lg-surface {
    margin-top: 18px; display: flex; align-items: center; justify-content: center;
    gap: 10px; font-size: 11.5px; color: #8c8c8c;
  }
</style>
</head>
<body>

<div class="lg-page">
  <div class="lg-card">
    <div class="lg-logo">
      <span class="pf-logo-mark"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.8 1.6 3.2 9h3.6l-.8 5.4L11.6 7H8z"/></svg></span>
      <span class="lg-title">远程模型网关</span>
    </div>
    <div class="lg-sub">管理控制台 · gw.example.com</div>

    <label class="lg-label" for="lg-pwd">Master Key</label>
    <input class="pf-input mono" id="lg-pwd" type="password" placeholder="请输入管理员 Master Key" autocomplete="current-password">

    <a class="pf-btn primary lg-btn" href="index.html">登 录</a>

    <div class="pf-desc lg-note">Master Key 仅用于管理控制台与站点接入注册，不作为客户端调用凭据</div>
  </div>

  <div class="lg-foot">远程模型网关 · 局域网私有推理模型的统一公网入口（原型）</div>
</div>

<script src="assets/portal.js"></script>
</body>
</html>
