# blackbox-exporter 配置：WG 站点 health HTTP 探针（低频 60s）
# 只做 http_2xx；超时设小；不注入鉴权头（health 端点免鉴权）
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      # 更明确的 TCP/RTT 分段（probe_http_duration_seconds 各阶段）
      tls_config:
        insecure_skip_verify: true
