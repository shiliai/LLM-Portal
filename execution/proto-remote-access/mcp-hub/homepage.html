<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>private-llm · 服务状态</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e40af'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>P</text></svg>">
<style>
  :root{--blue-900:#172554;--blue-700:#1d4ed8;--slate-900:#0f172a;--slate-500:#64748b;--slate-400:#94a3b8;--line:#e2e8f0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--slate-900);background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;line-height:1.6}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px 56px;text-align:center;box-shadow:0 1px 3px rgba(15,23,42,.06)}
  .mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--blue-900),var(--blue-700));color:#fff;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  h1{font-size:20px;letter-spacing:-.3px}
  .sub{font-size:13px;color:var(--slate-400);font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:2px}
  .status{display:inline-flex;align-items:center;gap:9px;margin-top:22px;font-size:15px;padding:8px 20px;border-radius:999px;background:#f1f5f9;color:var(--slate-500)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--slate-400)}
  .dot.on{background:#059669;box-shadow:0 0 0 4px rgba(5,150,105,.15)}
  .dot.off{background:#dc2626;box-shadow:0 0 0 4px rgba(220,38,38,.15)}
  .status.on{color:#065f46;background:#ecfdf5}
  .status.off{color:#991b1b;background:#fef2f2}
  .ts{font-size:11.5px;color:var(--slate-400);margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="mark">P</div>
  <h1>private-llm 私有模型网关</h1>
  <div class="sub">https://llm-portal.example.com</div>
  <div class="status" id="status"><span class="dot" id="dot"></span><span id="stext">检查中…</span></div>
  <div class="ts" id="ts"></div>
</div>
<script>
(async () => {
  const dot = document.getElementById('dot'),
        box = document.getElementById('status'),
        text = document.getElementById('stext'),
        ts = document.getElementById('ts');
  const check = async () => {
    let ok = false;
    try { const r = await fetch('/health/liveliness', {cache: 'no-store'}); ok = r.ok; } catch (e) {}
    dot.className = 'dot ' + (ok ? 'on' : 'off');
    box.className = 'status ' + (ok ? 'on' : 'off');
    text.textContent = ok ? '服务在线' : '服务离线';
    ts.textContent = new Date().toLocaleString('zh-CN', {hour12: false});
  };
  check(); setInterval(check, 30000);
})();
</script>
</body>
</html>
