# private-llm.onlyservice.io — private-llm 网关单入口（由 deploy.sh 渲染占位符后并入 nginx-sub2api 配置）
# 占位符：{{LITELLM_UPSTREAM}}（共享网络内 litellm 容器）。#7 容器化后全部上游均为
# 共享网络内容器名（private-llm-console / private-llm-onboardd / private-llm-mcp-hub），不再回宿主机
# 设计等价物：Caddy 路径分发 + flush_interval -1 → 此处 proxy_buffering off + 长读超时
#
# r6 公网暴露面（allowlist，US-P14）：
#   /                       网关主页（mcp-hub 托管静态页）
#   /v1/*                   双协议 API（LiteLLM）
#   = /key/info             用户自查 API（US-P10）
#   = /health/liveliness    主页状态灯
#   /mcp*                   MCP 端点（mcp-hub）
#   /onboard/install|register|confirm   站点接入（onboardd；/onboard/admin/* 公网 404）
#   /console                自写管理控制台（consoled:8300）
#   其余一律 404（LiteLLM /ui、/login、/sso、openapi/文档、全部管理 API 均不对公网）

# HTTP：ACME webroot + 跳转 HTTPS
server {
    listen 80;
    server_name private-llm.onlyservice.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS：allowlist 路径分发
server {
    listen 443 ssl;
    http2 on;
    server_name private-llm.onlyservice.io;

    ssl_certificate /etc/letsencrypt/live/private-llm.onlyservice.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/private-llm.onlyservice.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # /mcp/upload 图片上限 10MB + 协议开销
    client_max_body_size 15m;

    access_log /var/log/nginx/private-llm.access.log combined;
    error_log /var/log/nginx/private-llm.error.log warn;

    # ---- 精确匹配（优先级最高） ----

    # 网关主页（隐藏 LiteLLM Swagger 脸面；由 mcp-hub 托管静态页）
    location = / {
        proxy_pass http://private-llm-mcp-hub:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 用户自查 API（US-P10；不带/错 Key 由 LiteLLM 401）
    location = /key/info {
        proxy_pass http://{{LITELLM_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 主页在线状态灯
    location = /health/liveliness {
        proxy_pass http://{{LITELLM_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- 前缀匹配（最长优先） ----

    # LiteLLM 双协议 API（/v1/chat/completions、/v1/messages、/v1/models…）——SSE 流式必需不缓冲
    location /v1/ {
        proxy_pass http://{{LITELLM_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # mcp-hub（Streamable HTTP + 上传 + 临时文件 + 用量）——SSE 不缓冲
    location /mcp {
        proxy_pass http://private-llm-mcp-hub:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # onboardd 管理端点不对公网开放（^~ 最长前缀拦截；site-tools 走本机 8100 不受影响）
    location ^~ /onboard/admin/ {
        return 404;
    }

    # onboardd 站点接入三端点（install 由站点机器 curl、register/confirm 由 install.sh 回调）
    location /onboard/ {
        proxy_pass http://private-llm-onboardd:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 自写管理控制台（consoled；会话鉴权在其内部完成）
    location /console {
        proxy_pass http://private-llm-console:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 收敛：其余一律 404（LiteLLM /ui、/login、/sso、/openapi.json、/redoc、/health、
    # /key/generate|block|update|delete、/model/*、/global/*、/spend/* 等管理面均在此拦截；
    # 本机仍可直查 127.0.0.1:4000，应急走 ssh -L 4000:127.0.0.1:4000）
    location / {
        return 404;
    }
}
