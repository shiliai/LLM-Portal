# llm-portal.example.com — private-llm 网关单入口（由 deploy.sh 渲染占位符后并入 nginx-sub2api 配置）
# 占位符：{{LITELLM_UPSTREAM}}（共享网络内 litellm 容器）、{{HOST_GATEWAY}}（宿主机网关 IP，供 host 进程 onboardd/mcp-hub）
# 设计等价物：Caddy 路径分发 + flush_interval -1 → 此处 proxy_buffering off + 长读超时

# HTTP：ACME webroot + 跳转 HTTPS
server {
    listen 80;
    server_name llm-portal.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS：按路径分发
server {
    listen 443 ssl;
    http2 on;
    server_name llm-portal.example.com;

    ssl_certificate /etc/letsencrypt/live/llm-portal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm-portal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # /mcp/upload 图片上限 10MB + 协议开销
    client_max_body_size 15m;

    access_log /var/log/nginx/private-llm.access.log combined;
    error_log /var/log/nginx/private-llm.error.log warn;

    # mcp-hub（Streamable HTTP + 上传 + 临时文件 + 用量）——SSE 不缓冲
    location /mcp {
        proxy_pass http://{{HOST_GATEWAY}}:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # onboardd（站点一键接入：install/register/confirm）
    location /onboard/ {
        proxy_pass http://{{HOST_GATEWAY}}:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 网关主页（隐藏 LiteLLM Swagger 脸面；由 mcp-hub 托管静态页）
    location = / {
        proxy_pass http://{{HOST_GATEWAY}}:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 收敛 API 面暴露：openapi/文档端点与全量健康检查不对公网开放（本机仍可直查 127.0.0.1:4000）
    location = /openapi.json { return 404; }
    location = /redoc { return 404; }
    location = /health { return 404; }

    # LiteLLM（/v1/* 双协议 API + /ui Admin UI）——SSE 流式必需不缓冲
    location / {
        proxy_pass http://{{LITELLM_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
