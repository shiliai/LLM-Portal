<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>站点与公钥 · 远程模型网关</title>
<link rel="stylesheet" href="assets/portal.css">
</head>
<body data-page="sites">
<template id="page">

  <!-- 页头 -->
  <div class="pf-page-head">
    <div class="pf-desc">每个局域网站点以一把 WireGuard 公钥标识身份；公钥可列出、可吊销；隧道断开或吊销后该站点模型立即从路由池摘除（US-P7/P8）。</div>
    <button class="pf-btn primary" data-modal="modal-addsite" id="btn-open-addsite">新增站点</button>
  </div>

  <!-- 站点列表 -->
  <div class="pf-card flush">
    <div class="pf-card-head">
      <div class="pf-card-title">站点列表</div>
      <div class="pf-card-extra" id="sites-extra">加载中…</div>
    </div>
    <table class="pf-table">
      <thead>
        <tr>
          <th>站点名</th><th>公钥指纹</th><th>WG IP</th><th>最近握手</th>
          <th class="num">模型数</th><th>分组</th><th>状态</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="sites-tbody"></tbody>
    </table>
  </div>

  <!-- 新增站点弹窗（两态：表单 → 一次性安装命令） -->
  <div class="pf-modal" id="modal-addsite" style="width:560px">
    <div class="pf-modal-head">
      <div class="pf-modal-title" id="addsite-title">新增站点</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">

      <div id="addsite-form">
        <div class="pf-form-row">
          <label class="req">站点名</label>
          <div>
            <input class="pf-input mono" id="addsite-name" placeholder="例：shenzhen-lab">
            <div class="pf-desc">仅字母/数字/-/_，将出现在站点列表与调用日志中。</div>
          </div>
        </div>
        <div class="pf-form-row">
          <label class="req">模型清单</label>
          <div>
            <div class="pf-desc" style="margin-bottom:8px">格式为「对外模型名:端口」，对应站点机器上已在跑的 OpenAI 兼容模型服务。</div>
            <div id="addsite-models">
              <input class="pf-input mono" style="margin-bottom:8px" placeholder="deepseek-v4-flash-0731:8890">
              <input class="pf-input mono" placeholder="qwen3.6-35b-a3:8004">
            </div>
            <button class="pf-link" id="addsite-addmodel" type="button">+ 再加一个模型</button>
          </div>
        </div>
        <div class="pf-form-row">
          <label>WG IP</label>
          <div class="pf-desc" style="padding-top:6px">自动从 10.77.0.x 段分配下一个可用地址，无需手动指定。</div>
        </div>
      </div>

      <div id="addsite-result" style="display:none">
        <div class="pf-banner">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" style="flex:none"><circle cx="8" cy="8" r="6.4"/><path d="M8 4.8v3.8M8 11.2h.01" stroke-width="1.6"/></svg>
          此命令 <strong id="addsite-ttl">限时</strong>、仅可使用一次；过期或复用后返回 403，需重新生成。剩余有效时间：<span class="pf-key" id="addsite-countdown">--:--</span>
        </div>
        <div class="pf-code"><pre id="addsite-cmd"></pre></div>
        <div class="pf-desc" style="margin-top:12px">在该站点机器上以可出站 UDP、可 sudo 的账户执行以上命令。<span class="mono">install.sh</span> 将自动完成：生成 WireGuard 密钥对（私钥不离开该机器）→ 注册公钥 → 建立隧道 → <span class="mono">systemctl enable --now wg-quick@wg0</span> 自启 → 模型端口连通性自检并回显结果；全绿后模型立即进入路由池。</div>
      </div>

    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" id="addsite-cancel" data-close>取消</button>
      <button class="pf-btn primary" id="btn-gen-addsite">生成安装命令</button>
      <button class="pf-btn primary" id="btn-addsite-done" style="display:none">完成</button>
    </div>
  </div>

  <!-- 吊销确认弹窗 -->
  <div class="pf-modal" id="modal-revoke" style="width:460px">
    <div class="pf-modal-head">
      <div class="pf-modal-title">吊销站点确认</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">
      <p style="margin:0 0 12px;font-size:12.5px">确定要吊销站点「<strong id="revoke-site-name"></strong>」吗？</p>
      <div class="pf-banner">
        吊销后：① 隧道<strong>立即断开</strong>且无法重连；② 该站点全部 <span id="revoke-model-count">0</span> 个模型部署<strong>即刻从路由池摘除</strong>；③ 操作不可逆，需重新走「新增站点」才能再次接入。
      </div>
      <div class="pf-kv">
        <div class="pf-kv-k">WG IP</div><div class="pf-kv-v mono" id="revoke-wg"></div>
        <div class="pf-kv-k">影响范围</div><div class="pf-kv-v">经该站点分流的请求将全部转到其余健康站点；若无其余健康部署，客户端将收到可判读的 503。</div>
      </div>
    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" data-close>取消</button>
      <button class="pf-btn danger" id="btn-revoke-confirm">确认吊销</button>
    </div>
  </div>

  <!-- 调整站点分组弹窗（多选；default 系统组恒属） -->
  <div class="pf-modal" id="modal-site-groups" style="width:440px">
    <div class="pf-modal-head">
      <div class="pf-modal-title">调整站点分组 · <span id="sg-site-name" class="mono"></span></div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-modal-body">
      <div class="pf-desc" style="margin-bottom:10px">勾选该 provider 所属分组（可多选）。<span class="pf-chip">default</span> 为系统组（全部在线 provider 恒属 default，未绑组 Key 走 default）。新分组在「分组」页创建。</div>
      <div id="sg-checks"></div>
    </div>
    <div class="pf-modal-foot">
      <button class="pf-btn" data-close>取消</button>
      <button class="pf-btn primary" id="btn-sg-save">保存</button>
    </div>
  </div>

</template>
<script src="assets/portal.js"></script>
<script>
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ago(sec) {
    if (sec === null || sec === undefined) return '未知';
    if (sec < 0) return '从未握手';
    if (sec < 60) return sec + ' 秒前';
    if (sec < 3600) return Math.round(sec / 60) + ' 分钟前';
    if (sec < 86400) return Math.round(sec / 3600) + ' 小时前';
    return Math.round(sec / 86400) + ' 天前';
  }
  var SITE_DATA = [];

  function render(sites) {
    SITE_DATA = sites;
    var online = sites.filter(function (s) { return s.online; }).length;
    document.getElementById('sites-extra').textContent = '共 ' + sites.length + ' 个 · ' + online + ' 个在线';
    document.getElementById('sites-tbody').innerHTML = sites.map(function (s) {
      var revoked = s.status === 'revoked';
      var groups = '<span class="pf-chip">default</span> ' + (s.groups || []).map(function (g) {
        return '<span class="pf-chip">' + esc(g) + '</span>';
      }).join(' ');
      var statusChip = revoked ? '<span class="pf-chip gray">已吊销</span>'
        : s.online ? '<span class="pf-chip ok"><span class="pf-dot ok"></span>在线</span>'
        : '<span class="pf-chip warn">' + esc(s.status) + '</span>';
      var actions = revoked ? '<button class="pf-link" disabled>已吊销</button>'
        : '<button class="pf-link js-edit-groups" data-site="' + esc(s.name) + '">分组</button> ' +
          '<button class="pf-link danger js-revoke-btn" data-site="' + esc(s.name) + '" data-wg="' + esc(s.wg_ip) + '" data-models="' + s.models.length + '">吊销</button>';
      return '<tr' + (revoked ? ' class="pf-row-muted"' : '') + ' data-site-row="' + esc(s.name) + '">' +
        '<td>' + esc(s.name) + '</td>' +
        '<td><span class="pf-key">' + esc(s.pubkey) + '</span></td>' +
        '<td class="mono">' + esc(s.wg_ip) + '</td>' +
        '<td class="mono">' + ago(s.handshake) + '</td>' +
        '<td class="num">' + s.models.length + '</td>' +
        '<td class="site-groups">' + groups + '</td>' +
        '<td class="site-status">' + statusChip + '</td>' +
        '<td>' + actions + '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="8" class="pf-desc" style="padding:10px">暂无站点，点右上「新增站点」接入第一个</td></tr>';
    bindRowActions();
  }

  function load() {
    window.pfApi('GET', '/sites').then(function (d) { render(d.sites); })
      .catch(function (e) { window.pfErr(e.error || '站点加载失败'); });
  }

  var pendingRevoke = null, sgSite = null;

  function bindRowActions() {
    document.querySelectorAll('.js-revoke-btn').forEach(function (btn) {
      btn.onclick = function () {
        pendingRevoke = btn.dataset.site;
        document.getElementById('revoke-site-name').textContent = btn.dataset.site;
        document.getElementById('revoke-wg').textContent = btn.dataset.wg;
        document.getElementById('revoke-model-count').textContent = btn.dataset.models;
        window.pfModal('modal-revoke');
      };
    });
    document.querySelectorAll('.js-edit-groups').forEach(function (btn) {
      btn.onclick = function () {
        sgSite = btn.dataset.site;
        document.getElementById('sg-site-name').textContent = sgSite;
        var site = SITE_DATA.filter(function (s) { return s.name === sgSite; })[0] || {};
        var current = site.groups || [];
        window.pfApi('GET', '/groups').then(function (d) {
          document.getElementById('sg-checks').innerHTML =
            '<label style="display:block;margin:6px 0;opacity:.75"><input type="checkbox" checked disabled> <span class="pf-chip">default</span> 系统组（恒属，不可取消）</label>' +
            d.groups.filter(function (g) { return !g.system; }).map(function (g) {
              return '<label style="display:block;margin:6px 0"><input type="checkbox" class="sg-cb" value="' + esc(g.name) + '"' +
                (current.indexOf(g.name) >= 0 ? ' checked' : '') + '> <span class="pf-chip">' + esc(g.name) + '</span></label>';
            }).join('') || '<div class="pf-desc">暂无自定义分组（在「分组」页创建）</div>';
          window.pfModal('modal-site-groups');
        }).catch(function (e) { window.pfErr(e.error || '分组加载失败'); });
      };
    });
  }

  window.pfReady.then(function () {
    load();

    /* ---------- 新增站点：表单 → 结果两态 + 倒计时 ---------- */
    var countdownTimer = null;
    function addsiteState(showResult) {
      document.getElementById('addsite-form').style.display = showResult ? 'none' : '';
      document.getElementById('addsite-result').style.display = showResult ? '' : 'none';
      document.getElementById('addsite-cancel').style.display = showResult ? 'none' : '';
      document.getElementById('btn-gen-addsite').style.display = showResult ? 'none' : '';
      document.getElementById('btn-addsite-done').style.display = showResult ? '' : 'none';
      document.getElementById('addsite-title').textContent = showResult ? '安装命令已生成（一次性）' : '新增站点';
      if (!showResult) clearInterval(countdownTimer);
    }
    document.getElementById('btn-open-addsite').addEventListener('click', function () { addsiteState(false); });
    document.getElementById('addsite-addmodel').addEventListener('click', function () {
      var input = document.createElement('input');
      input.className = 'pf-input mono';
      input.style.marginBottom = '8px';
      input.placeholder = '对外模型名:端口';
      document.getElementById('addsite-models').appendChild(input);
    });

    document.getElementById('btn-gen-addsite').addEventListener('click', function () {
      var name = document.getElementById('addsite-name').value.trim();
      var models = [];
      var bad = false;
      document.querySelectorAll('#addsite-models input').forEach(function (inp) {
        var v = inp.value.trim();
        if (!v) return;
        var m = v.split(':');
        if (m.length !== 2 || !m[0] || !(parseInt(m[1], 10) > 0)) { inp.style.borderColor = '#c0392b'; bad = true; return; }
        inp.style.borderColor = '';
        models.push({ name: m[0].trim(), port: parseInt(m[1], 10) });
      });
      if (!name || bad || !models.length) { window.pfErr('请检查站点名与「模型名:端口」格式'); return; }
      window.pfApi('POST', '/sites/token', { site: name, models: models, groups: ['default'] }).then(function (d) {
        document.getElementById('addsite-cmd').textContent = d.install_command;
        document.getElementById('addsite-ttl').textContent = Math.round(d.expires_in / 60) + ' 分钟内有效';
        var left = d.expires_in;
        var el = document.getElementById('addsite-countdown');
        clearInterval(countdownTimer);
        function tick() {
          var m = Math.floor(left / 60), s = left % 60;
          el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
        }
        tick();
        countdownTimer = setInterval(function () {
          left -= 1;
          if (left < 0) { clearInterval(countdownTimer); el.textContent = '已过期'; return; }
          tick();
        }, 1000);
        addsiteState(true);
      }).catch(function (e) { window.pfErr(e.error || '生成失败'); });
    });
    document.getElementById('btn-addsite-done').addEventListener('click', function () {
      window.pfModalClose(); addsiteState(false); load();
    });

    /* ---------- 吊销确认 ---------- */
    document.getElementById('btn-revoke-confirm').addEventListener('click', function () {
      if (!pendingRevoke) return;
      window.pfApi('POST', '/sites/revoke', { site: pendingRevoke }).then(function () {
        window.pfModalClose();
        window.pfToast('站点已吊销，隧道已断开');
        load();
      }).catch(function (e) { window.pfErr(e.error || '吊销失败'); });
    });

    /* ---------- 调整站点分组 ---------- */
    document.getElementById('btn-sg-save').addEventListener('click', function () {
      var groups = ['default'];
      document.querySelectorAll('.sg-cb').forEach(function (cb) { if (cb.checked) groups.push(cb.value); });
      window.pfApi('POST', '/sites/groups', { site: sgSite, groups: groups }).then(function () {
        window.pfModalClose();
        window.pfToast('站点分组已更新');
        load();
      }).catch(function (e) { window.pfErr(e.error || '保存失败'); });
    });
  });
})();
</script>
</body>
</html>
