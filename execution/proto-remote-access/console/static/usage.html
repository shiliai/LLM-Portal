<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用量总览 · 远程模型网关</title>
<link rel="stylesheet" href="assets/portal.css">
</head>
<body data-page="usage">
<template id="page">

  <div class="pf-page-head">
    <div class="pf-desc">管理员用量视图汇总全部 Key 的请求数与 token 消耗（取上游 usage 字段，不含计费），可按 Key / 模型筛选（US-P9）。</div>
  </div>

  <!-- 筛选栏 -->
  <div class="pf-card">
    <div class="pf-toolbar">
      <select class="pf-select" id="filter-key"><option value="">全部 Key</option></select>
      <select class="pf-select" id="filter-model"><option value="">全部模型</option></select>
      <select class="pf-select" id="filter-days">
        <option value="1">今天</option>
        <option value="7">最近 7 天</option>
        <option value="30">最近 30 天</option>
      </select>
    </div>
  </div>

  <!-- 明细表 -->
  <div class="pf-card flush">
    <div class="pf-card-head">
      <div class="pf-card-title" id="usage-title">用量明细</div>
      <div class="pf-card-extra" id="usage-extra">加载中…</div>
    </div>
    <table class="pf-table" id="usage-table">
      <thead>
        <tr><th>Key</th><th>模型</th><th class="num">请求数</th><th class="num">输入 Token</th><th class="num">缓存读取</th><th class="num">输出 Token</th><th class="num">总 Token</th><th class="num">平均延迟</th></tr>
      </thead>
      <tbody id="usage-rows"></tbody>
      <tfoot>
        <tr>
          <td colspan="2" style="font-weight:600">合计</td>
          <td class="num" style="font-weight:600" id="sum-req">0</td>
          <td class="num" style="font-weight:600" id="sum-in">0</td>
          <td class="num" style="font-weight:600" id="sum-cache">0</td>
          <td class="num" style="font-weight:600" id="sum-out">0</td>
          <td class="num" style="font-weight:600" id="sum-total">0</td>
          <td class="num" style="font-weight:600" id="sum-lat">—</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <!-- 请求明细（逐次，参照 sub2api 日志视图） -->
  <div class="pf-card flush">
    <div class="pf-card-head">
      <div class="pf-card-title" id="rl-title">请求明细</div>
      <div class="pf-card-extra" id="rl-extra">加载中…</div>
    </div>
    <div class="pf-toolbar" style="padding:10px 12px 0">
      <input class="pf-input" id="rl-search" placeholder="搜索模型 / request_id / 备注…">
      <select class="pf-select" id="rl-status">
        <option value="">全部状态</option>
        <option value="ok">成功</option>
        <option value="failure">失败</option>
      </select>
      <span style="flex:1"></span>
      <button class="pf-btn sm" id="rl-prev" type="button">‹ 上一页</button>
      <span class="pf-desc" id="rl-page" style="min-width:64px;text-align:center">—</span>
      <button class="pf-btn sm" id="rl-next" type="button">下一页 ›</button>
    </div>
    <table class="pf-table">
      <thead>
        <tr><th>时间</th><th>Key</th><th>模型</th><th>类型</th><th class="num">输入</th><th class="num">缓存读</th><th class="num">输出</th><th class="num">总计</th><th class="num">延迟</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody id="rl-rows"></tbody>
    </table>
    <div class="pf-desc" style="padding:8px 12px">鉴权失败不产生日志行（鉴权层直接 401）；明细最多保留最近 500 条。</div>
  </div>

  <!-- 按 Key 请求占比（纯 CSS 条形图） -->
  <div class="pf-card">
    <div class="pf-card-head"><div class="pf-card-title" id="bar-title">按 Key 的请求占比</div></div>
    <div id="key-bars"></div>
  </div>

  <!-- 近期错误 -->
  <div class="pf-card flush">
    <div class="pf-card-head"><div class="pf-card-title">近期错误</div></div>
    <table class="pf-table">
      <thead>
        <tr><th>时间</th><th>Key</th><th>请求模型</th><th>说明</th></tr>
      </thead>
      <tbody id="err-rows"></tbody>
    </table>
    <div class="pf-desc" style="padding:8px 12px">错误仅覆盖已入账请求（鉴权失败不产生日志行）。</div>
  </div>

  <!-- 请求详情抽屉 -->
  <div class="pf-drawer" id="drawer-reqlog">
    <div class="pf-drawer-head">
      <div class="pf-drawer-title">请求详情</div>
      <button class="pf-x" data-close>×</button>
    </div>
    <div class="pf-drawer-body">
      <div class="pf-kv" id="rl-detail"></div>
      <div id="rl-err" style="margin-top:14px"></div>
    </div>
  </div>

</template>
<script src="assets/portal.js"></script>
<script>
(function () {
  'use strict';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmtN(n) { return Number(n || 0).toLocaleString('zh-CN'); }
  var ALL = [];

  function applyFilter() {
    var k = document.getElementById('filter-key').value;
    var m = document.getElementById('filter-model').value;
    var shown = ALL.filter(function (r) { return (!k || r.alias === k) && (!m || r.model === m); });
    document.getElementById('usage-rows').innerHTML = shown.map(function (r) {
      return '<tr>' +
        '<td><span class="pf-key">…' + esc(r.key) + '</span> ' + esc(r.alias) + '</td>' +
        '<td class="mono">' + esc(r.model === '?' ? '（未解析）' : r.model) + '</td>' +
        '<td class="num">' + fmtN(r.requests) + '</td>' +
        '<td class="num">' + fmtN(r.prompt_tokens) + '</td>' +
        '<td class="num">' + fmtN(r.cached_tokens) + '</td>' +
        '<td class="num">' + fmtN(r.completion_tokens) + '</td>' +
        '<td class="num" style="font-weight:600">' + fmtN(r.total_tokens) + '</td>' +
        '<td class="num">' + (r.avg_ms >= 1000 ? (r.avg_ms / 1000).toFixed(1) + ' s' : r.avg_ms + ' ms') + '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="8"><div class="pf-empty"><div class="pf-empty-icon">▢</div>没有符合筛选条件的用量记录</div></td></tr>';
    document.getElementById('sum-req').textContent = fmtN(shown.reduce(function (n, r) { return n + r.requests; }, 0));
    document.getElementById('sum-in').textContent = fmtN(shown.reduce(function (n, r) { return n + r.prompt_tokens; }, 0));
    document.getElementById('sum-cache').textContent = fmtN(shown.reduce(function (n, r) { return n + r.cached_tokens; }, 0));
    document.getElementById('sum-out').textContent = fmtN(shown.reduce(function (n, r) { return n + r.completion_tokens; }, 0));
    document.getElementById('sum-total').textContent = fmtN(shown.reduce(function (n, r) { return n + r.total_tokens; }, 0));
    var totReq = shown.reduce(function (n, r) { return n + r.requests; }, 0);
    var totMs = shown.reduce(function (n, r) { return n + (r.duration_ms_sum || 0); }, 0);
    var avg = totReq ? Math.round(totMs / totReq) : 0;
    document.getElementById('sum-lat').textContent = totReq ? (avg >= 1000 ? (avg / 1000).toFixed(1) + ' s' : avg + ' ms') : '—';
  }

  function render(d, daysLabel) {
    ALL = d.rows;
    document.getElementById('usage-title').textContent = '用量明细（' + daysLabel + '）';
    document.getElementById('usage-extra').textContent =
      '合计 ' + fmtN(d.totals.requests) + ' 次 · 输入 ' + fmtN(d.totals.prompt_tokens) +
      ' · 缓存读取 ' + fmtN(d.totals.cached_tokens) + ' · 输出 ' + fmtN(d.totals.completion_tokens) +
      ' · 总计 ' + fmtN(d.totals.total_tokens);
    var keys = [], models = [];
    ALL.forEach(function (r) {
      if (keys.indexOf(r.alias) < 0) keys.push(r.alias);
      if (models.indexOf(r.model) < 0) models.push(r.model);
    });
    document.getElementById('filter-key').innerHTML = '<option value="">全部 Key</option>' +
      keys.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + '</option>'; }).join('');
    document.getElementById('filter-model').innerHTML = '<option value="">全部模型</option>' +
      models.map(function (m) { return '<option value="' + esc(m) + '">' + esc(m) + '</option>'; }).join('');
    applyFilter();

    var perKey = (d.per_key || []).filter(function (kv) { return kv[0] !== '已删除密钥'; });
    var max = perKey.length ? perKey[0][1] : 1;
    document.getElementById('bar-title').textContent = '按 Key 的请求占比（' + daysLabel + '）';
    document.getElementById('key-bars').innerHTML = perKey.map(function (kv, i) {
      var pct = max ? Math.round(kv[1] / max * 100) : 0;
      return '<div class="pf-bar-item">' +
        '<div class="pf-bar-label">' + esc(kv[0]) + '</div>' +
        '<div class="pf-bar-track"><span class="pf-bar-fill' + (i % 2 ? ' violet' : '') + '" style="width:' + pct + '%"></span></div>' +
        '<div class="pf-bar-value">' + fmtN(kv[1]) + ' 次</div>' +
      '</div>';
    }).join('') || '<div class="pf-desc" style="padding:10px 12px">所选时间范围暂无请求</div>';

    document.getElementById('err-rows').innerHTML = d.errors.map(function (e) {
      return '<tr>' +
        '<td class="mono">' + esc((e.time || '').replace('T', ' ').slice(5)) + '</td>' +
        '<td><span class="pf-key">' + esc(e.key) + '</span></td>' +
        '<td class="mono">' + esc(e.model) + '</td>' +
        '<td class="pf-desc">' + esc(e.detail) + '</td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="4" class="pf-desc" style="padding:10px">所选时间范围无已入账错误</td></tr>';
  }

  /* ---------- 请求明细（逐次） ---------- */
  var RL = [], rlPage = 1, RL_PAGE_SIZE = 20;

  function rlFiltered() {
    var q = document.getElementById('rl-search').value.trim().toLowerCase();
    var st = document.getElementById('rl-status').value;
    return RL.filter(function (r) {
      if (st && r.status !== st) return false;
      if (q && (r.model + ' ' + r.request_id + ' ' + r.alias + ' ' + (r.error || '')).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function rlRender() {
    var list = rlFiltered();
    var pages = Math.max(1, Math.ceil(list.length / RL_PAGE_SIZE));
    if (rlPage > pages) rlPage = pages;
    var slice = list.slice((rlPage - 1) * RL_PAGE_SIZE, rlPage * RL_PAGE_SIZE);
    var fails = RL.filter(function (r) { return r.status === 'failure'; }).length;
    document.getElementById('rl-title').textContent = '请求明细';
    document.getElementById('rl-extra').textContent =
      '共 ' + fmtN(list.length) + ' 次' + (list.length !== RL.length ? '（总 ' + fmtN(RL.length) + '）' : '') +
      (fails ? ' · 失败 ' + fails : '');
    document.getElementById('rl-page').textContent = rlPage + ' / ' + pages;
    document.getElementById('rl-prev').disabled = rlPage <= 1;
    document.getElementById('rl-next').disabled = rlPage >= pages;
    document.getElementById('rl-rows').innerHTML = slice.map(function (r, i) {
      var idx = (rlPage - 1) * RL_PAGE_SIZE + i;
      var tt = r.prompt_tokens + r.completion_tokens + r.cached_tokens;
      return '<tr' + (r.status === 'failure' ? ' class="pf-row-muted"' : '') + '>' +
        '<td class="mono">' + esc((r.ts || '').replace('T', ' ').slice(5)) + '</td>' +
        '<td><span class="pf-key">' + esc(r.key) + '</span> ' + esc(r.alias) + '</td>' +
        '<td class="mono">' + esc(r.model) + '</td>' +
        '<td>' + esc(r.call_type || '—') + '</td>' +
        '<td class="num">' + fmtN(r.prompt_tokens) + '</td>' +
        '<td class="num">' + fmtN(r.cached_tokens) + '</td>' +
        '<td class="num">' + fmtN(r.completion_tokens) + '</td>' +
        '<td class="num" style="font-weight:600">' + fmtN(tt) + '</td>' +
        '<td class="num">' + (r.duration_ms >= 1000 ? (r.duration_ms / 1000).toFixed(1) + ' s' : r.duration_ms + ' ms') + '</td>' +
        '<td>' + (r.status === 'failure'
          ? '<span class="pf-chip err">失败</span>'
          : '<span class="pf-chip ok">成功</span>') + '</td>' +
        '<td><button class="pf-link js-rl-detail" data-i="' + idx + '">详情</button></td>' +
      '</tr>';
    }).join('') || '<tr><td colspan="11"><div class="pf-empty"><div class="pf-empty-icon">▢</div>没有符合条件的请求</div></td></tr>';
    document.querySelectorAll('.js-rl-detail').forEach(function (btn) {
      btn.onclick = function () { rlDetail(rlFiltered()[+btn.dataset.i]); };
    });
  }

  function rlDetail(r) {
    var kv = document.getElementById('rl-detail');
    kv.innerHTML =
      '<div class="pf-kv-k">时间</div><div class="pf-kv-v mono">' + esc((r.ts || '').replace('T', ' ')) + '</div>' +
      '<div class="pf-kv-k">Key</div><div class="pf-kv-v"><span class="pf-key">' + esc(r.key) + '</span> ' + esc(r.alias) + '</div>' +
      '<div class="pf-kv-k">模型</div><div class="pf-kv-v mono">' + esc(r.model) + '</div>' +
      '<div class="pf-kv-k">调用类型</div><div class="pf-kv-v mono">' + esc(r.call_type || '—') + '</div>' +
      '<div class="pf-kv-k">状态</div><div class="pf-kv-v">' + (r.status === 'failure' ? '<span class="pf-chip err">失败</span>' : '<span class="pf-chip ok">成功</span>') + '</div>' +
      '<div class="pf-kv-k">输入 Token</div><div class="pf-kv-v">' + fmtN(r.prompt_tokens) + '</div>' +
      '<div class="pf-kv-k">缓存读取</div><div class="pf-kv-v">' + fmtN(r.cached_tokens) + '</div>' +
      '<div class="pf-kv-k">输出 Token</div><div class="pf-kv-v">' + fmtN(r.completion_tokens) + '</div>' +
      '<div class="pf-kv-k">总 Token</div><div class="pf-kv-v" style="font-weight:600">' + fmtN(r.prompt_tokens + r.completion_tokens + r.cached_tokens) + '</div>' +
      '<div class="pf-kv-k">延迟</div><div class="pf-kv-v">' + (r.duration_ms >= 1000 ? (r.duration_ms / 1000).toFixed(1) + ' s' : r.duration_ms + ' ms') + '</div>' +
      '<div class="pf-kv-k">Request ID</div><div class="pf-kv-v mono" style="word-break:break-all">' + esc(r.request_id || '—') + '</div>' +
      '<div class="pf-kv-k">Session ID</div><div class="pf-kv-v mono" style="word-break:break-all">' + esc(r.session_id || '—') + '</div>';
    document.getElementById('rl-err').innerHTML = r.error
      ? '<div class="pf-banner">失败原因：' + esc(r.error) + '</div>' : '';
    window.pfDrawer('drawer-reqlog');
  }

  function rlLoad(days) {
    window.pfApi('GET', '/usage/logs?days=' + days).then(function (d) {
      RL = d.logs || [];
      rlPage = 1;
      rlRender();
    }).catch(function (e) { window.pfErr(e.error || '请求明细加载失败'); });
  }

  window.pfReady.then(function () {
    function load() {
      var days = document.getElementById('filter-days').value;
      var label = days === '1' ? '今天' : '最近 ' + days + ' 天';
      window.pfApi('GET', '/usage?days=' + days).then(function (d) { render(d, label); })
        .catch(function (e) { window.pfErr(e.error || '用量加载失败'); });
      rlLoad(days);
    }
    ['filter-key', 'filter-model'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', applyFilter);
    });
    document.getElementById('filter-days').addEventListener('change', load);
    document.getElementById('rl-search').addEventListener('input', function () { rlPage = 1; rlRender(); });
    document.getElementById('rl-status').addEventListener('change', function () { rlPage = 1; rlRender(); });
    document.getElementById('rl-prev').addEventListener('click', function () { if (rlPage > 1) { rlPage--; rlRender(); } });
    document.getElementById('rl-next').addEventListener('click', function () { rlPage++; rlRender(); });
    load();
  });
})();
</script>
</body>
</html>
